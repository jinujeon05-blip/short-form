<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>QR 메뉴판 비용 계산기</title>
<!-- 미리보기(2026-11-17): quicktables.site 벤치마킹 1번. 소개서(/)에는 아직 링크 안 함. 숫자·가격은 /content.js 의 PRICES·CONTACT를 씀 -->
<style>
  :root {
    --ink: #16130f; --paper: #faf7f2; --card: #fff; --line: #e9e2d7; --muted: #6f675d;
    --accent: #e0452b; --accent-2: #f2a03d; --good: #1f8a4c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  h1, h2, h3 { margin: 0; line-height: 1.25; letter-spacing: -.3px; }
  section { padding: 44px 0; }
  .sec-title { font-size: 26px; font-weight: 800; }
  .sec-sub { margin: 8px 0 0; color: var(--muted); }

  .hero { background: radial-gradient(120% 90% at 85% 0%, #3a2416 0%, var(--ink) 55%); color: #fff; padding: 16px 0 44px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .logo { font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo i { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #d8cfc3; background: transparent; border: 1px solid #5a4f43; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--ink); background: #fff; border-color: #fff; }
  .kicker { display: inline-block; margin-top: 34px; font-size: 13px; font-weight: 700; color: var(--accent-2); border: 1px solid rgba(242,160,61,.4); border-radius: 999px; padding: 4px 12px; }
  .hero h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 900; margin-top: 14px; }
  .hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: #d8cfc3; font-size: 17px; margin: 14px 0 0; max-width: 34em; }

  /* 계산기 */
  .tabs { display: flex; gap: 6px; margin-top: 22px; background: #efe8dc; border-radius: 14px; padding: 5px; }
  .tabs button { flex: 1; font: inherit; font-weight: 700; font-size: 15px; border: 0; border-radius: 10px; padding: 11px 8px; background: transparent; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .calc { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .calc[hidden] { display: none; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 15px; }
  .field label b { color: var(--accent); white-space: nowrap; }
  .field small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .field input[type=range] { width: 100%; margin-top: 8px; accent-color: var(--accent); }
  .result h3 { font-size: 15px; color: var(--muted); font-weight: 700; }
  .big { font-size: clamp(26px, 4.4vw, 36px); font-weight: 900; margin-top: 4px; }
  .big.bad { color: var(--accent); }
  .big.good { color: var(--good); }
  .rows { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; padding: 4px 0; }
  .row span:last-child { font-weight: 700; white-space: nowrap; }
  .note { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .verdict { margin-top: 14px; border-radius: 12px; padding: 12px 14px; font-weight: 700; background: #eaf6ee; color: var(--good); }
  .verdict.meh { background: #f6f1e8; color: var(--muted); }

  /* 비교표 */
  .tbl-wrap { margin-top: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: #f4eee4; font-size: 14px; }
  thead th.us { background: var(--ink); color: #fff; }
  td.us { background: #fff7f2; font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  .y { color: var(--good); font-weight: 900; }
  .n { color: #b9b0a4; }
  .p { color: var(--accent-2); font-weight: 700; font-size: 13px; }

  /* 신청 */
  .start { background: linear-gradient(135deg, var(--accent), #f0662f); color: #fff; border-radius: 22px; padding: 30px 20px; text-align: center; }
  .start h2 { font-size: 26px; font-weight: 900; }
  .start p { margin: 8px 0 0; opacity: .92; }
  .form { display: flex; gap: 8px; max-width: 480px; margin: 20px auto 0; }
  .form input { flex: 1; min-width: 0; font: inherit; font-size: 16px; border: 0; border-radius: 12px; padding: 13px 14px; }
  .form button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 0 18px; background: var(--ink); color: #fff; cursor: pointer; }
  .sent { display: none; max-width: 480px; margin: 16px auto 0; background: rgba(0,0,0,.18); border-radius: 14px; padding: 14px; text-align: left; }
  .sent.on { display: block; }
  .sent pre { white-space: pre-wrap; font: inherit; background: #fff; color: var(--ink); border-radius: 10px; padding: 10px 12px; margin: 8px 0 10px; }
  .sent .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .sent .acts a, .sent .acts button { font: inherit; font-weight: 700; font-size: 14px; text-decoration: none; border: 0; border-radius: 10px; padding: 9px 14px; background: #fff; color: var(--ink); cursor: pointer; }
  .sent .acts a.zalo { background: #0068ff; color: #fff; }
  .badges { display: flex; justify-content: center; gap: 8px 16px; flex-wrap: wrap; margin-top: 18px; font-size: 14px; font-weight: 700; }
  .find { display: inline-block; margin-top: 18px; color: #fff; font-weight: 700; }
  footer { padding: 28px 0 40px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: inherit; }

  @media (max-width: 720px) {
    .calc { grid-template-columns: 1fr; }
    th, td { padding: 10px 6px; font-size: 13px; }
    thead th { font-size: 12px; }
    .form { flex-direction: column; }
    .form button { padding: 13px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/"><i>QR</i><span>QR MENU</span></a>
      <div class="langs" id="langs"></div>
    </div>
    <span class="kicker" data-t="kicker"></span>
    <h1 data-t="h1" data-html></h1>
    <p data-t="lead"></p>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <h2 class="sec-title" data-t="calcTitle"></h2>
      <p class="sec-sub" data-t="calcSub"></p>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabPaper" aria-selected="true" data-t="tabPaper"></button>
        <button role="tab" id="tabApp" aria-selected="false" data-t="tabApp"></button>
      </div>

      <!-- 가: 종이 메뉴판 -->
      <div class="calc" id="calcPaper">
        <div class="panel">
          <div class="field"><label><span data-t="pBooks"></span><b id="vBooks"></b></label><small data-t="pBooksHint"></small>
            <input type="range" id="books" min="1" max="40" step="1" value="10"></div>
          <div class="field"><label><span data-t="pCost"></span><b id="vCost"></b></label><small data-t="pCostHint"></small>
            <input type="range" id="cost" min="30000" max="500000" step="10000" value="150000"></div>
          <div class="field"><label><span data-t="pTimes"></span><b id="vTimes"></b></label><small data-t="pTimesHint"></small>
            <input type="range" id="times" min="0" max="12" step="1" value="3"></div>
          <div class="field"><label><span data-t="pTrans"></span><b id="vTrans"></b></label><small data-t="pTransHint"></small>
            <input type="range" id="trans" min="0" max="3000000" step="100000" value="1000000"></div>
        </div>
        <div class="panel result">
          <h3 data-t="pResPaper"></h3>
          <div class="big bad" id="rPaper"></div>
          <div class="rows">
            <div class="row"><span data-t="pRowPrint"></span><span id="rPrint"></span></div>
            <div class="row"><span data-t="pRowTrans"></span><span id="rTrans"></span></div>
            <div class="row"><span data-t="pRowUs1"></span><span id="rUs1"></span></div>
            <div class="row"><span data-t="pRowUs2"></span><span id="rUs2"></span></div>
          </div>
          <div class="verdict" id="vPaper"></div>
          <p class="note" data-t="pNote"></p>
        </div>
      </div>

      <!-- 나: 배달앱 수수료 -->
      <div class="calc" id="calcApp" hidden>
        <div class="panel">
          <div class="field"><label><span data-t="aOrders"></span><b id="vOrders"></b></label><small data-t="aOrdersHint"></small>
            <input type="range" id="orders" min="0" max="2000" step="10" value="300"></div>
          <div class="field"><label><span data-t="aAvg"></span><b id="vAvg"></b></label><small data-t="aAvgHint"></small>
            <input type="range" id="avg" min="30000" max="600000" step="10000" value="150000"></div>
          <div class="field"><label><span data-t="aRate"></span><b id="vRate"></b></label><small data-t="aRateHint"></small>
            <input type="range" id="rate" min="0" max="40" step="1" value="25"></div>
          <div class="field"><label><span data-t="aShift"></span><b id="vShift"></b></label><small data-t="aShiftHint"></small>
            <input type="range" id="shift" min="0" max="50" step="5" value="10"></div>
        </div>
        <div class="panel result">
          <h3 data-t="aResFee"></h3>
          <div class="big bad" id="rFee"></div>
          <div class="rows">
            <div class="row"><span data-t="aRowYear"></span><span id="rFeeYear"></span></div>
            <div class="row"><span data-t="aRowSave"></span><span id="rSave"></span></div>
            <div class="row"><span data-t="aRowUs"></span><span id="rUsM"></span></div>
          </div>
          <div class="verdict" id="vApp"></div>
          <p class="note" data-t="aNote"></p>
        </div>
      </div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <h2 class="sec-title" data-t="cmpTitle"></h2>
      <p class="sec-sub" data-t="cmpSub"></p>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th></th><th data-t="colPaper"></th><th data-t="colApp"></th><th class="us" data-t="colUs"></th></tr></thead>
          <tbody id="cmp"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="start">
        <h2 data-t="stTitle"></h2>
        <p data-t="stSub"></p>
        <form class="form" id="form">
          <input id="shop" required maxlength="80" autocomplete="organization">
          <button type="submit" data-t="stBtn"></button>
        </form>
        <div class="sent" id="sent">
          <div data-t="sentLead"></div>
          <pre id="msg"></pre>
          <div class="acts">
            <a class="zalo" id="zaloA" target="_blank" rel="noopener">Zalo</a>
            <a id="telA" data-t="sentCall"></a>
            <button type="button" id="copyB" data-t="sentCopy"></button>
          </div>
        </div>
        <div class="badges"><span data-t="b1"></span><span data-t="b2"></span><span data-t="b3"></span></div>
        <a class="find" href="/stores/" data-t="findLink"></a>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap"><a href="/" data-t="back"></a></div></footer>

<script src="/content.js"></script>

  // 언어 고르기: 소개서(/)와 같은 순서 — ?lang= → 소개서에서 고른 언어(localStorage sales-lang) → 휴대폰 언어 → 한국어
  var LANGS = [["ko", "한국어"], ["vi", "Tiếng Việt"], ["zh", "中文"], ["ja", "日本語"], ["en", "English"]];
  var SUP = LANGS.map(function (x) { return x[0]; });
  function store(fn) { try { return fn(localStorage); } catch (e) { return null; } }
  function detect() {
    var q = new URLSearchParams(location.search).get("lang");
    if (SUP.indexOf(q) >= 0) return q;
    var s = store(function (st) { return st.getItem("sales-lang"); });
    if (SUP.indexOf(s) >= 0) return s;
    var ls = navigator.languages || [navigator.language];
    for (var i = 0; i < ls.length; i++) { var c = (ls[i] || "").toLowerCase().split("-")[0]; if (SUP.indexOf(c) >= 0) return c; }
    return "ko";
  }
  var lang = detect();
  var $ = function (id) { return document.getElementById(id); };
  var t = function (k) { return T[lang][k]; };
  var money = function (n) { return Math.round(n).toLocaleString("vi-VN") + " " + t("unit"); };
  var fill = function (s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k]; }); };

  function render() {
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      var v = fill(t(el.dataset.t) || "", { cart: money(P.cart) });
      if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
    });
    $("shop").placeholder = t("ph");
    $("langs").innerHTML = LANGS.map(function (x) {
      return '<button type="button" data-l="' + x[0] + '" aria-pressed="' + (x[0] === lang) + '">' + x[1] + "</button>";
    }).join("");
    $("cmp").innerHTML = t("rows").map(function (r) {
      return "<tr><td>" + r[0] + "</td>" + r.slice(1).map(function (c, i) {
        var k = c.split(":")[0], txt = c.split(":")[1];
        var mark = k === "y" ? '<span class="y">' + (txt || "✓") + "</span>" : k === "n" ? '<span class="n">✕</span>' : '<span class="p">' + txt + "</span>";
        return "<td" + (i === 2 ? ' class="us"' : "") + ">" + mark + "</td>";
      }).join("") + "</tr>";
    }).join("");
    calc();
    if ($("sent").classList.contains("on")) showMsg();
  }

  function calc() {
    var books = +$("books").value, cost = +$("cost").value, times = +$("times").value, trans = +$("trans").value;
    $("vBooks").textContent = books + " " + t("books"); $("vCost").textContent = money(cost);
    $("vTimes").textContent = times + " " + t("times"); $("vTrans").textContent = money(trans);
    var print = books * cost * times, paper = print + trans;
    var us1 = P.basic + P.yearly, us2 = P.yearly;
    $("rPaper").textContent = money(paper); $("rPrint").textContent = money(print); $("rTrans").textContent = money(trans);
    $("rUs1").textContent = money(us1); $("rUs2").textContent = money(us2);
    var vp = $("vPaper");
    if (paper > us1) { vp.className = "verdict"; vp.textContent = fill(t("vPaperGood"), { x: money(paper - us1) }); }
    else if (print > us2) { vp.className = "verdict"; vp.textContent = fill(t("vPaperGood2"), { x: money(print - us2) }); }
    else { vp.className = "verdict meh"; vp.textContent = t("vPaperMeh"); }

    var orders = +$("orders").value, avg = +$("avg").value, rate = +$("rate").value, shift = +$("shift").value;
    $("vOrders").textContent = orders.toLocaleString("vi-VN"); $("vAvg").textContent = money(avg);
    $("vRate").textContent = rate + "%"; $("vShift").textContent = shift + "%";
    var fee = orders * avg * rate / 100, save = fee * shift / 100;
    $("rFee").textContent = money(fee); $("rFeeYear").textContent = money(fee * 12);
    $("rSave").textContent = money(save); $("rUsM").textContent = money(P.monthly);
    var va = $("vApp");
    if (save > P.monthly) { va.className = "verdict"; va.textContent = fill(t("vAppGood"), { x: money(save - P.monthly) }); }
    else { va.className = "verdict meh"; va.textContent = t("vAppMeh"); }
  }

  function showMsg() {
    var shop = $("shop").value.trim();
    var m = fill(t("msg"), { shop: shop });
    var c = lang === "vi" && C.vi ? C.vi : C;
    $("msg").textContent = m;
    $("zaloA").href = "https://zalo.me/" + String(c.zalo || c.phone).replace(/\D/g, "");
    $("telA").href = "tel:" + String(c.phone).replace(/\s/g, "");
    $("sent").classList.add("on");
  }

  document.addEventListener("input", function (e) { if (e.target.type === "range") calc(); });
  $("langs").addEventListener("click", function (e) { var l = e.target.dataset.l; if (l) { lang = l; store(function (st) { st.setItem("sales-lang", l); }); render(); } });
  [["tabPaper", "calcPaper"], ["tabApp", "calcApp"]].forEach(function (p, i, all) {
    $(p[0]).addEventListener("click", function () {
      all.forEach(function (q) { $(q[0]).setAttribute("aria-selected", q === p); $(q[1]).hidden = q !== p; });
    });
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); showMsg(); });
  $("copyB").addEventListener("click", function () {
    var b = $("copyB"), done = function () { b.textContent = t("copied"); };
    try { navigator.clipboard.writeText($("msg").textContent).then(done, done); } catch (err) { done(); }
  });
  render();
})();
