<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>메뉴 게임 · Trò chơi chọn món</title>
<meta name="description" content="메뉴 게임 · Trò chơi chọn món — 음식 이상형 월드컵, 오늘 뭐 먹지? 룰렛, 간판 룰렛, 사다리타기로 오늘의 메뉴와 가게를 골라보세요.">
<link rel="canonical" href="https://qrmenuasia.com/stores/game.html">
<meta property="og:type" content="website">
<meta property="og:title" content="메뉴 게임 · Trò chơi chọn món">
<meta property="og:description" content="음식 이상형 월드컵 · 오늘 뭐 먹지? 룰렛 · 간판 룰렛 · 사다리타기 — Trò chơi chọn món ăn hôm nay">
<meta property="og:url" content="https://qrmenuasia.com/stores/game.html">
<style>
  :root {
    --ink: #16130f; --ink-2: #2a251f; --paper: #faf7f2; --card: #fff; --line: #e9e2d7;
    --muted: #6f675d; --accent: #e0452b; --accent-2: #f2a03d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; background: var(--paper); color: var(--ink); }
  body {
    line-height: 1.45; -webkit-font-smoothing: antialiased;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  :lang(ko) h1, :lang(ko) h2, :lang(ko) h3, :lang(ko) p { word-break: keep-all; }
  h1, h2, h3, p { margin: 0; }
  button, a { font: inherit; -webkit-tap-highlight-color: transparent; }

  /* 맨 위 어두운 띠 */
  .topbar {
    background: var(--ink); color: #fff; padding: 12px 14px;
    border-bottom: 1px solid #2b241d;
  }
  .topbar-inner {
    max-width: 520px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap;
  }
  .topbar-head {
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .back-stores {
    color: #d8cfc3; text-decoration: none; font-size: 13.5px; font-weight: 700;
    padding: 5px 10px; border-radius: 999px; border: 1px solid #473e34; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .back-stores:hover { background: #2a251f; color: #fff; }
  .top-title {
    font-size: 16.5px; font-weight: 900; letter-spacing: -.3px; color: #fff; white-space: nowrap;
  }
  .langs {
    display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto;
  }
  .langs button {
    font-size: 12px; font-weight: 600; color: #d8cfc3; background: transparent;
    border: 1px solid #5a4f43; border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] {
    color: var(--ink); background: #fff; border-color: #fff;
  }

  /* 본문 공통 */
  .wrap {
    max-width: 520px; margin: 0 auto; padding: 16px 14px 40px; width: 100%;
  }
  [hidden] { display: none !important; }

  /* 칩 */
  .chips {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
  }
  .chip {
    font-size: 13.5px; font-weight: 700; color: var(--ink-2); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer;
    white-space: nowrap; transition: background .15s, color .15s, border-color .15s, opacity .15s;
  }
  .chip[aria-pressed="true"] {
    color: #fff; background: var(--ink); border-color: var(--ink);
  }
  .chip:disabled { opacity: .55; cursor: default; }
  .chip-count {
    font-size: 11.5px; font-weight: 600; opacity: .68; margin-left: 3px;
  }
  .chip[aria-pressed="true"] .chip-count { opacity: .82; }

  /* 첫 화면: 게임 고르기 카드 2장 */
  .game-cards { display: grid; gap: 12px; }
  .game-pick {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 18px 16px; cursor: pointer; color: var(--ink);
    box-shadow: 0 3px 10px rgba(22,19,15,.04);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .game-pick:hover { border-color: #d4c8b8; box-shadow: 0 6px 18px rgba(22,19,15,.08); }
  .game-pick:active { transform: scale(.985); }
  .game-icon {
    flex: none; width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, #fff3eb, #ffe4cf);
    border: 1px solid #f5d5be;
    display: grid; place-items: center; font-size: 28px;
  }
  .game-info { flex: 1; min-width: 0; }
  .game-info h2 { font-size: 18px; font-weight: 900; letter-spacing: -.3px; }
  .game-info p { margin-top: 4px; font-size: 13.5px; color: var(--muted); }
  .game-arrow {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: #f5efe6; color: var(--ink-2); display: grid; place-items: center;
    font-weight: 800; font-size: 15px;
  }

  /* 게임 상단 보조 막대 */
  .sub-nav {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .link-back {
    background: transparent; border: 0; padding: 4px 2px; color: var(--muted);
    font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .link-back:hover { color: var(--ink); }

  /* 공통 사진 영역 (항상 4:3) */
  .photo {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    background: #e9e3da; overflow: hidden;
  }
  .photo img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .photo .fallback {
    position: absolute; inset: 0; display: none; place-items: center;
    background: #e5dfd6; font-size: 42px; color: var(--muted);
  }
  .photo.broken img { display: none; }
  .photo.broken .fallback { display: grid; }

  .spicy { margin-left: 3px; font-size: .92em; }

  /* 버튼 공통 */
  .btn-stack { display: grid; gap: 8px; margin-top: 14px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    min-height: 46px; padding: 11px 16px; border-radius: 13px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-2); font-size: 15px; font-weight: 800;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px; flex: 1; text-align: center;
    transition: transform .12s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn.primary {
    border: 0; color: #fff;
    background: linear-gradient(135deg, var(--accent), #f0662f);
    box-shadow: 0 5px 14px rgba(224,69,43,.26);
  }
  .btn.dark {
    border: 0; color: #fff; background: var(--ink);
  }
  .btn:disabled { opacity: .65; cursor: default; transform: none; }

  /* 게임 1: 이상형 월드컵 */
  .wc-intro-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 24px 16px 20px; box-shadow: 0 6px 20px rgba(22,19,15,.06);
  }
  .wc-intro-title {
    font-size: 21px; font-weight: 900; letter-spacing: -.3px; text-align: center;
    color: var(--ink);
  }
  .wc-intro-desc {
    margin-top: 6px; font-size: 14px; color: var(--muted); text-align: center;
  }
  .wc-intro-box .chips {
    justify-content: center; margin: 18px 0 20px;
  }
  .wc-progress-row {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px;
  }
  .wc-stage { font-size: 15px; font-weight: 900; color: var(--ink); }
  .wc-track {
    height: 4px; width: 100%; background: var(--line); border-radius: 999px;
    overflow: hidden; margin-bottom: 12px;
  }
  .wc-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px; transition: width .25s ease;
  }
  .wc-arena {
    max-width: 420px; margin: 0 auto; position: relative;
    display: flex; flex-direction: column;
  }
  /* 폰에서도 두 카드가 한 화면에 들어오게 사진 높이를 화면 높이에 맞춤 */
  .wc-card .photo { aspect-ratio: auto; height: min(calc(min(100vw, 420px) * .75), calc((100svh - 360px) / 2)); min-height: 150px; }
  .wc-card {
    width: 100%; text-align: left; padding: 0; border: 2px solid var(--line);
    border-radius: 18px; overflow: hidden; background: var(--card); color: var(--ink);
    cursor: pointer; box-shadow: 0 3px 10px rgba(22,19,15,.05);
    transition: transform .36s cubic-bezier(.2,.8,.2,1), opacity .36s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .wc-card:hover { border-color: #d2c5b4; }
  .wc-card.picked {
    transform: scale(1.035); border-color: var(--accent);
    box-shadow: 0 10px 26px rgba(224,69,43,.25); z-index: 2;
  }
  .wc-card.dimmed {
    opacity: .22; transform: scale(.96);
  }
  .wc-body {
    padding: 10px 14px 12px; display: flex; align-items: baseline;
    justify-content: space-between; gap: 10px;
  }
  .wc-main { min-width: 0; flex: 1; }
  .wc-name {
    font-size: 16.5px; font-weight: 800; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .wc-store {
    font-size: 12.5px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wc-price {
    flex: none; font-size: 14px; font-weight: 800; color: var(--accent); white-space: nowrap;
  }
  .vs-badge {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--ink); color: #fff; border: 3px solid var(--paper);
    display: grid; place-items: center; font-size: 12.5px; font-weight: 900;
    margin: -11px auto; position: relative; z-index: 3; pointer-events: none;
    letter-spacing: -.3px;
  }

  /* 월드컵 우승 화면 + CSS 색종이 */
  .win-box {
    position: relative; overflow: hidden; background: var(--card);
    border: 1px solid var(--line); border-radius: 22px; padding: 20px 16px 18px;
    box-shadow: 0 8px 24px rgba(22,19,15,.07);
  }
  .win-badge {
    text-align: center; font-size: 20px; font-weight: 900; margin-bottom: 12px;
    color: var(--ink);
  }
  .win-photo {
    border-radius: 15px; overflow: hidden; border: 1px solid var(--line);
  }
  .win-meta { text-align: center; margin-top: 14px; }
  .win-name { font-size: 21px; font-weight: 900; line-height: 1.25; }
  .win-store { font-size: 14px; color: var(--muted); margin-top: 4px; font-weight: 600; }
  .win-price {
    display: inline-block; margin-top: 6px; padding: 3px 11px; border-radius: 999px;
    background: #fff1ec; color: var(--accent); font-size: 15px; font-weight: 800;
  }
  .runner-up {
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 12.5px; color: var(--muted); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .runner-up b { color: var(--ink-2); font-weight: 700; }

  .confetti {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .confetti i {
    position: absolute; top: -14px; width: 8px; height: 13px; border-radius: 2px;
    opacity: 0; animation: confetti-fall 2.4s ease-out forwards;
  }
  .confetti i:nth-child(1)  { left: 7%;  background: var(--accent);   animation-delay: .02s; }
  .confetti i:nth-child(2)  { left: 15%; background: var(--accent-2); animation-delay: .18s; width: 7px; height: 7px; border-radius: 50%; }
  .confetti i:nth-child(3)  { left: 24%; background: #2fb36d;         animation-delay: .08s; }
  .confetti i:nth-child(4)  { left: 33%; background: #3b82f6;         animation-delay: .28s; }
  .confetti i:nth-child(5)  { left: 42%; background: var(--accent);   animation-delay: .12s; }
  .confetti i:nth-child(6)  { left: 51%; background: var(--accent-2); animation-delay: .04s; }
  .confetti i:nth-child(7)  { left: 60%; background: #e85d9e;         animation-delay: .22s; width: 7px; height: 7px; border-radius: 50%; }
  .confetti i:nth-child(8)  { left: 69%; background: #2fb36d;         animation-delay: .14s; }
  .confetti i:nth-child(9)  { left: 78%; background: var(--accent);   animation-delay: .26s; }
  .confetti i:nth-child(10) { left: 86%; background: #3b82f6;         animation-delay: .06s; }
  .confetti i:nth-child(11) { left: 93%; background: var(--accent-2); animation-delay: .20s; }
  .confetti i:nth-child(12) { left: 19%; background: #e85d9e;         animation-delay: .34s; }
  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: .95; }
    80%  { opacity: .85; }
    100% { transform: translateY(290px) rotate(420deg); opacity: 0; }
  }

  /* 게임 2: 룰렛 */
  .rl-card {
    background: var(--card); border: 2px solid var(--line); border-radius: 22px;
    overflow: hidden; box-shadow: 0 6px 20px rgba(22,19,15,.06);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .rl-card.tick .rl-body {
    animation: slot-tick .09s ease-out;
  }
  .rl-card.sparkle {
    animation: border-sparkle .9s ease-out forwards;
  }
  @keyframes slot-tick {
    0%   { transform: translateY(-4px); opacity: .72; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes border-sparkle {
    0%   { border-color: var(--accent-2); box-shadow: 0 0 0 0 rgba(242,160,61,.65), 0 8px 24px rgba(224,69,43,.25); }
    45%  { border-color: var(--accent);   box-shadow: 0 0 0 7px rgba(242,160,61,.25), 0 10px 28px rgba(224,69,43,.32); }
    75%  { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(224,69,43,.18), 0 8px 22px rgba(224,69,43,.2); }
    100% { border-color: var(--accent);   box-shadow: 0 6px 20px rgba(224,69,43,.16); }
  }
  .rl-body { padding: 16px 16px 18px; text-align: center; }
  .rl-name { font-size: 20px; font-weight: 900; line-height: 1.25; }
  .rl-store { font-size: 14px; color: var(--muted); margin-top: 4px; font-weight: 600; }
  .rl-price {
    display: inline-block; margin-top: 7px; padding: 3px 11px; border-radius: 999px;
    background: #f5efe6; color: var(--ink-2); font-size: 14.5px; font-weight: 800;
  }
  .spin-btn {
    width: 100%; min-height: 54px; font-size: 18px; font-weight: 900; border-radius: 16px;
  }

  /* 게임 3: 가게 간판 룰렛 (슬롯머신처럼 위아래로 넘어감) */
  .sr-filters .chips { margin-bottom: 8px; }
  .sr-count { font-size: 13px; color: var(--muted); font-weight: 700; margin: 2px 0 10px; }
  .sr-window {
    position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden;
    border-radius: 20px; background: #1d1915; border: 2px solid var(--line);
    box-shadow: 0 6px 20px rgba(22,19,15,.08);
  }
  .sr-window.sparkle { animation: border-sparkle .9s ease-out forwards; }
  .sr-window::before, .sr-window::after {
    content: ""; position: absolute; left: 0; right: 0; height: 16%; z-index: 2; pointer-events: none;
  }
  .sr-window::before { top: 0; background: linear-gradient(rgba(0,0,0,.16), transparent); }
  .sr-window::after { bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.16)); }
  .sr-reel { position: absolute; inset: 0; will-change: transform; }
  .sr-cell { position: absolute; left: 0; right: 0; height: 100%; overflow: hidden; background: #1d1915; }
  .sr-cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .sr-cell.logo { background: #fff; }
  .sr-cell.logo img { object-fit: contain; padding: 8% 10%; }
  .sr-cell .sr-noimg {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
    background: linear-gradient(135deg, #2a251f, #4a3426); color: #fff;
    font-size: 24px; font-weight: 900; letter-spacing: -.3px; line-height: 1.25;
  }
  .sr-cell.broken img { display: none; }
  .sr-cell.broken .sr-noimg { display: grid !important; }
  .sr-info {
    margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 16px 16px 14px; text-align: center;
  }
  .sr-name { font-size: 21px; font-weight: 900; line-height: 1.25; letter-spacing: -.3px; overflow-wrap: anywhere; }
  .sr-type { margin-top: 5px; font-size: 14.5px; font-weight: 700; color: var(--ink-2); }
  .sr-addr { margin-top: 6px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .sr-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  .sr-tags span {
    font-size: 12.5px; font-weight: 700; color: var(--ink-2); background: #f5efe6;
    border-radius: 999px; padding: 3px 10px;
  }
  .sr-info.wait .sr-name { color: var(--muted); font-size: 17px; }

  /* 게임 4: 사다리타기 */
  .ld-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 18px 14px 16px; box-shadow: 0 6px 20px rgba(22,19,15,.06);
  }
  .ld-title { font-size: 20px; font-weight: 900; text-align: center; letter-spacing: -.3px; }
  .ld-desc { margin-top: 5px; font-size: 13.5px; color: var(--muted); text-align: center; }
  .ld-count {
    display: flex; align-items: center; justify-content: center; gap: 14px; margin: 16px 0 12px;
  }
  .ld-count b { font-size: 15px; }
  .ld-count output { font-size: 22px; font-weight: 900; min-width: 28px; text-align: center; }
  .ld-step {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #f5efe6;
    font-size: 20px; font-weight: 900; color: var(--ink); cursor: pointer;
  }
  .ld-step:disabled { opacity: .4; cursor: default; }
  .ld-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ld-col h3 { font-size: 13.5px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
  .ld-col input {
    width: 100%; min-width: 0; font: inherit; font-size: 15px; padding: 9px 10px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--paper); color: var(--ink);
  }
  .ld-col input:focus { outline: 2px solid var(--accent-2); outline-offset: 0; border-color: transparent; }
  .ld-board { position: relative; }
  .ld-row { display: grid; gap: 4px; }
  .ld-name, .ld-res {
    min-width: 0; border-radius: 10px; padding: 7px 2px; text-align: center;
    font-size: 12.5px; font-weight: 800; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ld-name {
    border: 2px solid var(--pc, var(--line)); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .ld-name.done { background: var(--pc); color: #fff; }
  .ld-name:disabled { cursor: default; }
  .ld-res { border: 1px dashed var(--line); background: #f5efe6; color: var(--muted); }
  .ld-res.shown { border-style: solid; border-color: var(--pc); background: var(--pc); color: #fff; }
  .ld-svg { display: block; width: 100%; height: 280px; margin: 4px 0; }
  .ld-hint { text-align: center; font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .ld-sum { margin-top: 12px; display: grid; gap: 5px; }
  .ld-sum div {
    display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; border-radius: 11px;
    background: #f5efe6; font-size: 14px; font-weight: 700;
  }
  .ld-sum b { color: var(--pc); overflow-wrap: anywhere; text-align: right; }

  /* 안내 상자 */
  .empty-box {
    text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 36px 16px; color: var(--muted);
  }
  .empty-box p { font-size: 15px; font-weight: 600; margin-bottom: 14px; }

  /* 하단 공통 안내 문구 */
  .notice-foot {
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 12px; line-height: 1.55; color: var(--muted); text-align: center;
    overflow-wrap: break-word;
  }
</style>
</head>
<body>

  const STORES = window.GAME_STORES || {};
  const ALL_DISHES = (window.GAME_DISHES || []).filter((d) => d && STORES[d.s]);
  const badImgs = new Set();

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function saveLang(code) {
    try { localStorage.setItem("sales-lang", code); } catch (e) {}
  }
  function loadLang() {
    try { return localStorage.getItem("sales-lang"); } catch (e) { return null; }
  }
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = loadLang();
    if (SUPPORTED.includes(saved)) return saved;
    const navs = navigator.languages || [navigator.language];
    for (let i = 0; i < navs.length; i++) {
      const code = String(navs[i] || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "ko";
  }

  function saveRegion(r) {
    try { localStorage.setItem("game-region", r); } catch (e) {}
  }
  function loadRegion() {
    try { return localStorage.getItem("game-region") || ""; } catch (e) { return ""; }
  }

  let lang = detectLang();
  let view = "home"; // "home" | "wc" | "rl"
  let timerId = null;

  // 존재하는 region 목록 (전체 + GAME_STORES 에 있는 region 만)
  const rawRegions = Array.from(new Set(Object.values(STORES).map((s) => s && s.region).filter(Boolean)));
  const regions = [
    ...REGION_ORDER.filter((r) => rawRegions.includes(r)),
    ...rawRegions.filter((r) => !REGION_ORDER.includes(r))
  ];
  const regionCounts = { "": ALL_DISHES.length };
  for (let i = 0; i < regions.length; i++) regionCounts[regions[i]] = 0;
  for (let i = 0; i < ALL_DISHES.length; i++) {
    const reg = STORES[ALL_DISHES[i].s].region;
    if (reg) regionCounts[reg] = (regionCounts[reg] || 0) + 1;
  }

  const savedRegion = loadRegion();
  let selectedRegion = regions.includes(savedRegion) ? savedRegion : "";

  function clearPendingTimer() {
    if (timerId !== null) {
      clearTimeout(timerId);
      timerId = null;
    }
  }

  function dishName(d) {
    if (!d || !d.n) return "";
    return d.n[lang] || d.n.en || d.n.ko || "";
  }

  function dishNameHtml(d) {
    return esc(dishName(d)) + (d && d.sp ? '<span class="spicy" aria-hidden="true">🌶</span>' : "");
  }

  function formatPrice(d) {
    if (!d || d.p === null || d.p === undefined) return T[lang].market;
    const st = STORES[d.s];
    const cur = (st && st.cur) || "₫";
    const sep = cur === "₫" ? "." : ",";
    const num = String(Math.round(Number(d.p))).replace(/\B(?=(\d{3})+(?!\d))/g, sep);
    return num + cur;
  }

  function storeMenuUrl(storeId) {
    const st = STORES[storeId];
    if (!st || !st.url) return "/stores/";
    return st.url.replace(/\/$/, "") + "/?lang=" + encodeURIComponent(lang);
  }

  function regionLabel(r) {
    if (!r) return T[lang].all;
    const dict = REGION_NAMES[r];
    return dict ? (dict[lang] || dict.en || r) : r;
  }

  function getPool(onlySpicy) {
    const base = ALL_DISHES.filter((d) => {
      if (selectedRegion && STORES[d.s].region !== selectedRegion) return false;
      if (onlySpicy && !d.sp) return false;
      return true;
    });
    const good = base.filter((d) => d.img && !badImgs.has(d.img));
    return good.length >= 2 ? good : base;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function preload(dishes) {
    for (let i = 0; i < dishes.length; i++) {
      const d = dishes[i];
      if (d && d.img && !badImgs.has(d.img)) {
        const im = new Image();
        im.onerror = function () { badImgs.add(d.img); };
        im.src = d.img;
      }
    }
  }

  function setPhoto(photoEl, imgEl, dish, onFail) {
    photoEl.dataset.img = (dish && dish.img) || "";
    if (!dish || !dish.img || badImgs.has(dish.img)) {
      photoEl.classList.add("broken");
      imgEl.removeAttribute("src");
      imgEl.alt = dish ? dishName(dish) : "";
      return;
    }
    photoEl.classList.remove("broken");
    imgEl.alt = dishName(dish);
    imgEl.onerror = function () {
      if (photoEl.dataset.img !== dish.img) return;
      badImgs.add(dish.img);
      if (onFail && onFail()) return;
      photoEl.classList.add("broken");
    };
    if (imgEl.getAttribute("src") !== dish.img) {
      imgEl.src = dish.img;
    }
  }

  /* ==================== 게임 1: 이상형 월드컵 ==================== */
  const wc = {
    phase: "intro", // "intro" | "play" | "win" | "empty"
    round: [],
    nextRound: [],
    matchIdx: 0,
    used: new Set(),
    storeCounts: {},
    winner: null,
    runnerUp: null,
    busy: false,
    empty: false
  };

  function openWorldCupIntro() {
    clearPendingTimer();
    view = "wc";
    wc.phase = "intro";
    wc.busy = false;
    wc.winner = null;
    wc.runnerUp = null;
    wc.empty = false;
    render();
  }

  function startWorldCup() {
    clearPendingTimer();
    view = "wc";
    const pool = shuffle(getPool(false));
    const counts = {};
    const picked = [];
    for (let i = 0; i < pool.length && picked.length < 16; i++) {
      const d = pool[i];
      if ((counts[d.s] || 0) >= 2) continue;
      counts[d.s] = (counts[d.s] || 0) + 1;
      picked.push(d);
    }
    if (picked.length < 16 && picked.length < pool.length) {
      const pickedSet = new Set(picked);
      for (let i = 0; i < pool.length && picked.length < 16; i++) {
        if (!pickedSet.has(pool[i])) {
          picked.push(pool[i]);
          pickedSet.add(pool[i]);
        }
      }
    }

    let size = 0;
    if (picked.length >= 16) size = 16;
    else if (picked.length >= 8) size = 8;
    else if (picked.length >= 4) size = 4;
    else if (picked.length >= 2) size = 2;

    if (size < 2) {
      wc.phase = "empty";
      wc.empty = true;
      wc.winner = null;
      wc.busy = false;
      render();
      return;
    }

    const bracket = picked.slice(0, size);
    const activeCounts = {};
    for (let i = 0; i < bracket.length; i++) {
      const s = bracket[i].s;
      activeCounts[s] = (activeCounts[s] || 0) + 1;
    }

    wc.phase = "play";
    wc.empty = false;
    wc.round = bracket;
    wc.nextRound = [];
    wc.matchIdx = 0;
    wc.used = new Set(bracket);
    wc.storeCounts = activeCounts;
    wc.winner = null;
    wc.runnerUp = null;
    wc.busy = false;

    preload(bracket.slice(0, 6));
    render();
  }

  function trySwapWcDish(slotOffset) {
    if (view !== "wc" || wc.phase !== "play" || wc.busy || wc.winner) return false;
    const idxInRound = wc.matchIdx * 2 + slotOffset;
    const oldDish = wc.round[idxInRound];
    if (!oldDish) return false;
    const candidates = shuffle(getPool(false));
    let pick = null;
    for (let i = 0; i < candidates.length; i++) {
      const cand = candidates[i];
      if (wc.used.has(cand) || !cand.img || badImgs.has(cand.img)) continue;
      const curCount = (wc.storeCounts[cand.s] || 0) - (cand.s === oldDish.s ? 1 : 0);
      if (curCount >= 2) continue;
      pick = cand;
      break;
    }
    if (!pick) {
      for (let i = 0; i < candidates.length; i++) {
        const cand = candidates[i];
        if (!wc.used.has(cand) && cand.img && !badImgs.has(cand.img)) {
          pick = cand;
          break;
        }
      }
    }
    if (!pick) return false;
    wc.storeCounts[oldDish.s] = Math.max(0, (wc.storeCounts[oldDish.s] || 1) - 1);
    wc.storeCounts[pick.s] = (wc.storeCounts[pick.s] || 0) + 1;
    wc.used.add(pick);
    wc.round[idxInRound] = pick;
    renderWcMatch();
    return true;
  }

  function roundLabel(len, matchIdx) {
    const t = T[lang];
    const total = len / 2;
    if (len === 16) return t.r16 + " " + (matchIdx + 1) + "/" + total;
    if (len === 8) return t.r8 + " " + (matchIdx + 1) + "/" + total;
    if (len === 4) return t.r4 + " " + (matchIdx + 1) + "/" + total;
    return t.r2;
  }

  function renderWcMatch() {
    const d0 = wc.round[wc.matchIdx * 2];
    const d1 = wc.round[wc.matchIdx * 2 + 1];
    if (!d0 || !d1) return;

    const total = wc.round.length / 2;
    $("wcStage").textContent = roundLabel(wc.round.length, wc.matchIdx);
    $("wcFill").style.width = (((wc.matchIdx + 1) / total) * 100).toFixed(1) + "%";

    const c0 = $("wcCard0");
    const c1 = $("wcCard1");
    c0.classList.remove("picked", "dimmed");
    c1.classList.remove("picked", "dimmed");

    setPhoto($("wcPhoto0"), $("wcImg0"), d0, function () { return trySwapWcDish(0); });
    $("wcName0").innerHTML = dishNameHtml(d0);
    $("wcStore0").textContent = STORES[d0.s].name;
    $("wcPrice0").textContent = formatPrice(d0);

    setPhoto($("wcPhoto1"), $("wcImg1"), d1, function () { return trySwapWcDish(1); });
    $("wcName1").innerHTML = dishNameHtml(d1);
    $("wcStore1").textContent = STORES[d1.s].name;
    $("wcPrice1").textContent = formatPrice(d1);

    // 다음 대결 사진 미리 불러오기
    const nextIdx = (wc.matchIdx + 1) * 2;
    if (nextIdx + 1 < wc.round.length) {
      preload([wc.round[nextIdx], wc.round[nextIdx + 1]]);
    }
  }

  function renderWcWin() {
    const t = T[lang];
    const w = wc.winner;
    if (!w) return;
    $("winHeading").textContent = "🏆 " + t.winTitle;
    setPhoto($("winPhoto"), $("winImg"), w, null);
    $("winName").innerHTML = dishNameHtml(w);
    $("winStore").textContent = STORES[w.s].name;
    $("winPrice").textContent = formatPrice(w);
    $("winStoreLink").href = storeMenuUrl(w.s);
    $("winStoreLink").textContent = t.viewMenu;
    $("winReplay").textContent = t.replay;
    $("winToHome").textContent = t.toHome;

    if (wc.runnerUp) {
      $("winRunner").hidden = false;
      $("winRunner").innerHTML = esc(t.runnerUp) + ": <b>" + dishNameHtml(wc.runnerUp) + "</b> · " + esc(STORES[wc.runnerUp.s].name);
    } else {
      $("winRunner").hidden = true;
    }
  }

  function pickWcCard(slot) {
    if (view !== "wc" || wc.phase !== "play" || wc.busy || wc.winner || wc.empty) return;
    const d0 = wc.round[wc.matchIdx * 2];
    const d1 = wc.round[wc.matchIdx * 2 + 1];
    if (!d0 || !d1) return;

    wc.busy = true;
    const chosen = slot === 0 ? d0 : d1;
    const other = slot === 0 ? d1 : d0;

    $("wcCard0").classList.add(slot === 0 ? "picked" : "dimmed");
    $("wcCard1").classList.add(slot === 1 ? "picked" : "dimmed");

    timerId = setTimeout(function () {
      timerId = null;
      wc.nextRound.push(chosen);
      const total = wc.round.length / 2;
      if (wc.matchIdx + 1 < total) {
        wc.matchIdx++;
        wc.busy = false;
        renderWcMatch();
      } else if (wc.nextRound.length === 1) {
        wc.phase = "win";
        wc.winner = chosen;
        wc.runnerUp = other;
        wc.busy = false;
        // 색종이 애니메이션 재생
        const cf = $("wcConfetti");
        const clone = cf.cloneNode(true);
        cf.parentNode.replaceChild(clone, cf);
        render();
      } else {
        wc.round = wc.nextRound;
        wc.nextRound = [];
        wc.matchIdx = 0;
        wc.busy = false;
        preload(wc.round.slice(0, 4));
        renderWcMatch();
      }
    }, 400);
  }

  /* ==================== 게임 2: 룰렛 ==================== */
  const rl = {
    spicyOnly: false,
    spinning: false,
    done: false,
    current: null
  };

  function initRoulette(keepSpicy) {
    clearPendingTimer();
    view = "rl";
    if (!keepSpicy) rl.spicyOnly = false;
    rl.spinning = false;
    rl.done = false;
    $("rlCard").classList.remove("sparkle", "tick");

    const pool = getPool(rl.spicyOnly);
    if (!pool.length) {
      rl.current = null;
      render();
      return;
    }
    rl.current = pool[Math.floor(Math.random() * pool.length)];
    preload(shuffle(pool).slice(0, 16));
    render();
  }

  function renderRlCard() {
    const d = rl.current;
    if (!d) return;
    setPhoto($("rlPhoto"), $("rlImg"), d, function () {
      if (rl.spinning) return false;
      const pool = getPool(rl.spicyOnly).filter((x) => x !== d && x.img && !badImgs.has(x.img));
      if (!pool.length) return false;
      rl.current = pool[Math.floor(Math.random() * pool.length)];
      renderRlCard();
      if (rl.done) $("rlStoreLink").href = storeMenuUrl(rl.current.s);
      return true;
    });
    $("rlName").innerHTML = dishNameHtml(d);
    $("rlStore").textContent = STORES[d.s].name;
    $("rlPrice").textContent = formatPrice(d);
    $("rlStoreLink").href = storeMenuUrl(d.s);
  }

  function spinRoulette() {
    if (rl.spinning) return;
    const pool = getPool(rl.spicyOnly);
    if (!pool.length) return;

    clearPendingTimer();
    rl.spinning = true;
    rl.done = false;

    const card = $("rlCard");
    card.classList.remove("sparkle", "tick");

    // 합계 약 4초(4000ms) 동안 빠르게 바뀌다가 점점 느려짐
    const delays = [50, 53, 57, 62, 68, 75, 84, 94, 106, 120, 136, 154, 175, 200, 228, 260, 298, 342, 398, 460, 580];
    const seq = [];
    let prev = rl.current;
    for (let i = 0; i < delays.length; i++) {
      let pick = pool[Math.floor(Math.random() * pool.length)];
      if (pool.length > 1) {
        let guard = 0;
        while (pick === prev && guard++ < 8) {
          pick = pool[Math.floor(Math.random() * pool.length)];
        }
      }
      seq.push(pick);
      prev = pick;
    }
    preload(seq);
    renderRlControls();

    let step = 0;
    function tick() {
      rl.current = seq[step];
      renderRlCard();
      card.classList.remove("tick");
      void card.offsetWidth;
      card.classList.add("tick");

      step++;
      if (step < delays.length) {
        timerId = setTimeout(tick, delays[step]);
      } else {
        timerId = null;
        rl.spinning = false;
        rl.done = true;
        card.classList.remove("tick");
        void card.offsetWidth;
        card.classList.add("sparkle");
        renderRlControls();
      }
    }
    timerId = setTimeout(tick, delays[0]);
  }

  function renderRlControls() {
    const t = T[lang];
    $("spicyChip").textContent = t.spicyOnly;
    $("spicyChip").setAttribute("aria-pressed", String(rl.spicyOnly));
    $("spicyChip").disabled = rl.spinning;
    renderRegionChips($("rlRegionChips"), false, rl.spinning);

    if (!rl.current) {
      $("rlMain").hidden = true;
      $("rlEmpty").hidden = false;
      $("rlEmptyMsg").textContent = t.noDishes;
      return;
    }
    $("rlMain").hidden = false;
    $("rlEmpty").hidden = true;

    if (rl.done && !rl.spinning) {
      $("rlSpinWrap").hidden = true;
      $("rlDoneWrap").hidden = false;
      $("rlStoreLink").href = storeMenuUrl(rl.current.s);
      $("rlStoreLink").textContent = t.viewMenu;
      $("rlAgainBtn").textContent = t.oneMore;
    } else {
      $("rlSpinWrap").hidden = false;
      $("rlDoneWrap").hidden = true;
      $("rlSpinBtn").disabled = rl.spinning;
      $("rlSpinBtn").textContent = rl.spinning ? t.spinning : t.spin;
    }
  }

  /* ==================== 게임 3: 가게 간판 룰렛 ==================== */
  const SIGNS = window.GAME_SIGNS || [];
  const CATS = window.GAME_CATS || {};
  const srRegions = [
    ...REGION_ORDER.filter((r) => SIGNS.some((s) => s.region === r)),
    ...Array.from(new Set(SIGNS.map((s) => s.region))).filter((r) => r && !REGION_ORDER.includes(r))
  ];
  const sr = { cat: "", spinning: false, done: false, current: null };
  const L = (obj) => (obj ? (obj[lang] || obj.en || obj.ko || "") : "");

  function srRegion() { return srRegions.includes(selectedRegion) ? selectedRegion : ""; }
  function srBase() { const r = srRegion(); return SIGNS.filter((s) => !r || s.region === r); }
  function srPool() { const b = srBase(); return sr.cat ? b.filter((s) => s.cats.includes(sr.cat)) : b; }
  function srUrl(s) { return s.url.replace(/\/$/, "") + "/?lang=" + encodeURIComponent(lang); }

  function srCellHtml(s, i) {
    const img = s.img ? `<img src="${esc(s.img)}" alt="" onerror="this.parentNode.classList.add('broken')">` : "";
    return `<div class="sr-cell${s.logo ? " logo" : ""}${img ? "" : " broken"}" style="top:${i * 100}%">${img}<div class="sr-noimg" style="display:none">${esc(s.name)}</div></div>`;
  }
  function srSetReel(list, at, anim) {
    const reel = $("srReel");
    reel.style.transition = "none";
    reel.style.transform = "translateY(0)";
    reel.innerHTML = list.map(srCellHtml).join("");
    if (!anim) return;
    void reel.offsetHeight;
    reel.style.transition = "transform 4s cubic-bezier(.12,.62,.1,1)";
    reel.style.transform = `translateY(-${at * 100}%)`;
  }

  function initSr() {
    clearPendingTimer();
    view = "sr";
    sr.spinning = false;
    sr.done = false;
    $("srWindow").classList.remove("sparkle");
    const pool = srPool();
    if (!pool.some((s) => s === sr.current)) sr.current = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    if (sr.current) srSetReel([sr.current], 0, false);
    render();
  }

  function spinSr() {
    const pool = srPool();
    if (sr.spinning || !pool.length) return;
    clearPendingTimer();
    sr.spinning = true;
    sr.done = false;
    $("srWindow").classList.remove("sparkle");
    // 사진은 10장까지만 불러오고(폰 데이터 절약) 그 안에서 돌려 보여 준다. 뽑히는 가게는 후보 전체에서 고름.
    const winner = pool[Math.floor(Math.random() * pool.length)];
    const sample = [winner, ...shuffle(pool.filter((s) => s !== winner)).slice(0, 9)];
    const seq = [sr.current || winner];
    for (let i = 0; i < 24; i++) {
      let p = sample[Math.floor(Math.random() * sample.length)];
      for (let g = 0; sample.length > 1 && p === seq[seq.length - 1] && g < 8; g++) p = sample[Math.floor(Math.random() * sample.length)];
      seq.push(p);
    }
    if (sample.length > 1 && seq[seq.length - 1] === winner) seq[seq.length - 1] = sample[1];
    seq.push(winner);
    srSetReel(seq, seq.length - 1, true);
    renderSr();
    timerId = setTimeout(function () {
      timerId = null;
      sr.current = winner;
      sr.spinning = false;
      sr.done = true;
      srSetReel([winner], 0, false);
      const w = $("srWindow");
      w.classList.remove("sparkle");
      void w.offsetWidth;
      w.classList.add("sparkle");
      renderSr();
    }, 4100);
  }

  function renderSr() {
    const t = T[lang];
    const base = srBase();
    const reg = srRegion();
    $("srRegionChips").innerHTML = ["", ...srRegions].map((r) => {
      const n = r ? SIGNS.filter((s) => s.region === r).length : SIGNS.length;
      return `<button type="button" class="chip" data-region="${esc(r)}" aria-pressed="${reg === r}"${sr.spinning ? " disabled" : ""}>${esc(regionLabel(r))} <span class="chip-count">${n}</span></button>`;
    }).join("");
    const cats = Object.keys(CATS).filter((c) => base.some((s) => s.cats.includes(c)));
    if (sr.cat && !cats.includes(sr.cat)) sr.cat = "";
    $("srCatChips").innerHTML = ["", ...cats].map((c) => {
      const n = c ? base.filter((s) => s.cats.includes(c)).length : base.length;
      const label = c ? CATS[c].icon + " " + L(CATS[c]) : t.all;
      return `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${sr.cat === c}"${sr.spinning ? " disabled" : ""}>${esc(label)} <span class="chip-count">${n}</span></button>`;
    }).join("");

    const pool = srPool();
    $("srCount").textContent = t.srCount.replace("{n}", pool.length);
    $("srMain").hidden = !pool.length;
    $("srEmpty").hidden = !!pool.length;
    $("srEmptyMsg").textContent = t.noStores;
    if (!pool.length) return;

    const s = sr.current;
    const show = sr.done && !sr.spinning && s;
    $("srInfo").classList.toggle("wait", !show);
    $("srName").textContent = show ? s.name : (sr.spinning ? t.spinning : t.srWait);
    $("srType").textContent = show ? L(s.type) : "";
    $("srAddr").textContent = show ? "📍 " + regionLabel(s.region) + (s.addr ? " · " + s.addr : "") : "";
    $("srTags").innerHTML = show ? s.cats.filter((c) => CATS[c]).map((c) => `<span>${esc(CATS[c].icon + " " + L(CATS[c]))}</span>`).join("") : "";
    $("srType").hidden = $("srAddr").hidden = $("srTags").hidden = !show;

    $("srSpinWrap").hidden = !!show;
    $("srDoneWrap").hidden = !show;
    $("srSpinBtn").disabled = sr.spinning;
    $("srSpinBtn").textContent = sr.spinning ? t.spinning : t.srSpin;
    if (show) {
      $("srStoreLink").href = srUrl(s);
      $("srStoreLink").textContent = t.viewMenu;
      $("srAgainBtn").textContent = t.oneMore;
    }
  }

  /* ==================== 게임 4: 사다리타기 ==================== */
  const LD_COLORS = ["#e0452b", "#2f7de1", "#2a9d63", "#d48a12", "#8b5cf6", "#d9468a", "#0f97a8", "#7a6450"];
  const LD_LEVELS = 10, LD_H = 280, LD_GAP = 4;
  const ld = { n: 4, names: [], res: [], rungs: [], ends: [], shown: new Set(), running: new Set(), timers: [], phase: "setup" };
  try {
    const saved = JSON.parse(localStorage.getItem("game-ladder") || "null");
    if (saved && saved.n >= 2 && saved.n <= 8) { ld.n = saved.n; ld.names = saved.names || []; ld.res = saved.res || []; }
  } catch (e) {}
  function ldSave() {
    try { localStorage.setItem("game-ladder", JSON.stringify({ n: ld.n, names: ld.names.slice(0, ld.n), res: ld.res.slice(0, ld.n) })); } catch (e) {}
  }
  function ldDefName(i) { return T[lang].ldPlayer.replace("{n}", i + 1); }
  function ldDefRes(i) { return i === 0 ? T[lang].ldWin : T[lang].ldPass; }
  function ldName(i) { return String(ld.names[i] || "").trim() || ldDefName(i); }
  function ldRes(i) { return String(ld.res[i] || "").trim() || ldDefRes(i); }
  function ldClearTimers() { ld.timers.forEach(clearTimeout); ld.timers = []; ld.running.clear(); }

  function makeLadder() {
    ldClearTimers();
    const n = ld.n;
    const r = [];
    for (let l = 0; l < LD_LEVELS; l++) {
      r.push([]);
      for (let i = 0; i < n - 1; i++) r[l][i] = !(i > 0 && r[l][i - 1]) && Math.random() < 0.42;
    }
    // 이웃한 두 줄 사이에 가로줄이 하나도 없으면 하나 넣는다(결과가 너무 뻔해지지 않게)
    for (let i = 0; i < n - 1; i++) {
      if (r.some((row) => row[i])) continue;
      const free = [];
      for (let l = 0; l < LD_LEVELS; l++) if (!(i > 0 && r[l][i - 1]) && !r[l][i + 1]) free.push(l);
      if (free.length) r[free[Math.floor(Math.random() * free.length)]][i] = true;
    }
    ld.rungs = r;
    ld.ends = [];
    for (let s = 0; s < n; s++) {
      let c = s;
      for (let l = 0; l < LD_LEVELS; l++) {
        if (r[l][c]) c++;
        else if (c > 0 && r[l][c - 1]) c--;
      }
      ld.ends[s] = c;
    }
    ld.shown = new Set();
    ld.phase = "play";
    ldSave();
    render();
  }

  function ldGeom() {
    const W = Math.max(200, $("ldSvg").clientWidth || 320);
    const colW = (W - (ld.n - 1) * LD_GAP) / ld.n;
    return { W, x: (i) => i * (colW + LD_GAP) + colW / 2, y: (l) => 16 + l * ((LD_H - 32) / (LD_LEVELS - 1)) };
  }
  function ldPoints(s, g) {
    let c = s;
    const pts = [[g.x(c), 0]];
    for (let l = 0; l < LD_LEVELS; l++) {
      const y = g.y(l);
      if (ld.rungs[l][c]) { pts.push([g.x(c), y], [g.x(c + 1), y]); c++; }
      else if (c > 0 && ld.rungs[l][c - 1]) { pts.push([g.x(c), y], [g.x(c - 1), y]); c--; }
    }
    pts.push([g.x(c), LD_H]);
    return pts;
  }
  function ldPolyline(s, g) {
    const pts = ldPoints(s, g);
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
    return { len, html: `<polyline data-p="${s}" points="${pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${LD_COLORS[s]}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>` };
  }
  function drawLadder() {
    const g = ldGeom();
    const svg = $("ldSvg");
    svg.setAttribute("viewBox", `0 0 ${g.W} ${LD_H}`);
    let h = "";
    for (let i = 0; i < ld.n; i++) h += `<line x1="${g.x(i)}" y1="0" x2="${g.x(i)}" y2="${LD_H}" stroke="#d9cfc2" stroke-width="4" stroke-linecap="round"/>`;
    for (let l = 0; l < LD_LEVELS; l++) for (let i = 0; i < ld.n - 1; i++) {
      if (ld.rungs[l][i]) h += `<line x1="${g.x(i)}" y1="${g.y(l)}" x2="${g.x(i + 1)}" y2="${g.y(l)}" stroke="#d9cfc2" stroke-width="4" stroke-linecap="round"/>`;
    }
    for (let s = 0; s < ld.n; s++) if (ld.shown.has(s) || ld.running.has(s)) h += ldPolyline(s, g).html;
    svg.innerHTML = h;
  }

  function ldRun(s) {
    if (ld.shown.has(s) || ld.running.has(s)) return;
    ld.running.add(s);
    const g = ldGeom();
    const p = ldPolyline(s, g);
    $("ldSvg").insertAdjacentHTML("beforeend", p.html);
    const el = $("ldSvg").querySelector(`polyline[data-p="${s}"]`);
    const dur = Math.round(Math.min(2600, Math.max(1200, p.len * 2.2)));
    el.style.strokeDasharray = p.len;
    el.style.strokeDashoffset = p.len;
    void el.getBoundingClientRect();
    el.style.transition = `stroke-dashoffset ${dur}ms linear`;
    el.style.strokeDashoffset = 0;
    renderLdRows();
    ld.timers.push(setTimeout(function () {
      ld.running.delete(s);
      ld.shown.add(s);
      renderLdRows();
    }, dur + 50));
  }

  function renderLdRows() {
    const t = T[lang];
    const cols = `repeat(${ld.n}, minmax(0, 1fr))`;
    $("ldNames").style.gridTemplateColumns = cols;
    $("ldResults").style.gridTemplateColumns = cols;
    let nh = "";
    for (let s = 0; s < ld.n; s++) {
      const busy = ld.shown.has(s) || ld.running.has(s);
      nh += `<button type="button" class="ld-name${ld.shown.has(s) ? " done" : ""}" data-p="${s}" style="--pc:${LD_COLORS[s]}"${busy ? " disabled" : ""} title="${esc(ldName(s))}">${esc(ldName(s))}</button>`;
    }
    $("ldNames").innerHTML = nh;
    const owner = [];
    ld.ends.forEach((c, s) => { owner[c] = s; });
    let rh = "";
    for (let c = 0; c < ld.n; c++) {
      const s = owner[c];
      const shown = ld.shown.has(s);
      rh += `<div class="ld-res${shown ? " shown" : ""}" style="--pc:${LD_COLORS[s]}" title="${shown ? esc(ldRes(c)) : ""}">${shown ? esc(ldRes(c)) : "?"}</div>`;
    }
    $("ldResults").innerHTML = rh;
    const all = ld.shown.size === ld.n;
    $("ldHint").hidden = all;
    $("ldHint").textContent = t.ldHint;
    $("ldRevealBtn").hidden = all;
    $("ldRevealBtn").textContent = t.ldReveal;
    $("ldShuffleBtn").textContent = t.ldShuffle;
    $("ldEditBtn").textContent = t.ldEdit;
    $("ldSum").innerHTML = all ? Array.from({ length: ld.n }, (_, s) => (
      `<div style="--pc:${LD_COLORS[s]}"><span>${esc(ldName(s))}</span><b>${esc(ldRes(ld.ends[s]))}</b></div>`
    )).join("") : "";
  }

  function renderLd() {
    const t = T[lang];
    $("ldSetup").hidden = ld.phase !== "setup";
    $("ldPlay").hidden = ld.phase !== "play";
    if (ld.phase === "setup") {
      $("ldSetupTitle").textContent = "🎯 " + t.ldTitle;
      $("ldSetupDesc").textContent = t.ldDesc;
      $("ldCountLabel").textContent = t.ldCount;
      $("ldCount").textContent = ld.n;
      $("ldMinus").disabled = ld.n <= 2;
      $("ldPlus").disabled = ld.n >= 8;
      $("ldPlayersLabel").textContent = t.ldPlayers;
      $("ldResultsLabel").textContent = t.ldResults;
      $("ldMakeBtn").textContent = t.ldMake;
      let a = "", b = "";
      for (let i = 0; i < ld.n; i++) {
        a += `<input type="text" data-k="names" data-i="${i}" maxlength="10" value="${esc(ld.names[i] || "")}" placeholder="${esc(ldDefName(i))}" aria-label="${esc(t.ldPlayers + " " + (i + 1))}">`;
        b += `<input type="text" data-k="res" data-i="${i}" maxlength="10" value="${esc(ld.res[i] || "")}" placeholder="${esc(ldDefRes(i))}" aria-label="${esc(t.ldResults + " " + (i + 1))}">`;
      }
      $("ldNameInputs").innerHTML = a;
      $("ldResInputs").innerHTML = b;
    } else {
      drawLadder();
      renderLdRows();
    }
  }

  /* ==================== 전체 화면 그리기 ==================== */
  function renderRegionChips(container, withCount, disabled) {
    const allKeys = ["", ...regions];
    container.innerHTML = allKeys.map((r) => {
      const countHtml = withCount ? ` <span class="chip-count">${regionCounts[r] || 0}</span>` : "";
      const disAttr = disabled ? " disabled" : "";
      return `<button type="button" class="chip" data-region="${esc(r)}" aria-pressed="${selectedRegion === r}"${disAttr}>${esc(regionLabel(r))}${countHtml}</button>`;
    }).join("");
  }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = t.pageTitle;

    $("backStores").textContent = t.backStores;
    $("topTitle").textContent = t.topTitle;
    $("langs").innerHTML = LANGS.map(([c, label]) => (
      `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`
    )).join("");

    $("wcCardTitle").textContent = t.wcTitle;
    $("wcCardDesc").textContent = t.wcDesc;
    $("rlCardTitle").textContent = t.rlTitle;
    $("rlCardDesc").textContent = t.rlDesc;
    $("srCardTitle").textContent = t.srTitle;
    $("srCardDesc").textContent = t.srDesc;
    $("ldCardTitle").textContent = t.ldTitle;
    $("ldCardDesc").textContent = t.ldDesc;

    $("wcBackHome").textContent = t.backToHome;
    $("rlBackHome").textContent = t.backToHome;
    $("srBackHome").textContent = t.backToHome;
    $("ldBackHome").textContent = t.backToHome;
    $("noticeFoot").textContent = t.notice;

    $("viewHome").hidden = view !== "home";
    $("viewWc").hidden = view !== "wc";
    $("viewRl").hidden = view !== "rl";
    $("viewSr").hidden = view !== "sr";
    $("viewLd").hidden = view !== "ld";
    if (view === "sr") renderSr();
    if (view === "ld") renderLd();

    if (view === "wc") {
      $("wcIntro").hidden = wc.phase !== "intro";
      $("wcPlay").hidden = wc.phase !== "play";
      $("wcWin").hidden = wc.phase !== "win";
      $("wcEmpty").hidden = wc.phase !== "empty";

      if (wc.phase === "intro") {
        $("wcIntroTitle").textContent = "🏆 " + t.wcTitle;
        $("wcIntroDesc").textContent = t.wcDesc;
        $("wcStartBtn").textContent = t.startGame;
        renderRegionChips($("wcRegionChips"), true, false);
      } else if (wc.phase === "empty") {
        $("wcEmptyMsg").textContent = t.noDishes;
        $("wcEmptyBack").textContent = t.toHome;
      } else if (wc.phase === "win") {
        renderWcWin();
      } else {
        renderWcMatch();
      }
    } else if (view === "rl") {
      renderRlControls();
      if (rl.current) renderRlCard();
    }
  }

  function goHome() {
    clearPendingTimer();
    wc.busy = false;
    rl.spinning = false;
    sr.spinning = false;
    ldClearTimers();
    view = "home";
    render();
  }

  /* ==================== 이벤트 연결 ==================== */
  $("langs").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-lang]");
    if (!btn) return;
    const c = btn.dataset.lang;
    if (!SUPPORTED.includes(c) || c === lang) return;
    lang = c;
    saveLang(c);
    render();
  });

  $("wcRegionChips").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-region]");
    if (!btn) return;
    const r = btn.dataset.region || "";
    if (selectedRegion === r) return;
    selectedRegion = r;
    saveRegion(selectedRegion);
    renderRegionChips($("wcRegionChips"), true, false);
  });

  $("rlRegionChips").addEventListener("click", function (e) {
    if (rl.spinning) return;
    const btn = e.target.closest("button[data-region]");
    if (!btn) return;
    const r = btn.dataset.region || "";
    if (selectedRegion === r) return;
    selectedRegion = r;
    saveRegion(selectedRegion);
    initRoulette(true);
  });

  $("pickWc").addEventListener("click", openWorldCupIntro);
  $("pickRl").addEventListener("click", function () { initRoulette(false); });

  $("wcStartBtn").addEventListener("click", startWorldCup);
  $("wcCard0").addEventListener("click", function () { pickWcCard(0); });
  $("wcCard1").addEventListener("click", function () { pickWcCard(1); });
  $("wcBackHome").addEventListener("click", goHome);
  $("winReplay").addEventListener("click", startWorldCup);
  $("winToHome").addEventListener("click", goHome);
  $("wcEmptyBack").addEventListener("click", goHome);

  $("rlBackHome").addEventListener("click", goHome);
  $("spicyChip").addEventListener("click", function () {
    if (rl.spinning) return;
    rl.spicyOnly = !rl.spicyOnly;
    initRoulette(true);
  });
  $("rlSpinBtn").addEventListener("click", spinRoulette);
  $("rlAgainBtn").addEventListener("click", spinRoulette);

  // 게임 3: 간판 룰렛
  $("pickSr").addEventListener("click", initSr);
  $("srBackHome").addEventListener("click", goHome);
  $("srSpinBtn").addEventListener("click", spinSr);
  $("srAgainBtn").addEventListener("click", spinSr);
  $("srRegionChips").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-region]");
    if (!btn || sr.spinning) return;
    selectedRegion = btn.dataset.region || "";
    saveRegion(selectedRegion);
    initSr();
  });
  $("srCatChips").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-cat]");
    if (!btn || sr.spinning) return;
    sr.cat = btn.dataset.cat || "";
    initSr();
  });

  // 게임 4: 사다리타기
  $("pickLd").addEventListener("click", function () { clearPendingTimer(); view = "ld"; ld.phase = "setup"; ldClearTimers(); render(); });
  $("ldBackHome").addEventListener("click", goHome);
  $("ldMinus").addEventListener("click", function () { if (ld.n > 2) { ld.n--; ldSave(); renderLd(); } });
  $("ldPlus").addEventListener("click", function () { if (ld.n < 8) { ld.n++; ldSave(); renderLd(); } });
  $("viewLd").addEventListener("input", function (e) {
    const k = e.target.dataset && e.target.dataset.k;
    if (k !== "names" && k !== "res") return;
    ld[k][Number(e.target.dataset.i)] = e.target.value;
    ldSave();
  });
  $("ldMakeBtn").addEventListener("click", makeLadder);
  $("ldNames").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-p]");
    if (btn) ldRun(Number(btn.dataset.p));
  });
  $("ldRevealBtn").addEventListener("click", function () {
    ldClearTimers();
    for (let s = 0; s < ld.n; s++) ld.shown.add(s);
    drawLadder();
    renderLdRows();
  });
  $("ldShuffleBtn").addEventListener("click", makeLadder);
  $("ldEditBtn").addEventListener("click", function () { ldClearTimers(); ld.phase = "setup"; render(); });
  let ldResizeT = null;
  window.addEventListener("resize", function () {
    clearTimeout(ldResizeT);
    ldResizeT = setTimeout(function () { if (view === "ld" && ld.phase === "play") drawLadder(); }, 120);
  });

  render();
})();
</script>
