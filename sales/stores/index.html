<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<!-- 웹앱 아이콘 (tools/app-icon.mjs 로 만듦) -->
<link rel="manifest" href="/stores/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="QR Stores">
<title>QR 메뉴판 가게 찾기 · Tìm quán có thực đơn QR</title>
<meta name="description" content="5개 언어 QR 메뉴판이 있는 식당·가게 목록 — 박닌, 하노이, 꽝응아이, 한국. Danh sách nhà hàng có thực đơn QR 5 ngôn ngữ. Restaurants with QR menus in Korean, English, Chinese, Japanese and Vietnamese.">
<link rel="canonical" href="https://qrmenuasia.com/stores/">
<meta property="og:type" content="website">
<meta property="og:title" content="QR 메뉴판 가게 찾기 · Tìm quán có thực đơn QR">
<meta property="og:description" content="5개 언어 메뉴판이 있는 식당과 가게 · Nhà hàng có thực đơn 5 ngôn ngữ">
<meta property="og:url" content="https://qrmenuasia.com/stores/">
<style>
  :root {
    --ink: #16130f; --ink-2: #2a251f; --paper: #faf7f2; --card: #fff; --line: #e9e2d7;
    --muted: #6f675d; --accent: #e0452b; --accent-2: #f2a03d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  :lang(ko) h1, :lang(ko) p, :lang(ko) h2 { word-break: keep-all; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.3px; }

  /* 상단 */
  .hero { background: radial-gradient(120% 90% at 85% 0%, #3a2416 0%, var(--ink) 55%); color: #fff; padding: 16px 0 26px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .logo { font-weight: 800; display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; }
  .logo i { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #d8cfc3; background: transparent; border: 1px solid #5a4f43; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--ink); background: #fff; border-color: #fff; }
  .hero h1 { margin-top: 26px; font-size: clamp(26px, 5vw, 40px); font-weight: 900; }
  .hero p { margin: 10px 0 0; color: #d8cfc3; font-size: 16px; max-width: 36em; }

  /* 검색·필터 (스크롤해도 위에 붙어 있음) */
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(250,247,242,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 0 10px; }
  .search { position: relative; }
  .search input {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 40px 12px 42px; border-radius: 14px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,69,43,.15); }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 50%; background: #efe8de; color: var(--muted); font-size: 16px; cursor: pointer; display: none; }
  .search.has .clear { display: block; }
  /* PC도 줄바꿈: 옆으로 넘기게 두면 오른쪽 칩이 잘려 보였다(2026-10-29 치킨 추가 뒤 사용자 지적) */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips b { flex: none; align-self: center; font-size: 12px; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .chip { flex: none; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { color: #fff; background: var(--ink); border-color: var(--ink); }
  .chip small { font-size: 11.5px; opacity: .6; margin-left: 3px; }

  /* 목록 */
  main { padding: 16px 0 40px; }
  .count { font-size: 13px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 10px; }
  .store { display: grid; grid-template-columns: 104px 1fr; grid-template-areas: "shot info" "btns btns"; grid-template-rows: 1fr auto; gap: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .store .shot { grid-area: shot; position: relative; min-height: 132px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #f1ebe2; }
  .store .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .store .info { grid-area: info; min-width: 0; }
  .store h2 { font-size: 19px; }
  .store .sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .store .type { font-size: 14px; margin-top: 6px; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .meta > span { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: #f3ede4; color: var(--ink-2); }
  .meta .rg { background: #fff1ec; color: var(--accent); }
  .meta .zalo { background: #e6f0ff; color: #0058d6; }
  .meta .sale { background: #fde8ef; color: #c2185b; }
  .addr { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .btns { grid-area: btns; display: flex; gap: 8px; }
  .btn { min-height: 42px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 11px; padding: 9px 14px; }
  .btn.go { color: #fff; background: linear-gradient(135deg, var(--accent), #f0662f); flex: 1; }
  .btn.map { color: var(--ink-2); border: 1px solid var(--line); background: #fff; }
  .empty { display: none; text-align: center; padding: 50px 0; color: var(--muted); }
  /* 메뉴 검색 결과 (검색어가 있을 때만, 가게 목록 위) — 2026-11-24 캡틴 가-1 */
  .mhits { margin: 10px 0 4px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 8px; }
  .mhits[hidden] { display: none; }
  .mhits h2 { font-size: 15px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .mhits h2 small { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .mhits ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; }
  .mhits li a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 2px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  .mhits li a:hover .dn { color: var(--accent); }
  .mhits .dn { font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
  .mhits .pr { font-weight: 800; font-size: 14.5px; color: var(--accent); white-space: nowrap; text-align: right; }
  .mhits .st { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mhits .more { display: block; width: 100%; margin: 4px 0 6px; font: inherit; font-size: 13.5px; font-weight: 700; color: var(--ink-2); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px; cursor: pointer; }
  .mhits .wait { font-size: 13px; color: var(--muted); margin: 6px 0 8px; }
  @media (max-width: 640px) { .mhits ul { grid-template-columns: minmax(0, 1fr); } }
  .empty button { margin-top: 12px; font: inherit; font-weight: 700; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 16px; cursor: pointer; }

  /* 사장님 안내 */
  .owner { margin-top: 30px; border-radius: 20px; padding: 22px; color: #fff; display: flex; align-items: center; gap: 18px; justify-content: space-between; flex-wrap: wrap;
    background: radial-gradient(70% 120% at 100% 0%, rgba(240,102,47,.35), transparent 70%), var(--ink); }
  .owner h2 { font-size: 20px; }
  .owner p { margin: 6px 0 0; color: #d8cfc3; font-size: 14.5px; max-width: 32em; }
  .owner a { flex: none; color: var(--ink); background: #fff; text-decoration: none; font-weight: 800; border-radius: 12px; padding: 11px 16px; }
  footer { text-align: center; font-size: 12px; color: #9a9084; padding: 0 0 28px; }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .store { grid-template-columns: 88px 1fr; }
    /* 모바일: 지역·종류 칩을 줄바꿈해 한눈에 보이게 (칸이 높아져 위에 붙이지 않음) */
    .bar { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .chips { flex-wrap: wrap; overflow: visible; gap: 6px 5px; margin-top: 8px; }
    .chips b { flex-basis: 100%; font-size: 11.5px; line-height: 1.2; }
    .chip { font-size: 13px; padding: 5px 10px; }
    .search input { font-size: 15px; }
  }

  /* 웹앱 설치 버튼 */
  .install { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; font: inherit; font-size: 15px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  .install svg { width: 18px; height: 18px; }
  .install[hidden] { display: none; }
  /* 메뉴 게임 버튼 (game.html) */
  .game-btn { display: inline-flex; align-items: center; gap: 6px; margin: 18px 8px 0 0; font-size: 15px; font-weight: 800; color: var(--ink); background: #fff; border-radius: 999px; padding: 11px 18px; text-decoration: none; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  .ins-back { position: fixed; inset: 0; z-index: 40; display: none; align-items: flex-end; justify-content: center; background: rgba(20,14,10,.6); }
  .ins-back.show { display: flex; }
  .ins-box { width: 100%; max-width: 480px; background: #fff; color: var(--ink); border-radius: 20px 20px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); }
  .ins-box h3 { font-size: 19px; font-weight: 900; }
  .ins-box ol { margin: 14px 0 0; padding-left: 20px; font-size: 16px; line-height: 1.6; }
  .ins-box li { margin-bottom: 4px; }
  .ins-box .ins-close { width: 100%; margin-top: 16px; font: inherit; font-size: 16px; font-weight: 800; color: #fff; background: var(--ink); border: 0; border-radius: 12px; padding: 12px; cursor: pointer; }

  /* QR 메뉴판 상담·제작 문의 배너 (2026-11-21 캡틴 지시) — 정식 가게 다음 목록 사이, 검색·종류를 고르면 목록 아래 */
  .qrcta { position: relative; grid-column: 1 / -1; margin: 6px 0 4px; border-radius: 24px; padding: 2px; isolation: isolate; overflow: hidden;
    background: conic-gradient(from var(--spin, 0deg), #e0452b, #f2a03d, #ffe28a, #f2a03d, #e0452b 60%, #7a2a14, #e0452b); animation: qrSpin 6s linear infinite; box-shadow: 0 18px 44px rgba(224,69,43,.28); }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes qrSpin { to { --spin: 360deg; } }
  .qrcta-in { position: relative; border-radius: 22px; padding: 26px 26px 22px; color: #fff; display: grid; grid-template-columns: 1fr 190px; gap: 22px; align-items: center; overflow: hidden;
    background: radial-gradient(90% 120% at 100% 0%, rgba(240,102,47,.45), transparent 60%), radial-gradient(60% 80% at 0% 100%, rgba(242,160,61,.18), transparent 70%), #16130f; }
  .qrcta-in::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.09) 1px, transparent 1.4px); background-size: 16px 16px; }
  .qrcta-in::after { content: ""; position: absolute; top: -40%; left: -30%; width: 40%; height: 180%; transform: rotate(20deg); pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent); animation: qrShine 4.5s ease-in-out infinite; }
  @keyframes qrShine { 0%, 55% { left: -40%; } 100% { left: 130%; } }
  .qrcta .kick { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; color: #16130f; background: linear-gradient(135deg, #ffe28a, #f2a03d); border-radius: 999px; padding: 5px 12px 5px 8px; }
  .qrcta .kick i { font-style: normal; width: 8px; height: 8px; border-radius: 50%; background: #e0452b; box-shadow: 0 0 0 0 rgba(224,69,43,.7); animation: qrPulse 1.6s infinite; }
  @keyframes qrPulse { 70% { box-shadow: 0 0 0 9px rgba(224,69,43,0); } 100% { box-shadow: 0 0 0 0 rgba(224,69,43,0); } }
  .qrcta h2 { margin-top: 12px; font-size: clamp(23px, 3.6vw, 32px); font-weight: 900; line-height: 1.22; letter-spacing: -.5px; }
  .qrcta h2 em { font-style: normal; background: linear-gradient(90deg, #ffd36b, #ff8a4c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .qrcta .qsub { margin: 10px 0 0; color: #e6dccf; font-size: 15px; max-width: 34em; }
  .qrcta .pts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding: 0; list-style: none; }
  .qrcta .pts li { font-size: 13px; font-weight: 700; color: #ffe9c7; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 5px 11px; }
  .qrcta .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .qrcta .qb { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; font: inherit; font-size: 15px; font-weight: 800; text-decoration: none; border-radius: 14px; padding: 11px 16px; cursor: pointer; border: 0; white-space: nowrap; transition: transform .15s, box-shadow .15s; }
  .qrcta .qb:hover { transform: translateY(-2px); }
  .qrcta .qb svg { width: 20px; height: 20px; flex: none; }
  .qrcta .qb.zalo { color: #fff; background: #0068ff; box-shadow: 0 8px 22px rgba(0,104,255,.4); }
  .qrcta .qb.call { color: #16130f; background: linear-gradient(135deg, #ffe28a, #f2a03d); box-shadow: 0 8px 22px rgba(242,160,61,.35); }
  .qrcta .qb.kakao { color: #3a1d1d; background: #fee500; }
  .qrcta .qb.more { color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.35); }
  .qrcta .qnote { margin: 12px 0 0; font-size: 12.5px; color: #b9ae9f; }
  .qrcta .qnote b { color: #ffd36b; font-weight: 800; }
  /* 오른쪽 휴대폰 그림: 메뉴 이름이 5개 언어로 돌아가며 바뀜 */
  .qrcta .phone { position: relative; justify-self: center; width: 150px; height: 262px; border-radius: 28px; padding: 9px; background: #2b2620; border: 2px solid #4a4036; box-shadow: 0 20px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06); transform: rotate(4deg); animation: qrFloat 5s ease-in-out infinite; }
  @keyframes qrFloat { 50% { transform: rotate(4deg) translateY(-8px); } }
  .qrcta .scr { height: 100%; border-radius: 20px; background: #faf7f2; overflow: hidden; color: #16130f; padding: 12px 10px; display: flex; flex-direction: column; gap: 7px; }
  .qrcta .scr .hd { font-size: 12px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; }
  .qrcta .scr .hd span { font-size: 9px; font-weight: 800; color: #fff; background: #e0452b; border-radius: 999px; padding: 2px 6px; }
  .qrcta .scr .ph { height: 62px; border-radius: 10px; background: linear-gradient(135deg, #f0662f, #f2a03d 60%, #ffe28a); position: relative; overflow: hidden; }
  .qrcta .scr .ph::after { content: "🍲"; position: absolute; right: 8px; bottom: 2px; font-size: 34px; }
  .qrcta .scr .row { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; border-bottom: 1px dashed #e9e2d7; padding-bottom: 5px; }
  .qrcta .scr .row b { color: #e0452b; }
  .qrcta .scr .ln { height: 6px; border-radius: 3px; background: #ece4d8; }
  .qrcta .qrbadge { position: absolute; left: -26px; bottom: 22px; width: 64px; height: 64px; border-radius: 14px; background: #fff; padding: 7px; box-shadow: 0 10px 24px rgba(0,0,0,.45); transform: rotate(-8deg); }
  .qrcta .qrbadge svg { width: 100%; height: 100%; display: block; }
  .qrcta .bub { position: absolute; right: -18px; top: 26px; font-size: 12px; font-weight: 900; color: #fff; background: #e0452b; border-radius: 12px 12px 12px 3px; padding: 6px 10px; box-shadow: 0 8px 18px rgba(224,69,43,.5); white-space: nowrap; transform: rotate(-4deg); }
  /* 화면 오른쪽 아래 떠 있는 작은 상담 버튼 (배너가 화면에 보이면 숨김) */
  .qrfab { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30; display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 14px; font-weight: 800; color: #fff; text-decoration: none;
    background: linear-gradient(135deg, #e0452b, #f2a03d); border: 2px solid #fff; border-radius: 999px; padding: 10px 15px; box-shadow: 0 10px 26px rgba(224,69,43,.45); cursor: pointer; transition: opacity .25s, transform .25s; }
  .qrfab.off { opacity: 0; transform: translateY(20px); pointer-events: none; }
  @media (max-width: 760px) {
    .qrcta { border-radius: 20px; margin: 2px 0; }
    .qrcta-in { grid-template-columns: 1fr; padding: 22px 18px 18px; border-radius: 18px; }
    .qrcta .phone { display: none; }
    .qrcta .qsub { font-size: 14.5px; }
    .qrcta .pts { gap: 5px; }
    .qrcta .pts li { font-size: 11.5px; padding: 4px 8px; }
    .qrcta .qnote b { white-space: nowrap; }
    .qrcta .acts { display: grid; grid-template-columns: 1fr 1fr; }
    .qrcta .qb { padding: 11px 10px; font-size: 14.5px; }
    .qrcta .qb.more:nth-child(odd) { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .qrcta, .qrcta-in::after, .qrcta .kick i, .qrcta .phone { animation: none; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <a class="logo" id="home" href="/"><i>QR</i><span>QR Menu</span></a>
      <div class="langs" id="langs"></div>
    </div>
    <h1 data-t="heading">QR 메뉴판으로 만나는 가게</h1>
    <p data-t="sub">5개 언어 메뉴판이 있는 식당과 가게를 찾아보세요.</p>
    <a class="game-btn" id="gameBtn" href="/stores/game.html">🎮 오늘 뭐 먹지? 메뉴 게임</a>
    <button class="install" id="install" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14"/></svg><span id="installText"></span></button>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clear" type="button" aria-label="clear">×</button>
    </div>
    <div class="chips" id="regionChips"></div>
    <div class="chips" id="catChips"></div>
  </div>
</div>

<main class="wrap">
  <section class="mhits" id="mhits" hidden></section>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <noscript><ul>

<script>
// 다산 배너: 처음 화면과 지역(하노이·박닌 등)만 고른 화면은 정식 계약 가게 바로 다음(목록 사이), 검색·종류를 고르면 맨 아래(footer 다음)
(function () {
  function place() {
    var box = document.querySelector("aside.dasan");
    if (!box) return;
    var slot = document.getElementById("dasanSlot");
    var filtered = !!(state.q || state.cat);
    if (!filtered && slot) slot.appendChild(box);
    else document.querySelector("footer").after(box);
  }
  window.dasanPlace = place;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", place); else place();
})();
</script>

<script src="/stores/data.js"></script>
<script>
  const LANGS = [["ko", "한국어"], ["vi", "Tiếng Việt"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"]];
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const L = (o, lang) => (o && (o[lang] || o.en || o.ko)) || "";
  function storage(fn) { try { return fn(localStorage); } catch { return null; } }
  // 검색용: 소문자 + 베트남어 성조·đ 제거 ("an voi" 로도 "Ăn Vội" 를 찾게)
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u0111/g, "d").normalize("NFC");

  // 가게마다 모든 언어의 이름·종류·지역·분류·주소·키워드를 한 줄로 묶어 둠
  const HAY = Object.fromEntries(STORES.map((s) => [s.id, norm([
    s.name, s.sub, s.address, s.keywords,
    ...Object.values(s.type), ...Object.values(REGIONS[s.region] || {}),
    ...s.cats.flatMap((c) => Object.values(CATS[c] || {})), ...s.tags.flatMap((t) => Object.values(TAGS[t] || {})),
  ].join(" "))]));

  const params = new URLSearchParams(location.search);
  const state = { q: params.get("q") || "", region: params.get("region") || "", cat: params.get("cat") || "" };
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  if (!own(REGIONS, state.region)) state.region = "";
  if (!own(CATS, state.cat)) state.cat = "";

  function detectLang() {
    const q = params.get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("sales-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    if (/bot|crawl|spider|yeti|daum|slurp/i.test(navigator.userAgent)) return "ko"; // 검색 로봇은 영어 기기 언어라 설명이 영어로만 나오던 문제
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "ko";
  }
  let lang = detectLang();

  const matches = (s, skip) => {
    if (skip !== "region" && state.region && s.region !== state.region) return false;
    if (skip !== "cat" && state.cat && !s.cats.includes(state.cat)) return false;
    const words = norm(state.q).split(/\s+/).filter(Boolean);
    return words.every((w) => HAY[s.id].includes(w));
  };

  // 주소창에 조건을 남겨 링크로 공유할 수 있게
  function syncUrl() {
    const p = new URLSearchParams();
    if (params.get("lang")) p.set("lang", lang);
    if (state.q) p.set("q", state.q);
    if (state.region) p.set("region", state.region);
    if (state.cat) p.set("cat", state.cat);
    const qs = p.toString();
    try { history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "")); } catch {}
  }

  function chips(el, key, dict, label) {
    // 칩 옆 숫자는 다른 조건을 그대로 둔 채 이 칩을 골랐을 때 나오는 가게 수
    const n = (v) => STORES.filter((s) => matches(s, key) && (!v || (key === "region" ? s.region === v : s.cats.includes(v)))).length;
    const keys = Object.keys(dict).filter((k) => STORES.some((s) => key === "region" ? s.region === k : s.cats.includes(k)));
    el.innerHTML = `<b>${esc(label)}</b>` + ["", ...keys].map((k) => {
      const icon = k && dict[k].icon ? `<span aria-hidden="true">${dict[k].icon}</span> ` : "";
      const text = k ? L(dict[k], lang) : SI[lang].all;
      return `<button type="button" class="chip" data-k="${key}" data-v="${k}" aria-pressed="${state[key] === k}">${icon}${esc(text)}<small aria-label=", ${n(k)} ${esc(SI[lang].unit)}">${n(k)}</small></button>`;
    }).join("");
  }

  function renderList() {
    const t = SI[lang];
    // 정식 계약 가게 먼저, 가게 찾기용(listing)은 그 뒤 (원래 순서는 유지)
    const list = STORES.filter((s) => matches(s)).sort((a, b) => !!a.listing - !!b.listing);
    const hits = renderMenuHits();
    $("count").textContent = !list.length && hits ? "" : list.length === 1 && t.count1 ? t.count1 : t.count.replace("{n}", list.length);
    $("empty").style.display = list.length || hits ? "none" : "block";
    const keep = document.querySelector("aside.dasan"); if (keep) document.querySelector("footer").after(keep); // 목록을 다시 그려도 배너가 지워지지 않게
    $("grid").after($("qrcta")); // 상담 배너도 목록을 다시 그리기 전에 밖으로 빼 둠
    const lastFormal = list.reduce((m, s, i) => s.listing ? m : i, -1);
    $("grid").innerHTML = list.map((s, i) => {
      const menuUrl = `${s.url}/?lang=${lang}`;
      const map = s.map || (s.address ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.name + " " + s.address) : null);
      const tags = s.tags.map((k) => `<span class="${k}">${esc(L(TAGS[k], lang))}</span>`).join("");
      return `<article class="store">
        <a class="shot" href="${esc(menuUrl)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="/img/demo-${esc(s.id)}.jpg" alt="${esc(s.name)}" loading="lazy"></a>
        <div class="info">
          <h2>${esc(s.name)}</h2>
          ${s.sub ? `<div class="sub">${esc(s.sub)}</div>` : ""}
          <div class="type">${esc(L(s.type, lang))}</div>
          <div class="meta"><span class="rg"><span aria-hidden="true">📍</span> ${esc(L(REGIONS[s.region], lang))}</span>${s.cats.map((c) => `<span><span aria-hidden="true">${CATS[c].icon}</span> ${esc(L(CATS[c], lang))}</span>`).join("")}${tags}</div>
          ${s.address ? `<div class="addr">${esc(s.address)}</div>` : ""}
        </div>
        <div class="btns">
          <a class="btn go" href="${esc(menuUrl)}" target="_blank" rel="noopener">${esc(t.menu)} →</a>
          ${map ? `<a class="btn map" href="${esc(map)}" target="_blank" rel="noopener"><span aria-hidden="true">🧭</span> ${esc(t.map)}</a>` : ""}
        </div>
      </article>` + (i === lastFormal ? '<div id="dasanSlot" style="grid-column:1/-1"></div>' : "");
    }).join("");
    if (window.dasanPlace) window.dasanPlace();
    // 상담 배너: 처음 화면·지역만 고른 화면은 정식 가게 바로 다음, 검색·종류를 고르면 목록 아래
    const slot = $("dasanSlot");
    if (slot && !(state.q || state.cat)) slot.appendChild($("qrcta"));
    chips($("regionChips"), "region", REGIONS, t.region);
    chips($("catChips"), "cat", CATS, t.cat);
    $("searchBox").classList.toggle("has", !!state.q);
    syncUrl();
  }

  // ── 메뉴 검색 (2026-11-24 캡틴 가-1): "김치찌개"를 치면 어느 가게에서 얼마인지 ──
  // 데이터(menu-search.js, 압축 약 220KB)는 검색창을 누르거나 검색어가 있을 때만 불러온다. tools/game-data.mjs 가 만든다.
  const MS = {
    ko: { title: "메뉴 검색", sum: "메뉴 {n}개 · 가게 {s}곳", more: "더 보기 (+{n})", market: "시가", wait: "메뉴 찾는 중…", fail: "메뉴 검색을 불러오지 못했어요. 다시 검색해 주세요." },
    vi: { title: "Tìm món", sum: "{n} món · {s} quán", more: "Xem thêm (+{n})", market: "Thời giá", wait: "Đang tìm món…", fail: "Không tải được dữ liệu món. Hãy thử lại." },
    en: { title: "Dishes", sum: "{n} dishes · {s} places", more: "Show more (+{n})", market: "Market price", wait: "Searching dishes…", fail: "Couldn't load dishes. Please try again." },
    zh: { title: "菜品搜索", sum: "{n} 道菜 · {s} 家店", more: "显示更多 (+{n})", market: "时价", wait: "正在搜索菜品…", fail: "无法加载菜品，请重试。" },
    ja: { title: "メニュー検索", sum: "{n}品 · {s}店", more: "もっと見る (+{n})", market: "時価", wait: "メニューを検索中…", fail: "メニューを読み込めませんでした。もう一度お試しください。" },
  };
  const mdata = { status: "", items: null, extra: {}, show: 8 };
  function loadScript(src) {
    return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  }
  function loadMenus() {
    const need = (lang === "zh" || lang === "ja") && !mdata.extra[lang] ? lang : "";
    if (mdata.status === "loading" || (mdata.status === "ok" && !need)) return;
    mdata.status = "loading";
    const jobs = [];
    if (!window.MENU_SEARCH) jobs.push(loadScript("/stores/menu-search.js"));
    if (need) jobs.push(loadScript(`/stores/menu-search-${need}.js`).then(() => { mdata.extra[need] = window["MENU_SEARCH_" + need.toUpperCase()] || {}; }, () => { mdata.extra[need] = {}; }));
    Promise.all(jobs).then(() => {
      if (!mdata.items) {
        const byId = Object.fromEntries(STORES.map((s) => [s.id, s]));
        mdata.items = [];
        for (const [id, v] of Object.entries(window.MENU_SEARCH || {})) {
          if (!byId[id]) continue;
          v.m.forEach((r, i) => mdata.items.push({ s: byId[id], cur: v.c, i, ko: r[0], vi: r[1], en: r[2], p: r[3], hay: "" }));
        }
      }
      // '냉면사리 추가'·'Thêm phở' 같은 추가 메뉴는 싸서 맨 위로 올라오므로 뒤로 보냄
      mdata.items.forEach((d) => { d.addon = /추가|사리|\bthem\b|\bextra\b|\badd\b|topping/.test(norm([d.ko, d.vi, d.en].join(" "))); });
      mdata.items.forEach((d) => { d.hay = norm([d.ko, d.vi, d.en, (mdata.extra.zh || {})[d.s.id]?.[d.i], (mdata.extra.ja || {})[d.s.id]?.[d.i]].join(" ")); });
      mdata.status = "ok";
      renderList();
    }, () => { mdata.status = "fail"; renderList(); });
  }
  const dishName = (d) => {
    const x = lang === "zh" || lang === "ja" ? (mdata.extra[lang] || {})[d.s.id]?.[d.i] : d[lang];
    return x || (lang === "vi" ? d.vi || d.en || d.ko : lang === "ko" ? d.ko || d.vi || d.en : d.en || d.vi || d.ko);
  };
  const money = (d) => d.p == null ? MS[lang].market : String(Math.round(d.p)).replace(/\B(?=(\d{3})+(?!\d))/g, d.cur === "원" ? "," : ".") + d.cur;
  // 한 글자 영어·베트남어(a, b…)는 너무 많이 걸려서 안 찾고, 한글·한자·가나는 한 글자도 찾는다
  const menuQueryOk = (q) => { const n = norm(q).replace(/\s+/g, ""); return n.length >= 2 || /[぀-ヿ㐀-鿿가-힯]/.test(n); };
  function renderMenuHits() {
    const box = $("mhits"), m = MS[lang];
    if (!state.q || !menuQueryOk(state.q)) { box.hidden = true; mdata.show = 8; return 0; }
    if (mdata.status !== "ok") {
      loadMenus();
      box.hidden = false;
      box.innerHTML = `<h2>🍜 ${esc(m.title)}</h2><p class="wait">${esc(mdata.status === "fail" ? m.fail : m.wait)}</p>`;
      if (mdata.status === "fail") mdata.status = ""; // 다음 입력 때 다시 시도
      return 0;
    }
    if ((lang === "zh" || lang === "ja") && !mdata.extra[lang]) loadMenus();
    const words = norm(state.q).split(/\s+/).filter(Boolean);
    // 단어 하나는 메뉴 이름에 있어야 하고, 나머지는 메뉴 이름이나 가게(이름·지역 등)에 있으면 됨: "박닌 냉면"
    const hits = mdata.items.filter((d) => {
      if (state.region && d.s.region !== state.region) return false;
      if (state.cat && !d.s.cats.includes(state.cat)) return false;
      return words.some((w) => d.hay.includes(w)) && words.every((w) => d.hay.includes(w) || HAY[d.s.id].includes(w));
    }).sort((a, b) => (a.cur === "원") - (b.cur === "원") || a.addon - b.addon || (a.p == null) - (b.p == null) || (a.p || 0) - (b.p || 0));
    if (!hits.length) { box.hidden = true; return 0; }
    const shops = new Set(hits.map((d) => d.s.id)).size;
    box.hidden = false;
    box.innerHTML = `<h2>🍜 ${esc(m.title)} <small>${esc(m.sum.replace("{n}", hits.length).replace("{s}", shops))}</small></h2><ul>` +
      hits.slice(0, mdata.show).map((d) => `<li><a href="${esc(d.s.url)}/?lang=${lang}" target="_blank" rel="noopener"><span class="dn">${esc(dishName(d))}</span><span class="pr">${esc(money(d))}</span><span class="st">${esc(d.s.name)} · ${esc(L(REGIONS[d.s.region], lang))}</span></a></li>`).join("") +
      `</ul>` + (hits.length > mdata.show ? `<button type="button" class="more" id="mhitsMore">${esc(m.more.replace("{n}", Math.min(20, hits.length - mdata.show)))}</button>` : "");
    return hits.length;
  }
  $("mhits").addEventListener("click", (e) => { if (e.target.closest("#mhitsMore")) { mdata.show += 20; renderList(); } });
  $("q").addEventListener("focus", loadMenus, { once: true });

  function render() {
    const t = SI[lang];
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    $("q").placeholder = t.search;
    $("q").value = state.q;
    $("home").href = $("ownerBtn").href = `/?lang=${lang}`;
    $("gameBtn").href = `/stores/game.html?lang=${lang}`;
    $("gameBtn").textContent = { ko: "🎮 오늘 뭐 먹지? 메뉴 게임", vi: "🎮 Hôm nay ăn gì? Trò chơi chọn món", en: "🎮 What to eat today? Menu game", zh: "🎮 今天吃什么？选菜游戏", ja: "🎮 今日なに食べる？メニューゲーム" }[lang];
    $("q").setAttribute("aria-label", t.search);
    $("clear").setAttribute("aria-label", t.clear);
    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    renderCta();
    renderList();
  }

  // ── QR 메뉴판 상담·제작 문의 배너 (연락처는 /content.js 의 CONTACT 하나만 씀) ──
  const CTA = {
    ko: { kick: "사장님 전용 · 상담 무료", title: "우리 가게도 <em>QR 메뉴판</em>,<br>지금 만들어 드려요", sub: "손님 휴대폰 언어로 저절로 바뀌는 5개 언어 메뉴판. 메뉴판 사진만 보내 주시면 제작부터 테이블 QR 카드까지 해 드립니다.",
      pts: ["🌏 한·베·영·중·일 5개 언어", "📸 사진만 보내면 제작", "✏️ 메뉴·가격 수정 간편", "🖨️ 테이블 QR 카드 제공"],
      zalo: "Zalo 상담", call: "전화 상담", kakao: "카카오톡 ID 복사", copied: "복사됨! 카톡에서 친구 추가", more: "소개·가격 보기", note: "한국어 상담 <b>{ko}</b> · 베트남어 상담 <b>{vi}</b>", fab: "QR메뉴 상담" },
    vi: { kick: "Dành cho chủ quán · Tư vấn miễn phí", title: "Làm <em>thực đơn QR</em><br>cho quán của bạn ngay", sub: "Thực đơn 5 ngôn ngữ tự đổi theo ngôn ngữ điện thoại của khách. Chỉ cần gửi ảnh thực đơn, chúng tôi làm từ A đến Z, kèm thẻ QR để bàn.",
