<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<!-- 웹앱 아이콘 (tools/app-icon.mjs 로 만듦) -->
<link rel="manifest" href="/stores/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="QR Stores">
<title>QR 메뉴판 가게 찾기 · Tìm quán có thực đơn QR</title>
<meta name="description" content="5개 언어 QR 메뉴판이 있는 식당·가게 목록 — 박닌, 하노이, 꽝응아이, 한국. Danh sách nhà hàng có thực đơn QR 5 ngôn ngữ. Restaurants with QR menus in Korean, English, Chinese, Japanese and Vietnamese.">
<link rel="canonical" href="https://qrmenuasia.com/stores/">
<meta property="og:type" content="website">
<meta property="og:title" content="QR 메뉴판 가게 찾기 · Tìm quán có thực đơn QR">
<meta property="og:description" content="5개 언어 메뉴판이 있는 식당과 가게 · Nhà hàng có thực đơn 5 ngôn ngữ">
<meta property="og:url" content="https://qrmenuasia.com/stores/">
<style>
  :root {
    --ink: #16130f; --ink-2: #2a251f; --paper: #faf7f2; --card: #fff; --line: #e9e2d7;
    --muted: #6f675d; --accent: #e0452b; --accent-2: #f2a03d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  :lang(ko) h1, :lang(ko) p, :lang(ko) h2 { word-break: keep-all; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.3px; }

  /* 상단 */
  .hero { background: radial-gradient(120% 90% at 85% 0%, #3a2416 0%, var(--ink) 55%); color: #fff; padding: 16px 0 26px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .logo { font-weight: 800; display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; }
  .logo i { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #d8cfc3; background: transparent; border: 1px solid #5a4f43; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--ink); background: #fff; border-color: #fff; }
  .hero h1 { margin-top: 26px; font-size: clamp(26px, 5vw, 40px); font-weight: 900; }
  .hero p { margin: 10px 0 0; color: #d8cfc3; font-size: 16px; max-width: 36em; }

  /* 검색·필터 (스크롤해도 위에 붙어 있음) */
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(250,247,242,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 0 10px; }
  .search { position: relative; }
  .search input {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 40px 12px 42px; border-radius: 14px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,69,43,.15); }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 50%; background: #efe8de; color: var(--muted); font-size: 16px; cursor: pointer; display: none; }
  .search.has .clear { display: block; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips b { flex: none; align-self: center; font-size: 12px; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .chip { flex: none; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { color: #fff; background: var(--ink); border-color: var(--ink); }
  .chip small { font-size: 11.5px; opacity: .6; margin-left: 3px; }

  /* 목록 */
  main { padding: 16px 0 40px; }
  .count { font-size: 13px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 10px; }
  .store { display: grid; grid-template-columns: 104px 1fr; grid-template-areas: "shot info" "btns btns"; grid-template-rows: 1fr auto; gap: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .store .shot { grid-area: shot; position: relative; min-height: 132px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #f1ebe2; }
  .store .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .store .info { grid-area: info; min-width: 0; }
  .store h2 { font-size: 19px; }
  .store .sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .store .type { font-size: 14px; margin-top: 6px; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .meta > span { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: #f3ede4; color: var(--ink-2); }
  .meta .rg { background: #fff1ec; color: var(--accent); }
  .meta .zalo { background: #e6f0ff; color: #0058d6; }
  .meta .sale { background: #fde8ef; color: #c2185b; }
  .addr { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .btns { grid-area: btns; display: flex; gap: 8px; }
  .btn { min-height: 42px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 11px; padding: 9px 14px; }
  .btn.go { color: #fff; background: linear-gradient(135deg, var(--accent), #f0662f); flex: 1; }
  .btn.map { color: var(--ink-2); border: 1px solid var(--line); background: #fff; }
  .empty { display: none; text-align: center; padding: 50px 0; color: var(--muted); }
  .empty button { margin-top: 12px; font: inherit; font-weight: 700; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 16px; cursor: pointer; }

  /* 사장님 안내 */
  .owner { margin-top: 30px; border-radius: 20px; padding: 22px; color: #fff; display: flex; align-items: center; gap: 18px; justify-content: space-between; flex-wrap: wrap;
    background: radial-gradient(70% 120% at 100% 0%, rgba(240,102,47,.35), transparent 70%), var(--ink); }
  .owner h2 { font-size: 20px; }
  .owner p { margin: 6px 0 0; color: #d8cfc3; font-size: 14.5px; max-width: 32em; }
  .owner a { flex: none; color: var(--ink); background: #fff; text-decoration: none; font-weight: 800; border-radius: 12px; padding: 11px 16px; }
  footer { text-align: center; font-size: 12px; color: #9a9084; padding: 0 0 28px; }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .store { grid-template-columns: 88px 1fr; }
    /* 모바일: 지역·종류 칩을 줄바꿈해 한눈에 보이게 (칸이 높아져 위에 붙이지 않음) */
    .bar { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .chips { flex-wrap: wrap; overflow: visible; gap: 6px 5px; margin-top: 8px; }
    .chips b { flex-basis: 100%; font-size: 11.5px; line-height: 1.2; }
    .chip { font-size: 13px; padding: 5px 10px; }
    .search input { font-size: 15px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <a class="logo" id="home" href="/"><i>QR</i><span>QR Menu</span></a>
      <div class="langs" id="langs"></div>
    </div>
    <h1 data-t="heading">QR 메뉴판으로 만나는 가게</h1>
    <p data-t="sub">5개 언어 메뉴판이 있는 식당과 가게를 찾아보세요.</p>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clear" type="button" aria-label="clear">×</button>
    </div>
    <div class="chips" id="regionChips"></div>
    <div class="chips" id="catChips"></div>
  </div>
</div>

<main class="wrap">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <noscript><ul>
    <li><a href="https://sutkkui.qrmenuasia.com">숯꾸이 — 한국식 고깃집, Bắc Ninh</a></li>
    <li><a href="https://eros.qrmenuasia.com">EROS — Bar, Bắc Ninh</a></li>
    <li><a href="https://anvoi.qrmenuasia.com">Ăn Vội — Mì trộn, Quảng Ngãi</a></li>
    <li><a href="https://baekcheon.qrmenuasia.com">백천화덕아나고 — 화덕 장어구이, 경북 경산</a></li>
    <li><a href="https://gamasot.qrmenuasia.com">가마솥 GAMASOT — 한식당, Hà Nội</a></li>
    <li><a href="https://suwonseong.qrmenuasia.com">수원성 SUWONSUNG — 고깃집 · 한식, Ciputra, Hà Nội</a></li>
    <li><a href="https://biobeauty.qrmenuasia.com">Bio &amp; Beauty — 한국 화장품 할인 판매</a></li>
  </ul></noscript>
  <div class="empty" id="empty"><p data-t="empty"></p><button type="button" id="reset" data-t="reset"></button></div>

  <section class="owner">
    <div><h2 data-t="ownerTitle"></h2><p data-t="ownerSub"></p></div>
    <a id="ownerBtn" href="/" data-t="ownerBtn"></a>
  </section>
</main>
<footer>© QR Menu</footer>

<script src="/stores/data.js"></script>
<script>
  const LANGS = [["ko", "한국어"], ["vi", "Tiếng Việt"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"]];
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const L = (o, lang) => (o && (o[lang] || o.en || o.ko)) || "";
  function storage(fn) { try { return fn(localStorage); } catch { return null; } }
  // 검색용: 소문자 + 베트남어 성조·đ 제거 ("an voi" 로도 "Ăn Vội" 를 찾게)
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u0111/g, "d").normalize("NFC");

  // 가게마다 모든 언어의 이름·종류·지역·분류·주소·키워드를 한 줄로 묶어 둠
  const HAY = Object.fromEntries(STORES.map((s) => [s.id, norm([
    s.name, s.sub, s.address, s.keywords,
    ...Object.values(s.type), ...Object.values(REGIONS[s.region] || {}),
    ...s.cats.flatMap((c) => Object.values(CATS[c] || {})), ...s.tags.flatMap((t) => Object.values(TAGS[t] || {})),
  ].join(" "))]));

  const params = new URLSearchParams(location.search);
  const state = { q: params.get("q") || "", region: params.get("region") || "", cat: params.get("cat") || "" };
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  if (!own(REGIONS, state.region)) state.region = "";
  if (!own(CATS, state.cat)) state.cat = "";

  function detectLang() {
    const q = params.get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("sales-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    if (/bot|crawl|spider|yeti|daum|slurp/i.test(navigator.userAgent)) return "ko"; // 검색 로봇은 영어 기기 언어라 설명이 영어로만 나오던 문제
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "ko";
  }
  let lang = detectLang();

  const matches = (s, skip) => {
    if (skip !== "region" && state.region && s.region !== state.region) return false;
    if (skip !== "cat" && state.cat && !s.cats.includes(state.cat)) return false;
    const words = norm(state.q).split(/\s+/).filter(Boolean);
    return words.every((w) => HAY[s.id].includes(w));
  };

  // 주소창에 조건을 남겨 링크로 공유할 수 있게
  function syncUrl() {
    const p = new URLSearchParams();
    if (params.get("lang")) p.set("lang", lang);
    if (state.q) p.set("q", state.q);
    if (state.region) p.set("region", state.region);
    if (state.cat) p.set("cat", state.cat);
    const qs = p.toString();
    try { history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "")); } catch {}
  }

  function chips(el, key, dict, label) {
    // 칩 옆 숫자는 다른 조건을 그대로 둔 채 이 칩을 골랐을 때 나오는 가게 수
    const n = (v) => STORES.filter((s) => matches(s, key) && (!v || (key === "region" ? s.region === v : s.cats.includes(v)))).length;
    const keys = Object.keys(dict).filter((k) => STORES.some((s) => key === "region" ? s.region === k : s.cats.includes(k)));
    el.innerHTML = `<b>${esc(label)}</b>` + ["", ...keys].map((k) => {
      const icon = k && dict[k].icon ? `<span aria-hidden="true">${dict[k].icon}</span> ` : "";
      const text = k ? L(dict[k], lang) : SI[lang].all;
      return `<button type="button" class="chip" data-k="${key}" data-v="${k}" aria-pressed="${state[key] === k}">${icon}${esc(text)}<small aria-label=", ${n(k)} ${esc(SI[lang].unit)}">${n(k)}</small></button>`;
    }).join("");
  }

  function renderList() {
    const t = SI[lang];
    const list = STORES.filter((s) => matches(s));
    $("count").textContent = list.length === 1 && t.count1 ? t.count1 : t.count.replace("{n}", list.length);
    $("empty").style.display = list.length ? "none" : "block";
    $("grid").innerHTML = list.map((s) => {
      const menuUrl = `${s.url}/?lang=${lang}`;
      const map = s.map || (s.address ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.name + " " + s.address) : null);
      const tags = s.tags.map((k) => `<span class="${k}">${esc(L(TAGS[k], lang))}</span>`).join("");
      return `<article class="store">
        <a class="shot" href="${esc(menuUrl)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="/img/demo-${esc(s.id)}.jpg" alt="${esc(s.name)}" loading="lazy"></a>
        <div class="info">
          <h2>${esc(s.name)}</h2>
          ${s.sub ? `<div class="sub">${esc(s.sub)}</div>` : ""}
          <div class="type">${esc(L(s.type, lang))}</div>
          <div class="meta"><span class="rg"><span aria-hidden="true">📍</span> ${esc(L(REGIONS[s.region], lang))}</span>${s.cats.map((c) => `<span><span aria-hidden="true">${CATS[c].icon}</span> ${esc(L(CATS[c], lang))}</span>`).join("")}${tags}</div>
          ${s.address ? `<div class="addr">${esc(s.address)}</div>` : ""}
        </div>
        <div class="btns">
          <a class="btn go" href="${esc(menuUrl)}" target="_blank" rel="noopener">${esc(t.menu)} →</a>
          ${map ? `<a class="btn map" href="${esc(map)}" target="_blank" rel="noopener"><span aria-hidden="true">🧭</span> ${esc(t.map)}</a>` : ""}
        </div>
      </article>`;
    }).join("");
    chips($("regionChips"), "region", REGIONS, t.region);
    chips($("catChips"), "cat", CATS, t.cat);
    $("searchBox").classList.toggle("has", !!state.q);
    syncUrl();
  }

  function render() {
    const t = SI[lang];
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    $("q").placeholder = t.search;
    $("q").value = state.q;
    $("home").href = $("ownerBtn").href = `/?lang=${lang}`;
    $("q").setAttribute("aria-label", t.search);
    $("clear").setAttribute("aria-label", t.clear);
    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    renderList();
  }

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c; storage((s) => s.setItem("sales-lang", c)); render();
  });
  $("q").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
  $("clear").addEventListener("click", () => { state.q = ""; $("q").value = ""; renderList(); $("q").focus(); });
  document.querySelector(".bar").addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    state[b.dataset.k] = state[b.dataset.k] === b.dataset.v ? "" : b.dataset.v;
    renderList();
  });
  $("reset").addEventListener("click", () => { state.q = state.region = state.cat = ""; $("q").value = ""; renderList(); });
  render();
</script>
<script src="/lang-menu.js"></script>
<!-- sw:start (홈 화면 웹앱 설치용, sales/sw.js) -->

</body>
</html>
