<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>메뉴 관리 · Quản lý thực đơn</title>
<style>
  :root { --bg: #f6f3ee; --card: #fff; --ink: #1f2430; --muted: #7a7466; --line: #e7e0d2; --accent: #e8590c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16171b; --card: #20222a; --ink: #eceae4; --muted: #9a9484; --line: #33363f; --accent: #ff8a4c; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.45; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .login { max-width: 380px; margin: 12vh auto 0; text-align: center; }
  .login input { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; background: var(--bg); color: var(--ink); text-align: center; }
  .btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; width: 100%; padding: 12px; font-size: 16px; }
  .err { color: #e03131; min-height: 20px; font-size: 14px; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .lang button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 5px 10px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">메뉴 관리</h1>
    <span class="lang" id="lang"><button type="button" data-l="ko">한국어</button><button type="button" data-l="vi">Tiếng Việt</button></span>
    <button class="btn" id="out" type="button" hidden></button>
  </header>

  <div class="card login" id="login">
    <h2 id="lt" style="margin:0 0 4px"></h2>
    <p id="ls" style="color:var(--muted);margin:0 0 10px;font-size:14px"></p>
    <input id="shop" placeholder="" autocomplete="off" autocapitalize="off">
    <input id="pw" type="password" placeholder="" autocomplete="current-password">
    <button class="btn pri" id="go" type="button"></button>
    <p class="err" id="err"></p>
  </div>

  <div id="editor" hidden></div>
</div>

<script src="/stores/data.js"></script>
<script src="/menu-editor.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const S = {
    ko: { t: '메뉴 관리', lt: '점주 로그인', ls: '가게 비밀번호를 입력해 주세요', shop: '가게 아이디 (예: ijang)', pw: '비밀번호', go: '들어가기', out: '나가기', wrong: '비밀번호가 맞지 않아요', blocked: '시도가 너무 많아 한 시간 막혔어요', fail: '잠시 뒤 다시 시도해 주세요' },
    vi: { t: 'Quản lý thực đơn', lt: 'Đăng nhập chủ quán', ls: 'Nhập mật khẩu của quán', shop: 'Mã quán (ví dụ: ijang)', pw: 'Mật khẩu', go: 'Vào', out: 'Thoát', wrong: 'Mật khẩu không đúng', blocked: 'Thử sai quá nhiều, bị khóa 1 giờ', fail: 'Vui lòng thử lại sau' },
  };
  const q = new URLSearchParams(location.search);
  let ui = q.get('lang') || (() => { try { return localStorage.getItem('owner-lang'); } catch { return null; } })() || ((navigator.language || '').startsWith('vi') ? 'vi' : 'ko');
  if (!S[ui]) ui = 'ko';
  let shop = (q.get('shop') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const storeName = (id) => { const s = (window.STORES || []).find((x) => x.id === id); return s ? s.name : id; };
  const tokKey = (id) => 'qm_owner_' + id;
  const getTok = () => { try { return sessionStorage.getItem(tokKey(shop)); } catch { return null; } };
  let ed = null;

  function texts() {
    const t = S[ui];
    document.documentElement.lang = ui;
    $('title').textContent = shop ? `${storeName(shop)} · ${t.t}` : t.t;
    $('lt').textContent = t.lt; $('ls').textContent = t.ls; $('shop').placeholder = t.shop; $('pw').placeholder = t.pw; $('go').textContent = t.go; $('out').textContent = t.out;
    $('shop').hidden = !!q.get('shop');
    document.querySelectorAll('#lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === ui));
  }
  function showLogin(msg) { $('editor').hidden = true; $('out').hidden = true; $('login').hidden = false; $('err').textContent = msg || ''; ed = null; texts(); }
  function showEditor() {
    $('login').hidden = true; $('out').hidden = false; $('editor').hidden = false; $('editor').innerHTML = '';
    ed = MenuEditor.mount($('editor'), { shop, ui, headers: () => ({ 'x-owner-token': getTok() || '' }), onAuthFail: () => { try { sessionStorage.removeItem(tokKey(shop)); } catch {} showLogin(S[ui].wrong); } });
    texts();
  }
  async function login() {
    const t = S[ui];
    if (!shop) shop = $('shop').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    const password = $('pw').value.trim();
    if (!shop || !password) return;
    $('err').textContent = '';
    try {
      const r = await fetch('/api/owner', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ shop, password }) });
      if (r.status === 429) return ($('err').textContent = t.blocked);
      if (!r.ok) return ($('err').textContent = r.status === 401 ? t.wrong : t.fail);
      const j = await r.json();
      try { sessionStorage.setItem(tokKey(shop), j.token); } catch {}
      $('pw').value = ''; showEditor();
    } catch { $('err').textContent = t.fail; }
  }
  $('go').onclick = login;
  $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  $('out').onclick = () => { try { sessionStorage.removeItem(tokKey(shop)); } catch {} showLogin(); };
  $('lang').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; ui = b.dataset.l; try { localStorage.setItem('owner-lang', ui); } catch {} if (getTok() && ed) showEditor(); else texts(); });
  texts();
  if (shop && getTok()) showEditor(); else showLogin();
</script>
</body>
</html>
