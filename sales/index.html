<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<!-- 웹앱 아이콘 (tools/app-icon.mjs 로 만듦) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="QR Menu">
<title>다국어 QR 메뉴판</title>
<meta name="description" content="손님 휴대폰 언어로 자동으로 바뀌는 다국어 QR 메뉴판 — 한국어 · English · 中文 · 日本語 · Tiếng Việt. Multilingual QR menu for restaurants.">
<style>
  :root {
    --ink: #16130f;
    --ink-2: #2a251f;
    --paper: #faf7f2;
    --card: #ffffff;
    --line: #e9e2d7;
    --muted: #6f675d;
    --accent: #e0452b;
    --accent-2: #f2a03d;
    --gold: #c99a3e;
    --sys: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
  :lang(ko) body, :lang(ko) h1, :lang(ko) h2, :lang(ko) h3, :lang(ko) p { word-break: keep-all; }
  :lang(ja) h1, :lang(zh-Hans) h1 { line-break: strict; }
  h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -.3px; }
  section { padding: 56px 0; }
  .sec-title { font-size: 28px; font-weight: 800; }
  .sec-sub { margin: 8px 0 0; color: var(--muted); }

  /* ── 상단 ── */
  .hero { background: radial-gradient(120% 90% at 85% 0%, #3a2416 0%, var(--ink) 55%); color: #fff; padding: 18px 0 56px; overflow: hidden; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .logo i { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #d8cfc3; background: transparent; border: 1px solid #5a4f43; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--ink); background: #fff; border-color: #fff; }
  .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 28px; align-items: center; margin-top: 40px; }
  .kicker { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent-2); border: 1px solid rgba(242,160,61,.4); border-radius: 999px; padding: 4px 12px; }
  .hero h1 { font-size: clamp(32px, 5.4vw, 50px); font-weight: 900; margin-top: 16px; }
  .hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: #d8cfc3; font-size: 17px; margin: 16px 0 0; max-width: 34em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .chips span { font-size: 13px; font-weight: 600; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 3px 9px; }
  .ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 12px; padding: 12px 18px; }
  .btn.primary { color: #fff; background: linear-gradient(135deg, var(--accent), #f0662f); box-shadow: 0 8px 22px rgba(224,69,43,.35); }
  .btn.ghost { color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .phones { position: relative; height: 420px; }
  .phone { position: absolute; width: 190px; border-radius: 30px; padding: 8px; background: #0b0a09; box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 0 1px #3b342c; }
  .phone img { display: block; width: 100%; border-radius: 23px; aspect-ratio: 375 / 760; object-fit: cover; object-position: top; }
  .phone.a { left: 4%; top: 30px; transform: rotate(-7deg); }
  .phone.b { right: 4%; top: 0; transform: rotate(6deg); }
  .phone.c { left: 50%; top: 50px; transform: translateX(-50%); z-index: 2; }

  /* ── 데모 ── */
  .demos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 28px; }
  .demo .tag { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 800; color: #fff; background: #0068ff; border-radius: 999px; padding: 2px 9px; }
  .demo { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-decoration: none; color: inherit; }
  .demo .shot { flex: none; width: 112px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .demo .shot img { display: block; width: 100%; aspect-ratio: 375 / 600; object-fit: cover; object-position: top; }
  .demo h3 { font-size: 20px; }
  .demo .type { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .demo .qr { width: 96px; height: 96px; margin-top: 10px; display: block; border-radius: 8px; border: 1px solid var(--line); }
  .demo .url { font-size: 11px; color: var(--accent); margin-top: 6px; word-break: break-all; }

  /* ── 함께 드리는 것 ── */
  .kit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 28px; }
  .kit-item { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .kit-pic { display: flex; justify-content: center; align-items: center; gap: 10px; height: 250px; padding: 18px; background: #f1ebe2; }
  .kit-pic img { display: block; max-height: 100%; max-width: 100%; border-radius: 6px; box-shadow: 0 10px 24px rgba(22,19,15,.22); }
  .kit-pic.sns img { border-radius: 10px; min-width: 0; max-width: 60%; }
  .kit-pic.sns img + img { max-width: 34%; }
  .kit-body { padding: 14px 16px 16px; }
  .kit-body .size { display: inline-block; font-size: 12px; font-weight: 800; color: var(--accent); background: #fff1ec; border-radius: 999px; padding: 2px 9px; }
  .kit-body h3 { font-size: 17px; margin-top: 8px; }
  .kit-body p { margin: 6px 0 0; font-size: 14.5px; color: var(--muted); }

  .find { display: inline-flex; margin-top: 16px; font-weight: 700; font-size: 15px; color: var(--accent); text-decoration: none; border: 1px solid #f3c9bd; background: #fff; border-radius: 999px; padding: 9px 16px; }

  /* ── 특징 ── */
  .feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 28px; }
  .feat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .feat b { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: #fff1ec; color: var(--accent); font-size: 18px; }
  .feat h3 { font-size: 17px; margin-top: 12px; }
  .feat p { margin: 6px 0 0; font-size: 14.5px; color: var(--muted); }

  /* ── 진행 순서 ── */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 28px; counter-reset: s; }
  .step { position: relative; padding: 18px 16px; border-radius: 16px; background: var(--ink-2); color: #fff; }
  .step::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 800; font-size: 14px; }
  .step h3 { font-size: 16px; margin-top: 12px; }
  .step p { margin: 6px 0 0; font-size: 14px; color: #cfc5b8; }

  /* ── 가격 ── */
  .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 28px; align-items: stretch; }
  .plan { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; display: flex; flex-direction: column; }
  .plan.hot { border: 2px solid var(--accent); box-shadow: 0 14px 34px rgba(224,69,43,.14); }
  .plan .badge { position: absolute; top: -12px; left: 20px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .plan h3 { font-size: 18px; }
  .plan .price { margin-top: 10px; font-size: 30px; font-weight: 900; letter-spacing: -.5px; }
  .plan .price small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .plan ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
  .plan li { position: relative; padding-left: 24px; font-size: 14.5px; }
  .plan li::before { content: "✓"; position: absolute; left: 0; top: 0; color: var(--accent); font-weight: 900; }
  .opts { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 20px; }
  .opts h3 { font-size: 16px; padding: 12px 0 6px; }
  .opt { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
  .opt span:last-child { font-weight: 700; white-space: nowrap; }
  .note { margin: 12px 0 0; font-size: 13px; color: var(--muted); }

  /* ── FAQ ── */
  .faqs { margin-top: 24px; display: grid; gap: 10px; }
  .faq { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .faq h3 { font-size: 16px; }
  .faq h3::before { content: "Q. "; color: var(--accent); }
  .faq p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }

  /* ── 문의 ── */
  /* ── 문의하기 ── */
  .contact {
    position: relative; overflow: hidden; color: #fff; text-align: center; padding: 72px 0 64px;
    background:
      radial-gradient(60% 70% at 50% 0%, rgba(240, 102, 47, .32) 0%, transparent 70%),
      radial-gradient(40% 50% at 8% 100%, rgba(0, 104, 255, .16) 0%, transparent 70%),
      radial-gradient(40% 50% at 92% 100%, rgba(254, 229, 0, .12) 0%, transparent 70%),
      var(--ink);
  }
  .contact::before { /* 은은한 점 무늬 */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.4px); background-size: 18px 18px;
    -webkit-mask-image: linear-gradient(#000, transparent 85%); mask-image: linear-gradient(#000, transparent 85%);
  }
  .contact .wrap { position: relative; }
  .c-kicker {
    display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; letter-spacing: .3px;
    color: var(--accent-2); background: rgba(242, 160, 61, .1); border: 1px solid rgba(242, 160, 61, .35); border-radius: 999px; padding: 6px 14px 5px;
  }
  .c-kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 4px rgba(61, 220, 132, .2); }
  .contact h2 {
    margin-top: 16px; font-weight: 900; font-size: 60px; line-height: 1.1; letter-spacing: -1.5px;
    background: linear-gradient(180deg, #fff 30%, #ffd2b8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .contact .c-sub { margin: 12px auto 0; max-width: 520px; font-size: 18px; color: #e6dccf; }
  .contact .c-sub b { color: var(--accent-2); }
  .contact-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 36px auto 0; max-width: 860px; }
  .contact-btns + .contact-btns { margin-top: 18px; }
  .c-group { grid-column: 1 / -1; margin: 6px 0 -4px; text-align: left; font-size: 13px; font-weight: 800; letter-spacing: .5px; color: var(--accent-2); }
  .cbtn {
    position: relative; display: flex; align-items: center; gap: 14px; padding: 18px 18px; border-radius: 20px; text-align: left;
    text-decoration: none; color: #fff; cursor: pointer; font: inherit; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .cbtn:hover { transform: translateY(-3px); }
  .cbtn .ico { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
  .cbtn .ico svg { width: 28px; height: 28px; }
  .cbtn .txt { min-width: 0; flex: 1; }
  .cbtn small { display: block; font-weight: 700; font-size: 12.5px; letter-spacing: .3px; opacity: .8; }
  .cbtn strong { display: block; margin-top: 3px; font-weight: 800; font-size: 24px; letter-spacing: -.2px; white-space: nowrap; }
  .cbtn .hint { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 600; opacity: .75; }
  .cbtn .go { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); font-size: 15px; }
  .cbtn.call { border: 0; background: linear-gradient(135deg, var(--accent) 0%, #f0662f 55%, var(--accent-2) 130%); box-shadow: 0 14px 34px rgba(224, 69, 43, .42); }
  .cbtn.call .ico { background: rgba(255,255,255,.2); }
  .cbtn.call:hover { box-shadow: 0 18px 40px rgba(224, 69, 43, .55); }
  .cbtn.zalo { border-color: rgba(0, 104, 255, .55); background: linear-gradient(135deg, rgba(0, 104, 255, .22), rgba(0, 104, 255, .06)); }
  .cbtn.zalo .ico { background: #0068ff; }
  .cbtn.zalo:hover { box-shadow: 0 14px 34px rgba(0, 104, 255, .3); }
  .cbtn.kakao { border-color: rgba(254, 229, 0, .5); background: linear-gradient(135deg, rgba(254, 229, 0, .18), rgba(254, 229, 0, .04)); }
  .cbtn.kakao .ico { background: #fee500; }
  .cbtn.kakao:hover { box-shadow: 0 14px 34px rgba(254, 229, 0, .2); }
  .cbtn.kakao.done .hint { color: #fee500; opacity: 1; }
  .c-langs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 40px; }
  .c-langs span { font-size: 12.5px; font-weight: 600; color: #b9ad9e; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 12px; }
  footer { background: var(--ink); color: #6f655a; text-align: center; font-size: 12px; padding: 0 0 26px; }

  @media screen and (max-width: 760px) {
    section { padding: 44px 0; }
    .hero-grid { grid-template-columns: 1fr; margin-top: 28px; }
    .phones { height: 330px; }
    .phone { width: 150px; border-radius: 24px; padding: 6px; }
    .phone img { border-radius: 19px; }
    .phone.a { left: 2%; } .phone.b { right: 2%; }
    .demos, .feats, .plans, .kit { grid-template-columns: 1fr; }
    .kit-pic { height: 220px; }
    .steps { grid-template-columns: 1fr 1fr; }
    .sec-title { font-size: 24px; }
    .contact { padding: 56px 0 48px; }
    .contact h2 { font-size: 40px; }
    .contact .c-sub { font-size: 16px; }
    .contact-btns { grid-template-columns: 1fr; gap: 12px; margin-top: 28px; }
    .cbtn { padding: 16px; }
  }

  /* ── 인쇄 (A4) ── */
  @page { size: A4; margin: 10mm; }
  @media print {
    body { background: #fff; font-size: 11px; }
    .wrap { max-width: none; padding: 0; }
    .langs, .ctas { display: none; }
    section { padding: 18px 0; break-inside: avoid; }
    .hero { padding: 14px 18px 22px; border-radius: 14px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .hero-grid { margin-top: 14px; grid-template-columns: 1.2fr .8fr; }
    .hero h1 { font-size: 27px; }
    .hero p { font-size: 13px; }
    .phones { height: 220px; }
    .phone { width: 118px; border-radius: 18px; padding: 5px; }
    .phone img { border-radius: 14px; }
    .sec-title { font-size: 19px; }
    .demos, .feats { gap: 8px; margin-top: 12px; }
    .demo { padding: 8px; gap: 10px; }
    .demo .shot { width: 70px; }
    .demo .qr { width: 64px; height: 64px; margin-top: 6px; }
    .demo h3 { font-size: 13px; }
    .demos { grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .demo .shot { display: none; }
    .demo { gap: 7px; padding: 7px; }
    .demo .shot { width: 52px; }
    .demo .type, .demo .url { font-size: 9px; }
    .demo .qr { width: 52px; height: 52px; }
    .demo .tag { font-size: 9px; padding: 1px 6px; margin-top: 3px; }
    .demo h3 { word-break: keep-all; }
    .feat { padding: 9px 11px; }
    .feat b { float: left; width: 22px; height: 22px; border-radius: 7px; font-size: 12px; margin-right: 7px; }
    .feat h3 { margin-top: 2px; font-size: 13px; }
    .feat p { clear: both; margin-top: 5px; }
    .feat p, .step p, .plan li, .opt, .faq p { font-size: 11px; }
    .steps, .plans { gap: 8px; margin-top: 12px; }
    .step, .plan { padding: 12px; }
    .plan .price { font-size: 22px; }
    #faq, .find { display: none; }
    #kit { padding: 0 0 14px; }
    #kit .sec-sub { display: none; }
    .kit { gap: 8px; margin-top: 8px; }
    .kit-item { flex-direction: row; align-items: center; border-radius: 12px; }
    .kit-pic { flex: none; width: 34%; height: 76px; padding: 5px; gap: 4px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .kit-pic img { box-shadow: none; border: 1px solid var(--line); }
    .kit-body { padding: 6px 8px; }
    .kit-body h3 { font-size: 12px; margin-top: 3px; }
    .kit-body p { font-size: 9px; margin-top: 2px; line-height: 1.35; }
    .kit-body .size { font-size: 9px; padding: 1px 6px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .contact { border-radius: 14px; padding: 20px 18px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .contact h2 { font-size: 30px; margin-top: 8px; background: none; color: #fff; }
    .contact .c-sub { font-size: 12px; margin-top: 6px; }
    .contact-btns { margin-top: 14px; gap: 8px; }
    .c-group { font-size: 10px; margin: 2px 0 -4px; }
    #contactBtns { display: flex; gap: 8px; margin-top: 14px; }
    #contactBtns .contact-btns { flex: var(--n) 1 0; min-width: 0; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; margin: 0; max-width: none; }
    #contactBtns .cbtn { padding: 7px 8px; gap: 6px; min-width: 0; }
    #contactBtns .cbtn small { font-size: 9px; }
    #contactBtns .cbtn .ico { width: 28px; height: 28px; border-radius: 9px; }
    #contactBtns .cbtn .ico svg { width: 16px; height: 16px; }
    #contactBtns .cbtn strong { font-size: 12px; }
    .cbtn { padding: 10px 12px; gap: 10px; border-radius: 14px; box-shadow: none !important; }
    .cbtn .ico { width: 36px; height: 36px; border-radius: 11px; }
    .cbtn .ico svg { width: 20px; height: 20px; }
    .cbtn strong { font-size: 16px; }
    .cbtn .hint, .cbtn .go, .c-langs { display: none; }
    .cbtn, .cbtn .ico, .c-kicker { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .step, .contact, .plan .badge, .feat b, .btn, .demo .shot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    footer { display: none; }
    #steps { break-before: page; }
  }
</style>

<body>
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <div class="logo"><i>QR</i><span data-t="title"></span></div>
      <div class="langs" id="langs"></div>
    </div>
    <div class="hero-grid">
      <div>
        <span class="kicker" data-t="kicker"></span>
        <h1 data-html="heroTitle"></h1>
        <p data-t="heroSub"></p>
        <div class="chips"><span>한국어</span><span>English</span><span>中文</span><span>日本語</span><span>Tiếng Việt</span></div>
        <div class="ctas">
          <a class="btn primary" href="#demo" data-t="ctaDemo"></a>
          <a class="btn ghost" href="#price" data-t="ctaPrice"></a>
        </div>
      </div>
      <div class="phones" id="phones"></div>
    </div>
  </div>
</header>

<section id="demo"><div class="wrap">
  <h2 class="sec-title" data-t="demoTitle"></h2>
  <p class="sec-sub" data-t="demoSub"></p>
  <div class="demos" id="demos"></div>
  <a class="find" id="findLink" href="stores/"></a>
</div></section>

<section id="kit" style="padding-top:0"><div class="wrap">
  <h2 class="sec-title" data-t="kitTitle"></h2>
  <p class="sec-sub" data-t="kitSub"></p>
  <div class="kit" id="kit-list"></div>
</div></section>

<section id="feat" style="padding-top:0"><div class="wrap">
  <h2 class="sec-title" data-t="featTitle"></h2>
  <div class="feats" id="feats"></div>
</div></section>

<section id="steps" style="padding-top:0"><div class="wrap">
  <h2 class="sec-title" data-t="stepTitle"></h2>
  <div class="steps" id="stepList"></div>
</div></section>

<section id="price" style="padding-top:0"><div class="wrap">
  <h2 class="sec-title" data-t="priceTitle"></h2>
  <div class="plans" id="plans"></div>
  <div class="opts" id="opts"></div>
  <p class="note" data-t="priceNote"></p>
</div></section>

<section id="faq" style="padding-top:0"><div class="wrap">
  <h2 class="sec-title" data-t="faqTitle"></h2>
  <div class="faqs" id="faqs"></div>
</div></section>

<section class="contact" id="contact"><div class="wrap">
  <span class="c-kicker" data-t="contactKicker"></span>
  <h2 data-t="contactTitle"></h2>
  <p class="c-sub" data-t="contactSub"></p>
  <div id="contactBtns"></div>
  <div class="c-langs"><span>한국어</span><span>English</span><span>中文</span><span>日本語</span><span>Tiếng Việt</span></div>
</div></section>
<footer>© QR Menu</footer>

<script src="content.js"></script>
<script>
  const LANGS = [["ko", "한국어"], ["vi", "Tiếng Việt"], ["zh", "中文"], ["ja", "日本語"], ["en", "English"]];
  const SUPPORTED = LANGS.map(([c]) => c);
  const FEAT_ICONS = ["🌐", "🎨", "🔳", "✏️", "📶", "📱"];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const vnd = (n) => n.toLocaleString("en-US") + "₫";
  // 문구 안의 {yearly} 같은 자리에 가격을 채움
  const fill = (s) => s.replace(/\{(\w+)\}/g, (_, k) => vnd(PRICES[k]));
  function storage(fn) { try { return fn(localStorage); } catch { return null; } }

  // 우선순위: ?lang= → 직접 고른 언어 → 휴대폰 언어 → 한국어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("sales-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    if (/bot|crawl|spider|yeti|daum|slurp/i.test(navigator.userAgent)) return "ko"; // 검색 로봇은 영어 기기 언어라 설명이 영어로만 나오던 문제
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "ko";
  }

  function render(lang) {
    const t = T[lang];
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll("[data-html]").forEach((el) => { el.innerHTML = t[el.dataset.html]; });

    $("langs").innerHTML = LANGS.map(([c, label]) =>
      `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");

    // hidden: true 인 가게는 사장님 동의 전이라 소개서에 안 보임 (SNS 이미지 도구용 데이터만 있음)
    const SHOWN = DEMOS.filter((d) => !d.hidden);
    $("phones").innerHTML = SHOWN.map((d, i) =>
      `<a class="phone ${["a", "b", "c"][i] || "a"}" href="${d.url}" target="_blank" rel="noopener"><img src="${d.shot}" alt="${esc(d.name)}"></a>`).join("");

    $("demos").innerHTML = SHOWN.map((d) => `
      <a class="demo" href="${d.url}" target="_blank" rel="noopener">
        <div class="shot"><img src="${d.shot}" alt="" loading="lazy"></div>
        <div>
          <h3>${esc(d.name)}</h3>
          <div class="type">${esc(d.type[lang] || d.type.en)}</div>
          ${d.tag ? `<span class="tag">${esc(d.tag[lang] || d.tag.en)}</span>` : ""}
          <img class="qr" src="${d.qr}" alt="QR ${esc(d.url)}">
          <div class="url">${esc(d.url.replace("https://", ""))}</div>
        </div>
      </a>`).join("");

    const KIT_PICS = [
      '<div class="kit-pic"><img src="img/kit-a6.jpg" alt=""></div>',
      '<div class="kit-pic"><img src="img/kit-a4.jpg" alt=""></div>',
      '<div class="kit-pic sns"><img src="img/kit-sns-square.jpg" alt=""><img src="img/kit-sns-story.jpg" alt=""></div>',
    ];
    $("kit-list").innerHTML = (t.kit || []).map(([size, h, p], i) =>
      `<div class="kit-item">${KIT_PICS[i] || ""}<div class="kit-body"><span class="size">${esc(size)}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></div></div>`).join("");

    $("findLink").textContent = t.findLink + " →";
    $("findLink").href = `stores/?lang=${lang}`;

    $("feats").innerHTML = t.feats.map(([h, p], i) =>
      `<div class="feat"><b>${FEAT_ICONS[i]}</b><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");

    $("stepList").innerHTML = t.steps.map(([h, p]) => `<div class="step"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");

    const plan = (key, price, suffix, hot) => {
      const [name, items] = t.plans[key];
      return `<div class="plan ${hot ? "hot" : ""}">
        ${hot ? `<span class="badge">${esc(t.popular)}</span>` : ""}
        <h3>${esc(name)}</h3>
        <div class="price">${vnd(price)}<small>${esc(suffix)}</small></div>
        <ul>${items.map((s) => `<li>${esc(fill(s))}</li>`).join("")}</ul>
      </div>`;
    };
    $("plans").innerHTML = plan("basic", PRICES.basic, t.once) + plan("premium", PRICES.premium, t.once, true) + plan("monthly", PRICES.monthly, t.perMonth);
    $("opts").innerHTML = `<h3>${esc(t.optTitle)}</h3>` + t.opts.map(([a, b]) => `<div class="opt"><span>${esc(a)}</span><span>${esc(fill(b))}</span></div>`).join("");

    $("faqs").innerHTML = t.faqs.map(([q, a]) => `<div class="faq"><h3>${esc(q)}</h3><p>${esc(a)}</p></div>`).join("");

    const C = window.CONTACT, btns = [];
    const ICON = {
      call: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
      zalo: '<svg viewBox="0 0 24 24"><text x="12" y="15.6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="9.5" fill="#fff">Zalo</text></svg>',
      kakao: '<svg viewBox="0 0 24 24"><path fill="#3a1d1d" d="M12 3.5C6.8 3.5 2.6 6.8 2.6 10.9c0 2.6 1.7 4.9 4.3 6.2l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.4 0 .7.1 1.1.1 5.2 0 9.4-3.3 9.4-7.5S17.2 3.5 12 3.5z"/><text x="12" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="5" fill="#fee500">TALK</text></svg>',
    };
    const card = (cls, tag, attrs, label, value, hint) =>
      `<${tag} class="cbtn ${cls}" ${attrs}><span class="ico">${ICON[cls]}</span><span class="txt"><small>${esc(label)}</small><strong>${esc(value)}</strong><span class="hint">${esc(hint)}</span></span><span class="go">→</span></${tag}>`;
    const callBtn = (n) => card("call", "a", `href="tel:${esc(n.replace(/\s/g, ""))}"`, t.call, n, t.callHint);
    const zaloBtn = (n) => card("zalo", "a", `href="https://zalo.me/${esc(n.replace(/\D/g, ""))}" target="_blank" rel="noopener"`, t.zalo, n, t.zaloHint);
    if (C.phone) btns.push(callBtn(C.phone));
    if (C.zalo) btns.push(zaloBtn(C.zalo));
    if (C.kakao) btns.push(card("kakao", "button", `type="button" id="kakaoBtn"`, t.kakao, C.kakao, t.kakaoHint));
    // 상담 언어별 묶음: 한국어(전화·Zalo·카카오톡) + 베트남어(전화·Zalo). 베트남어 화면이면 베트남어 상담을 먼저
    const groups = [[`<span class="c-group">${esc(t.groupKo)}</span>` + btns.join(""), btns.length]];
    if (C.vi) {
      const vb = [C.vi.phone && callBtn(C.vi.phone), C.vi.zalo && zaloBtn(C.vi.zalo)].filter(Boolean);
      groups[lang === "vi" ? "unshift" : "push"]([`<span class="c-group">${esc(t.groupVi)}</span>` + vb.join(""), vb.length]);
    }
    $("contactBtns").innerHTML = groups.map(([g, n]) => `<div class="contact-btns" style="--n:${n}">${g}</div>`).join("");
    const kb = $("kakaoBtn");
    if (kb) kb.addEventListener("click", () => {
      const done = () => { kb.classList.add("done"); kb.querySelector(".hint").textContent = t.copied; kb.querySelector(".go").textContent = "✓"; };
      try { navigator.clipboard.writeText(C.kakao).then(done, done); } catch (e) { done(); }
    });
  }

  let lang = detectLang();
  render(lang);
  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("sales-lang", c));
    render(lang);
  });
</script>
<script src="lang-menu.js"></script>
<!-- sw:start (홈 화면 웹앱 설치용, sales/sw.js) -->
<script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });</script>

</body>
</html>
