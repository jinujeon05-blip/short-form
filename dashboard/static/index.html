<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR메뉴 사무실</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">QR</span><div><b>QR메뉴 사무실</b><small id="updated">불러오는 중…</small></div></div>
  <div class="counts" id="counts"></div>
</header>

<section class="quota" id="quota" aria-label="할당량"></section>

<main>
  <section class="office" id="office" aria-label="사무실"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="stores" class="on">가게 현황</button>
    <button role="tab" data-tab="todo">할 일</button>
    <button role="tab" data-tab="visits">방문 기록</button>
  </nav>
  <section class="tab" id="tab-stores">
    <div class="filters">
      <input id="q" type="search" placeholder="가게 이름 찾기">
      <div class="seg" id="kind">
        <button data-k="" class="on">전체</button><button data-k="full">정식</button><button data-k="listing">가게 찾기용</button>
      </div>
    </div>
    <div class="cards" id="stores"></div>
    <button class="btn ghost more" id="more" hidden></button>
  </section>
  <section class="tab" id="tab-todo" hidden></section>
  <section class="tab" id="tab-visits" hidden></section>
</main>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-in">
    <button class="close" id="close" aria-label="닫기">×</button>
    <div id="panel-body"></div>
  </div>
</aside>
<div class="dim" id="dim"></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
