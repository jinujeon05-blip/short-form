<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jinwoo 에이전트</title>
<!-- 폰 홈 화면 앱(주소창 없이) · 아이콘 · 시작 화면 (2026-11-27 캡틴 지시) -->
<link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
<meta name="theme-color" content="#F2552C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jinwoo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/static/app-icon/favicon-64.png">
<link rel="apple-touch-icon" href="/static/app-icon/apple-touch-icon.png">
<style>
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
background:radial-gradient(circle at 30% 20%,#FF8A1F 0%,#F2552C 45%,#E0283A 100%);color:#fff;transition:opacity .45s ease,visibility .45s;
font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
#splash img{width:132px;height:132px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.28));animation:sp-pop .7s cubic-bezier(.2,1.4,.4,1) both}
#splash b{font-size:24px;letter-spacing:.5px;animation:sp-up .6s .25s ease both}
#splash small{font-size:13px;opacity:.85;animation:sp-up .6s .4s ease both}
#splash i{display:flex;gap:6px}#splash i span{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.4;animation:sp-dot 1s infinite}
#splash i span:nth-child(2){animation-delay:.15s}#splash i span:nth-child(3){animation-delay:.3s}
#splash.out{opacity:0;visibility:hidden}html.nosplash #splash{display:none}
@keyframes sp-pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sp-up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-dot{50%{opacity:1;transform:translateY(-4px)}}
</style>
<script>
// 시작 화면은 폰(손가락 화면)이나 홈 화면 앱으로 열 때, 한 번 열 때마다 1번만 보여 준다. PC 브라우저에선 안 보임.
(function(){var show=false;try{show=(matchMedia('(display-mode: standalone)').matches||navigator.standalone||matchMedia('(pointer: coarse)').matches)&&!sessionStorage.getItem('splashSeen');sessionStorage.setItem('splashSeen','1')}catch(e){}
if(!show){document.documentElement.className+=' nosplash';return}
var t0=Date.now();function hide(){var s=document.getElementById('splash');if(!s)return;setTimeout(function(){s.classList.add('out');setTimeout(function(){s.remove()},500)},Math.max(0,1300-(Date.now()-t0)))}
addEventListener('load',hide);setTimeout(hide,3500)})();
</script>
<link rel="stylesheet" href="/static/style.css?v=visit1">
<link rel="stylesheet" href="/static/builder.css">
<link rel="stylesheet" href="/static/sales.css">
<link rel="stylesheet" href="/static/office-anime/office-anime.css?v=45">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="/static/app-icon/splash.png" alt=""><b>Jinwoo 에이전트</b><small>AI 팀 사무실 여는 중</small><i><span></span><span></span><span></span></i></div>
<header class="top">
  <div class="brand"><img class="logo-img" src="/static/app-icon/favicon-64.png" alt="Jinwoo 에이전트" width="38" height="38" style="border-radius:11px;flex:none"><div><b>Jinwoo 에이전트</b><small id="updated">불러오는 중…</small></div></div>
  <div class="topr"><div class="counts" id="counts"></div><button type="button" class="btn-bell" id="notify-btn" title="PC · 휴대폰(텔레그램) 알림 설정">🔔 알림</button><details class="qmini" id="quota" aria-label="Claude 사용량"></details></div>
</header>

<div class="layout">
  <!-- 왼쪽: 대화방(지시·팀 대화·결재함) — '새 가게' 줄 세우기 칸은 2026-11-23 없앰(캡틴 '가-1') -->
  <aside class="col left">
    <!-- 대화방 (2026-11-21, 캡틴 '가-1'): 지시하기 + 팀 대화 + 결재함을 카톡 모양 하나로 -->
    <section class="card chat" aria-label="팀 대화방">
      <div class="chat-head"><b>팀 대화방</b><span class="live" id="talk-live"></span>
        <select id="talk-pick" aria-label="볼 지시 고르기"></select></div>
      <p class="send-err" id="code-warn" role="alert"></p>
      <details class="inbox-box" id="inbox-box"><summary>결재함 <span class="badge b-na" id="inbox-count">0</span><small class="muted" id="inbox-sum"></small></summary>
        <div id="inbox"></div></details>
      <div class="chat-bar" id="chat-bar"></div>
      <div class="chat-msgs" id="chat-msgs"></div>
      <small class="muted chat-note" id="talk-note"></small>
      <div class="chat-in">
        <div class="chips" id="chips"></div>
        <textarea id="order-text" rows="2" placeholder="지시를 적고 Enter (줄바꿈은 Shift+Enter) · 예: 바보아저씨 사진 수집기로 올렸어. 가게 찾기용으로 만들어줘"></textarea>
        <div class="when"><select id="order-when" aria-label="언제 실행"><option value="">지금 실행</option><option value="reset">한도 풀리면 실행</option><option value="time">시각 정해서 실행</option></select>
          <input type="datetime-local" id="order-at" hidden><label class="argon" title="메뉴판 읽기를 제미나이 4 Argon으로(정식 가게는 체크 안 해도 자동)"><input type="checkbox" id="order-argon"> Argon 사용</label><small class="muted" id="order-hint"></small></div>
        <div class="cmd-foot">
          <span class="muted" id="order-note">배포·push·삭제는 하지 않고, 끝나면 결재함에 보고가 올라옵니다.</span>
          <button class="btn send" id="order-send">보내기</button>
        </div>
        <p class="send-err" id="order-err" role="alert"></p>
      </div>
    </section>
  </aside>

  <!-- 가운데: 한도 · 사무실 · 탭 -->
  <main class="col center">
    <div class="office-bar">
      <div class="office-sw" role="group" aria-label="사무실 보기 방식">
        <button type="button" id="of-mode-game" class="on">✨ 애니 사무실</button>
        <button type="button" id="of-mode-photo">🖼 사진 사무실</button>
      </div>
      <div class="office-acts" id="of-game-acts">
        <button type="button" id="of-game-brief" title="전 직원 단상 앞 정렬 후 전일 업무 보고">📋 보고해</button>
        <button type="button" id="of-game-coffee" title="운영 감찰관이 캡틴에게 커피 서빙">☕ 커피 서빙</button>
        <button type="button" id="of-game-dance" title="운영 감찰관·자료 해석 비서 합동 아이돌 댄스!">💃 댄스</button>
        <button type="button" id="of-game-stroll" title="대기 중인 직원 커피 휴식 이동">🚶 휴식 이동</button>
        <a href="/static/office-anime/index.html" target="_blank" rel="noopener" title="별도 창에서 크게 보기">↗ 크게 보기</a>
      </div>
    </div>
    <section class="office office-game-wrap" id="office-game" aria-label="12프레임 고화질 애니 사무실"></section>
    <section class="office" id="office" aria-label="사진 사무실" hidden></section>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="stores" class="on">가게 현황</button>
      <button role="tab" data-tab="todo">할 일</button>
      <button role="tab" data-tab="visits">방문 기록</button>
      <button role="tab" data-tab="usage">사용량</button>
      <button role="tab" data-tab="builder">가게 만들기</button>
      <button role="tab" data-tab="sales">영업</button>
    </nav>
    <section class="tab" id="tab-stores">
      <div class="filters">
        <input id="q" type="search" placeholder="가게 이름 찾기">
        <div class="seg" id="kind">
          <button data-k="" class="on">전체</button><button data-k="full">정식</button><button data-k="listing">가게 찾기용</button>
        </div>
      </div>
      <div class="cards" id="stores"></div>
      <button class="btn ghost more" id="more" hidden></button>
    </section>
    <section class="tab" id="tab-todo" hidden></section>
    <section class="tab" id="tab-visits" hidden></section>
    <section class="tab" id="tab-usage" hidden><p class="muted">사용량 탭을 누르면 실행 기록에서 계산해요.</p></section>
    <section class="tab" id="tab-builder" hidden><p class="muted">가게 만들기 화면을 여는 중…</p></section>
    <section class="tab" id="tab-sales" hidden><p class="muted">영업 화면을 여는 중…</p></section>
  </main>

  <!-- 오른쪽: 브리핑 · 업무 기록 -->
  <aside class="col right">
    <section class="card brief" aria-label="오늘 브리핑">
      <h2>오늘 브리핑 <small id="brief-at"></small></h2>
      <ol id="brief"></ol>
    </section>
    <section class="card" aria-label="업무 기록">
      <h2>업무 기록 <small>커밋 · 지시 · 점검</small></h2>
      <ul class="feed" id="feed"></ul>
    </section>
  </aside>
</div>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-in">
    <button class="close" id="close" aria-label="닫기">×</button>
    <div id="panel-body"></div>
  </div>
</aside>
<div class="dim" id="dim"></div>
<div class="toast" id="toast"></div>
<script src="/static/rooms/new/tiles.js"></script>
<script src="/static/rooms/new/routes.js"></script>
<script src="/static/office-anime/office-anime.js?v=162"></script>
<script src="/static/app.js?v=deploy1"></script>
<script src="/static/builder.js"></script>
<script src="/static/sales.js"></script>
</body>
</html>
