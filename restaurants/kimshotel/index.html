  #menu section { padding-top: 26px; }

  .row { display: flex; align-items: baseline; gap: 8px; }

  .row .leader { flex: 1; min-width: 10px; border-bottom: 1px dotted var(--gold); transform: translateY(-4px); }
  .price { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--navy); }
  .price small { font-size: 11px; color: var(--muted); margin-left: 1px; }

  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--ivory); border: 0; border-radius: 16px; padding: 10px 14px 10px 10px; cursor: pointer; }

  .pill i svg { width: 20px; height: 20px; }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; opacity: .8; }

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  function render(lang) {
    const t = UI[lang], R = window.RESTAURANT;
    const second = lang === "ko" ? "vi" : "ko";
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand.en} ${R.brand.ko} · ${t.title}`;
    const zaloUrl = "https://zalo.me/" + R.zalo, telUrl = "tel:" + R.phone.replace(/[^\d+]/g, "");

    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    $("tagline").textContent = t.tagline;
    $("nav").innerHTML = [`<a href="#rooms">${esc(t.rooms)}</a>`, ...MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`)].join("");

    $("roomsTitle").textContent = t.rooms;
    $("roomsIntro").textContent = t.roomsIntro;
    $("incl").innerHTML = ROOM_INCL.map((x) => `<span>${esc(x[lang])}</span>`).join("");
    $("roomList").innerHTML = ROOMS.map((r) => `
      <article class="room" id="room-${r.id}">
        <img src="${r.photo}" alt="${esc(r.name[lang])}" loading="lazy" width="1200" height="800">
        <div class="body">
          <div class="top"><h3>${esc(r.name[lang])}</h3><span class="guests">${esc(t.guests(r.guests))}</span></div>
          <div class="sub">${esc(r.name[second])}</div>
          <p>${esc(r.desc[lang])}</p>
          <div class="rate"><b>${won(r.price)}</b><span>${esc(t.night)}</span></div>
        </div>
      </article>`).join("");
    $("bookZalo").href = zaloUrl; $("bookZaloT").textContent = t.bookZalo;
    $("bookTel").href = telUrl; $("bookTelT").textContent = t.bookTel;
    $("roomsSmall").textContent = t.roomsSmall;

    $("restTitle").textContent = t.restaurant;
    $("restIntro").textContent = t.restIntro;
    // 장바구니(order.js)는 #menu > section(MENU 순서) > ul > li(items 순서)에 버튼을 붙인다
    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        <h2>${esc(cat.name[lang])}</h2>
        ${cat.photo ? `<img class="banner" src="${cat.photo}" alt="${esc(cat.name[lang])}" loading="lazy">` : ""}
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => `
          <li>
            ${it.tag ? `<div class="tags"><span>${esc(t[it.tag])}</span></div>` : ""}
            <div class="row"><b>${esc(it.name[lang])}</b><span class="leader"></span><span class="price">${won(it.price)}</span></div>
            ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
            <div class="sub">${esc(it.name[second])}</div>
          </li>`).join("")}</ul>
      </section>`).join("");

    $("thanks").innerHTML = t.thanks;
    $("callLabel").textContent = t.call; $("callText").textContent = R.phone; $("call").href = telUrl;
    $("zaloLabel").textContent = t.zalo; $("zaloText").textContent = R.phone; $("zalo").href = zaloUrl;
    $("mapLabel").textContent = t.map; $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.mapQuery + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  // 스크롤 위치에 맞춰 상단 탭 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("#rooms, #menu > section").forEach((s) => observer.observe(s));
  }
</script>
