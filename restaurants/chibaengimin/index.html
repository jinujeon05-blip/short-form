<style>
  :root {
    --paper: #fff7ec;
    --paper-2: #ffe8d2;
    --band: #d4141c;
    --band-2: #a80f16;
    --navy: #1b2a7a;
    --night: #0a0f2e;
    --neon: #7fb2ff;
    --ink: #1e1b24;
    --muted: #6b6470;
    --line: #f1d9c4;
    --rust: #d4141c;
    --gold: #c9962e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단: 밤 간판의 파란 네온 ── */
  header { position: relative; overflow: hidden; text-align: center; padding: 12px 0 28px; color: #fff;
    background: radial-gradient(ellipse at 50% 38%, #1a2a8c 0, #0d1546 45%, var(--night) 100%); border-bottom: 6px solid var(--band); }
  .langs { position: relative; z-index: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #dfe8ff; background: rgba(255,255,255,.08); border: 1px solid rgba(127,178,255,.5); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: #fff; background: var(--band); border-color: var(--band); }
  .logo { display: block; width: 132px; height: auto; margin: 26px auto 0; }
  .logo.sign { width: 100%; max-width: 440px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; margin-top: 18px; box-shadow: 0 0 22px rgba(80,130,255,.55); }
  h1 { margin: 14px 0 0; font-size: 38px; font-weight: 800; letter-spacing: 2px; line-height: 1.1; color: #fff; text-shadow: 0 0 6px #6aa2ff, 0 0 18px #3a6cff; }
  h1 span { color: #ff6f86; text-shadow: 0 0 6px #ff3d63, 0 0 14px #d4141c; }
  .en { margin: 8px 0 0; font-size: 14px; font-weight: 700; letter-spacing: 3px; color: var(--neon); }
  .tagline { margin: 12px 0 0; font-size: 14.5px; font-weight: 600; color: #dbe4ff; }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; position: relative; z-index: 1; }
  .chips span { font-size: 12.5px; font-weight: 700; color: #fff; background: rgba(212,20,28,.9); border-radius: 999px; padding: 4px 11px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: var(--band); box-shadow: 0 4px 12px rgba(120,10,16,.3); }
  nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 7px; padding-bottom: 7px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: #ffe9e0; text-decoration: none; font-size: 14px; font-weight: 800; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  nav a.active { color: var(--band-2); background: #fff; }

  /* ── 메뉴 ── */
  section { padding: 30px 0 6px; }
  .head { display: flex; align-items: flex-end; gap: 12px; }
  .head::after { content: ""; flex: 1; height: 5px; margin-bottom: 6px; background: var(--band); border-radius: 3px; }
  h2 { margin: 0; font-size: 27px; font-weight: 900; letter-spacing: 0; text-align: left; line-height: 1.1; }
  h2 small { display: block; margin-top: 4px; font-size: 13px; font-weight: 800; letter-spacing: .3px; color: var(--band); }
  .note { margin: 12px 0 0; font-size: 13.5px; color: var(--navy); background: var(--paper-2); border-left: 4px solid var(--navy); border-radius: 0 8px 8px 0; padding: 8px 12px; }
  .tip { margin: 14px 0 0; font-size: 13.5px; color: var(--ink); background: #fff; border: 1px dashed #e0a58f; border-radius: 12px; padding: 10px 12px; }
  .tip b { color: var(--rust); margin-right: 4px; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .thumb { position: relative; flex: none; width: 96px; height: 72px; border-radius: 4px; overflow: hidden; padding: 0; border: 2px solid var(--band); background: var(--paper); cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .cnt { position: absolute; right: 0; bottom: 0; min-width: 18px; padding: 0 5px; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; color: #fff; background: rgba(10,15,46,.78); border-radius: 6px 0 0 0; }

  .tags span { font-size: 10.5px; font-weight: 800; letter-spacing: .3px; color: #fff; background: var(--rust); border-radius: 3px; padding: 1px 6px; }
  .tags .best { background: var(--navy); }
  .tags .special { background: var(--gold); }
  .tags .hot { background: #fff; color: #c2191f; border: 1px solid #f0a8a8; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 17px; font-weight: 800; }
  .row .unit { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .row .leader { flex: 1; min-width: 10px; border-bottom: 2px dotted #e0b9a4; transform: translateY(-4px); }
  .price { font-size: 16px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price small, .sizes span small { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 3px; font-size: 10px; font-weight: 800; line-height: 1; color: #fff; background: var(--navy); border-radius: 50%; vertical-align: 1px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .sizes span { font-size: 14px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--band); border-radius: 4px; padding: 0 4px; margin-right: 5px; }
  .desc { margin-top: 4px; font-size: 13px; color: #5a5058; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .sub.it { font-style: italic; }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: var(--night); border-top: 6px solid var(--band); color: #e6ecff; padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); }
  .quote { text-align: center; font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .quote small { display: block; margin-top: 4px; font-size: 12.5px; color: var(--neon); }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--paper); border: 0; border-radius: 14px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--band); }
  .pill i svg { width: 20px; height: 20px; color: #fff; }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--rust); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; color: #aab6e6; }

  .zoom { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(10,15,46,.92); cursor: zoom-out; }
  .zoom.show { display: grid; }
  .zoom figure { position: relative; margin: 0; max-width: 560px; width: 100%; }
  .zoom img { width: 100%; border-radius: 12px; display: block; background: var(--paper); }
  .zoom figcaption { margin-top: 10px; text-align: center; font-size: 16px; font-weight: 800; color: #fff; }
  .zoom .nv { position: absolute; top: calc(50% - 44px); width: 38px; height: 54px; padding: 0; font: inherit; font-size: 32px; line-height: 50px; color: #fff; background: rgba(10,15,46,.6); border: 0; cursor: pointer; }
  .zoom .nv.prev { left: 0; border-radius: 0 10px 10px 0; }
  .zoom .nv.next { right: 0; border-radius: 10px 0 0 10px; }
  .zoom .pos { display: block; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--neon); text-align: center; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--band-2); color: #fff; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {

      if (SUPPORTED.includes(code)) return code;

              ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
              <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(typeof it.unit === "string" ? it.unit : (it.unit[lang] || it.unit.en))}</span>` : ""}${single}</div>

              ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}

  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  let zList = [], zIdx = 0;
  function zShow() {
    $("zoomImg").src = zList[zIdx];
    const many = zList.length > 1;
    $("zoomPrev").hidden = $("zoomNext").hidden = $("zoomPos").hidden = !many;
    if (many) $("zoomPos").textContent = (zIdx + 1) + "/" + zList.length;
  }
  function zGo(n) { if (zList.length < 2) return; zIdx = (zIdx + n + zList.length) % zList.length; zShow(); }
  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (!b) return;
    try { zList = JSON.parse(b.dataset.photos); } catch { zList = [b.dataset.photo]; }
    zIdx = Math.max(0, zList.indexOf(b.dataset.photo));
    $("zoomCap").textContent = b.dataset.cap;
    zShow();
    $("zoom").classList.add("show");
  });
  $("zoom").addEventListener("click", (e) => {
    if (e.target.closest("#zoomPrev")) { e.stopPropagation(); zGo(-1); return; }
    if (e.target.closest("#zoomNext")) { e.stopPropagation(); zGo(1); return; }
    $("zoom").classList.remove("show");
  });
  let tx = null;
  $("zoom").addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
  $("zoom").addEventListener("touchend", (e) => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) { zGo(dx < 0 ? 1 : -1); zSwiped = true; setTimeout(() => { zSwiped = false; }, 400); }
  });
  let zSwiped = false;
  $("zoom").addEventListener("click", (e) => { if (zSwiped) e.stopImmediatePropagation(); }, true);
  document.addEventListener("keydown", (e) => {
    if (!$("zoom").classList.contains("show")) return;
    if (e.key === "ArrowLeft") zGo(-1); else if (e.key === "ArrowRight") zGo(1); else if (e.key === "Escape") $("zoom").classList.remove("show");
  });

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
