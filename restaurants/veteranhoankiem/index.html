<meta name="description" content="베테랑 호안끼엠 VETERAN Korean BBQ · 프리미엄 소고기·와규·달랏 돼지고기 숯불구이 · 하노이 호안끼엠 · 11:00–23:00">
<style>
  :root {
    --paper: #161514;
    --paper-2: #232120;
    --band: #0d0c0c;
    --band-2: #c9a45c;
    --ink: #f1ece3;
    --muted: #a39a8c;
    --line: #34312e;
    --rust: #8e2a3a;
    --gold: #c9a45c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단: 검은 간판 + 흰 라이트박스 글자 ── */
  header { position: relative; overflow: hidden; text-align: center; padding: 12px 0 30px; background: linear-gradient(#0d0c0c, #161514 70%); }
  .corner { display: none; }
  .langs { position: relative; z-index: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #d8d0c2; background: transparent; border: 1px solid #4a4540; border-radius: 3px; padding: 5px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: #111; background: var(--gold); border-color: var(--gold); }
  .logo { display: block; width: 132px; height: auto; margin: 26px auto 0; }
  .logo.sign { width: 100%; max-width: 440px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 2px; margin-top: 18px; border: 1px solid #3a3733; }
  h1 { margin: 16px 0 0; font-size: 34px; font-weight: 300; letter-spacing: 8px; line-height: 1; color: #fff; }
  .en { margin: 10px 0 0; font-size: 15px; font-weight: 400; letter-spacing: 6px; color: var(--gold); }
  .en::after { content: ""; display: block; width: 36px; height: 1px; background: var(--gold); margin: 12px auto 0; opacity: .7; }
  .tagline { margin: 12px 0 0; font-size: 14px; font-weight: 400; letter-spacing: .5px; color: var(--muted); }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; position: relative; z-index: 1; }
  .chips span { font-size: 12.5px; font-weight: 600; color: #e6d3a8; background: transparent; border: 1px solid #5a4b2e; border-radius: 2px; padding: 4px 11px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: #0d0c0c; border-bottom: 1px solid #3a3733; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 7px; padding-bottom: 7px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: #b9b0a1; text-decoration: none; font-size: 13.5px; font-weight: 600; letter-spacing: .3px; padding: 8px 11px; border-radius: 2px; white-space: nowrap; border-bottom: 2px solid transparent; }
  nav a.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ── 메뉴 ── */
  section { padding: 30px 0 6px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head::before, .head::after { content: ""; flex: 1; height: 1px; background: #4a4236; }
  h2 { margin: 0; font-size: 22px; font-weight: 300; letter-spacing: 4px; text-align: center; color: #fff; }
  h2 small { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 400; letter-spacing: 1px; color: var(--gold); }
  .note { margin: 12px 0 0; font-size: 13.5px; color: #d8cdb6; background: var(--paper-2); border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); border-radius: 0; padding: 8px 12px; }
  .tip { margin: 14px 0 0; font-size: 13.5px; color: var(--ink); background: var(--paper-2); border: 1px solid #4a4236; border-radius: 2px; padding: 10px 12px; }
  .tip b { color: var(--gold); margin-right: 4px; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .thumb { flex: none; width: 96px; height: 72px; border-radius: 2px; overflow: hidden; padding: 0; border: 1px solid #3f3b36; background: var(--paper-2); cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .info { flex: 1; min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 3px; }
  .tags span { font-size: 10.5px; font-weight: 700; letter-spacing: .6px; color: #fff; background: var(--rust); border-radius: 2px; padding: 1px 6px; }
  .tags .best { background: #3b3631; color: var(--gold); border: 1px solid #5a4b2e; }
  .tags .special { background: var(--gold); color: #111; }
  .tags .hot { background: transparent; color: #ff8a73; border: 1px solid #7a3a30; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 16.5px; font-weight: 600; color: #fff; letter-spacing: .2px; }
  .row .unit { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .row .leader { flex: 1; min-width: 10px; border-bottom: 1px dotted #6a6155; transform: translateY(-4px); }
  .price { font-size: 16px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price small { font-size: 11px; color: var(--muted); margin-left: 1px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .sizes span { font-size: 14px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; background: transparent; border: 1px solid #4a4236; border-radius: 2px; padding: 2px 8px; }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 700; color: #111; background: var(--gold); border-radius: 2px; padding: 0 4px; margin-right: 5px; }
  .desc { margin-top: 4px; font-size: 13px; color: #b9b0a1; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .sub.it { font-style: italic; }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: #0d0c0c; border-top: 1px solid #3a3733; color: #e4ddd0; padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); }
  .quote { text-align: center; font-size: 15px; line-height: 1.7; margin: 0 0 18px; letter-spacing: .3px; }
  .quote small { display: block; margin-top: 4px; font-size: 12.5px; color: var(--gold); letter-spacing: 2px; }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--paper-2); border: 1px solid #3a3733; border-radius: 3px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 2px; display: grid; place-items: center; background: var(--rust); }
  .pill i svg { width: 20px; height: 20px; color: #fff; }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .pill strong { display: block; font-size: 16px; font-weight: 600; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--gold); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; color: var(--muted); }

  .zoom { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(0,0,0,.9); cursor: zoom-out; }
  .zoom.show { display: grid; }
  .zoom figure { margin: 0; max-width: 560px; width: 100%; }
  .zoom img { width: 100%; border-radius: 3px; display: block; background: var(--paper); }
  .zoom figcaption { margin-top: 10px; text-align: center; font-size: 16px; font-weight: 600; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--gold); color: #111; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 3px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    $("tagline").textContent = t.tagline;
    $("chips").innerHTML = t.chips.map((c) => `<span>${esc(c)}</span>`).join("");
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        <div class="head"><h2>${esc(cat.name[lang])}${lang !== "vi" ? `<small>${esc(cat.name.vi)}</small>` : `<small>${esc(cat.name.ko)}</small>`}</h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => {
          const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
          const single = it.sizes ? "" : `<span class="leader"></span><span class="price">${it.price == null ? esc(t.market) : `${fmt(it.price)}<small>₫</small>`}</span>`;
          return `
          <li>
            ${it.photo ? `<button class="thumb" type="button" data-photo="${it.photo}" data-cap="${esc(it.name[lang])}"><img src="${it.photo}" alt="${esc(it.name[lang])}" loading="lazy"></button>` : ""}
            <div class="info">
              ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
              <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(it.unit)}</span>` : ""}${single}</div>
              ${priceHtml(it, t)}
              ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
              <div class="sub ${second === "vi" ? "it" : ""}">${esc(it.name[second])}</div>
            </div>
          </li>`; }).join("")}
        </ul>
        ${cat.tip ? `<p class="tip"><b>${esc(t.tip)}</b>${esc(cat.tip[lang])}</p>` : ""}
      </section>`).join("");

    $("quote").innerHTML = t.quote;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = `Wi-Fi · ${R.wifi.ssid}`;
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    if (R.hours) {
      $("hours").hidden = false;
      $("hoursLabel").textContent = t.hours;
      $("hoursText").textContent = typeof R.hours === "string" ? R.hours : R.hours[lang];
    }
    $("callLabel").textContent = t.call;
    $("callText").textContent = R.phone;
    $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.brand.en + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (!b) return;
    $("zoomImg").src = b.dataset.photo;
    $("zoomCap").textContent = b.dataset.cap;
    $("zoom").classList.add("show");
  });
  $("zoom").addEventListener("click", () => $("zoom").classList.remove("show"));

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
