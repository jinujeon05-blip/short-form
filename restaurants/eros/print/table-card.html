<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EROS · QR 카드</title>
<style>
  @font-face { font-family: "Gmarket"; src: url("../../../public/fonts/GmarketSansTTFBold.ttf"); }
  @page { size: 105mm 148mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --paper: #0b0806; --ink: #f3e9d8; --muted: #a8977f; --gold: #d9a74a; --gold-hi: #f6d58e; --gold-lo: #8a6326; --line: rgba(217,167,74,.4); }
  html, body { background: #fff; }
  body { font-family: "Gmarket", "Inter", "WenQuanYi Zen Hei", sans-serif; color: var(--ink); }
  .card { position: relative; width: 105mm; height: 148mm; overflow: hidden; display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(ellipse at 50% 18%, #2a1d10 0%, var(--paper) 62%); }
  .card::before { content: ""; position: absolute; inset: 3mm; border: .35mm solid var(--line); border-radius: 2mm; pointer-events: none; }
  .card > * { position: relative; z-index: 1; }
  .top { margin-top: 8mm; width: 84mm; height: 26mm; overflow: hidden; mix-blend-mode: screen; }
  .top img { width: 100%; height: auto; display: block; }
  .sub { margin-top: 1mm; font-family: "Inter", sans-serif; font-weight: 600; font-size: 2.8mm; letter-spacing: 1.6mm; color: var(--gold); }
  .rule { margin-top: 2.2mm; display: flex; align-items: center; gap: 2mm; color: var(--gold); font-size: 2.6mm; }
  .rule::before, .rule::after { content: ""; width: 22mm; height: .3mm; background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule::after { transform: scaleX(-1); }
  .qr-box { margin-top: 5mm; background: #fff; border-radius: 3mm; padding: 2mm; box-shadow: 0 0 0 .7mm var(--gold), 0 1.5mm 5mm rgba(0,0,0,.6); }
  .qr-box img { display: block; width: 46mm; height: 46mm; }
  .badge { font-family: "Inter", sans-serif; font-weight: 800; position: absolute; right: -6mm; top: -3mm; transform: rotate(8deg); background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1a1209; font-size: 2.5mm; padding: .9mm 2mm .7mm; border-radius: 99mm; }
  h1 { margin-top: 5mm; font-family: "Inter", sans-serif; font-weight: 900; font-size: 5.2mm; letter-spacing: .2mm; text-align: center; line-height: 1.15; }
  h1 span { color: var(--gold-hi); }
  .h1-en { margin-top: 1mm; font-family: "Inter", sans-serif; font-weight: 800; font-size: 3.5mm; letter-spacing: .5mm; text-align: center; }
  .h1-en span { color: var(--gold-hi); }
  .langs { display: flex; flex-wrap: wrap; justify-content: center; gap: .5mm 3.5mm; margin-top: 1.6mm; font-family: "Inter", "WenQuanYi Zen Hei", sans-serif; font-weight: 600; font-size: 2.6mm; color: var(--muted); }
  .langs em { font-style: normal; display: inline-block; width: 4.6mm; font-size: 1.9mm; font-weight: 800; color: var(--gold); }
  .ko { font-family: "Gmarket"; font-weight: 400; }
  .ja { font-family: "IPAGothic", sans-serif; }
  .card > footer { position: absolute; left: 3mm; right: 3mm; bottom: 3mm; height: 13mm; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .9mm;
    border-top: .35mm solid var(--line); background: rgba(217,167,74,.08); border-radius: 0 0 2mm 2mm; }
  footer .url { font-family: "Inter", sans-serif; font-weight: 800; font-size: 3.4mm; letter-spacing: .2mm; color: var(--gold-hi); }
  footer .addr { font-family: "Inter", sans-serif; font-weight: 600; font-size: 2.4mm; color: var(--ink); }
  /* 테이블 번호 자리(admin 인쇄 때 번호가 채워짐, 단독 인쇄 땐 숨김) */
  .tno { position: absolute; right: calc(100% - 3mm); top: -6mm; z-index: 3; min-width: 12mm; height: 12mm; padding: 0 1.8mm; box-sizing: border-box; border-radius: 99mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--gold); color: #1a1209; box-shadow: 0 0 0 .8mm var(--paper);
    font-family: system-ui, "Segoe UI", sans-serif; font-weight: 800; font-size: 6.5mm; line-height: .95; }
  .tno::before { content: "BÀN"; font-size: 1.8mm; letter-spacing: .2mm; line-height: 1; margin-bottom: .3mm; opacity: .9; }
  .tno:empty { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><img src="../img/logo.jpg" alt="EROS"></div>
  <div class="sub">BAR · BẮC NINH</div>
  <div class="rule">✦</div>
  <div class="qr-box">
    <img src="qr.svg" alt="QR https://eros.qrmenuasia.com">
    <div class="tno" data-table></div>
    <span class="badge">5 ngôn ngữ</span>
  </div>
  <h1>QUÉT MÃ <span>XEM THỰC ĐƠN</span></h1>
  <div class="h1-en">SCAN QR <span>FOR MENU</span></div>
  <div class="langs">
    <div><em>KO</em><span class="ko">QR 찍고 메뉴 보기</span></div>
    <div><em>ZH</em>扫码看菜单</div>
    <div><em>JA</em><span class="ja">メニューを見る</span></div>
  </div>
  <footer>
    <div class="url">eros.qrmenuasia.com</div>
    <div class="addr">300 Ngọc Hân Công Chúa, Võ Cường, Bắc Ninh</div>
  </footer>
</div>
</body>
</html>
