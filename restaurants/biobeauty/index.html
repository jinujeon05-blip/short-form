  const fmt = (n) => n.toLocaleString("en-US");
  const ITEMS = new Map(MENU.flatMap((c) => c.items.map((it) => [it.id, { ...it, cat: c }])));
  let lang, observer;

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  const cart = new Map(storage((s) => JSON.parse(s.getItem("bb-cart-v1") || "[]")) || []);
  for (const k of [...cart.keys()]) if (!ITEMS.has(k)) cart.delete(k);
  const saveCart = () => storage((s) => s.setItem("bb-cart-v1", JSON.stringify([...cart])));

  function pic(it, cat) {
    if (it.photo) return `<img src="${it.photo}" alt="" loading="lazy">`;
    if (cat.id === "centecassol") return `<span class="tube" style="--c:${it.color}"></span>`;
    return `<span class="jar" style="--c:${it.color}">OGAMIX</span>`;
  }

  function moreHtml(id, t) {
    const d = (window.INFO || {})[id];
    if (!d) return "";
    return `<details class="more"><summary>${esc(t.more)}</summary>
      <h4>${esc(t.good)}</h4><ul class="good">${d.good[lang].map((g) => `<li>${esc(g)}</li>`).join("")}</ul>
      <h4>${esc(t.how)}</h4><p>${esc(d.how[lang])}</p>
      ${d.test ? `<div class="test">🧪 ${esc(t.test)}: ${esc(d.test[lang])}</div>` : ""}
    </details>`;
  }

  function render() {
    const t = UI[lang];
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${t.title} · ${MENU.map((c) => c.brand).join(" · ")}`;
    $("langs").innerHTML = LANGS.map(([c, l]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${l}</button>`).join("");
    $("title").textContent = t.title;
    $("tagline").textContent = t.tagline;
    $("seals").innerHTML = MENU.map((c) => `<a class="seal" href="#${c.id}"><span><small>${c.brand}</small><b>${c.off}%</b><i>${esc(t.sale)} ${esc(t.off)}</i></span></a>`).join("");
    $("nav").innerHTML = MENU.map((c) => `<a href="#${c.id}">${c.brand}<span>-${c.off}%</span></a>`).join("");
    const second = lang === "ko" ? "vi" : "ko";
    $("menu").innerHTML = MENU.map((c) => `
      <section id="${c.id}">
        <div class="hero"><img src="${c.photo}" alt="${esc(c.name[lang])}"><span class="off">-${c.off}%</span></div>
        <div class="head"><div class="brand">${c.brand}</div><h2>${esc(c.name[lang])}</h2><p class="about">${esc(c.about[lang])}</p></div>
        <ul>${c.items.map((it) => `
          <li class="${it.hot ? "hot" : ""}">
            <div class="pic">${pic(it, c)}</div>
            <div class="info">
              <div class="name">${esc(it.name[lang])}${it.hot ? `<span class="badge">SET</span>` : ""}</div>
              <div class="sub">${esc(it.name[second])}</div>
              <div class="desc">${esc(it.desc[lang])}</div>
              <div class="buy">
                <div class="price"><s>${fmt(it.was)}₫</s><b>${fmt(it.price)}<small>₫</small></b><em>-${Math.round((1 - it.price / it.was) * 100)}%</em></div>
                <div class="qty" data-k="${it.id}"></div>
              </div>
            </div>
            ${moreHtml(it.id, t)}
          </li>`).join("")}
        </ul>
      </section>`).join("");

    $("cTitle").textContent = t.cTitle;
    $("cLead").textContent = t.cLead;
    $("people").innerHTML = R.contacts.map((p) => `
      <div class="person">
        <div class="who">${esc(t.who[p.lang] || "")}</div>
        <div class="num">${esc(p.tel)}</div>
        <div class="btns">
          <a class="b-call" href="tel:${p.tel.replace(/\D/g, "")}">☎ ${esc(t.call)}</a>
          <a class="b-zalo" href="https://zalo.me/${p.zalo}" target="_blank" rel="noopener">Zalo</a>
          ${p.kakao ? `<button type="button" class="b-kakao" data-kakao="${esc(p.kakao)}">${esc(t.kakao)} ${esc(p.kakao)}</button>` : ""}
        </div>
      </div>`).join("");
    $("foot").textContent = t.foot;

    $("fName").placeholder = t.name; $("fPhone").placeholder = t.phone; $("fAddr").placeholder = t.addr;
    $("sTitle").textContent = t.sheet; $("sSub").textContent = t.sub; $("sPick").textContent = t.pick; $("clearCart").textContent = t.clear;
    $("send").innerHTML = R.contacts.map((p, i) => `<button type="button" data-i="${i}"><i>Zalo</i>${esc(t.send(p.tel))} · ${esc(t.who[p.lang] || "")}</button>`).join("");
    updateCart();
    observeSections();
  }

  function updateCart() {
    const t = UI[lang];
    document.querySelectorAll(".qty").forEach((q) => {
      const n = cart.get(q.dataset.k) || 0;
      q.innerHTML = n ? `<button type="button" class="sub1" data-dec="${q.dataset.k}">−</button><b>${n}</b><button type="button" class="add" data-inc="${q.dataset.k}">+</button>`
        : `<button type="button" class="add" data-inc="${q.dataset.k}" aria-label="${esc(t.add)}">+</button>`;
    });
    const n = [...cart.values()].reduce((a, b) => a + b, 0);
    const sum = [...cart].reduce((a, [k, q]) => a + ITEMS.get(k).price * q, 0);
    const was = [...cart].reduce((a, [k, q]) => a + ITEMS.get(k).was * q, 0);
    $("cartbar").hidden = n === 0;
    document.body.classList.toggle("has-cart", n > 0);
    $("cartCount").textContent = n;
    $("cartTotal").textContent = fmt(sum) + "₫";
    $("cartCta").textContent = t.view + " ›";
    $("lines").innerHTML = [...cart].map(([k, q]) => { const it = ITEMS.get(k); return `<div class="line"><span class="n">${esc(it.name[lang])}</span><span>× ${q}</span><span class="p">${fmt(it.price * q)}₫</span></div>`; }).join("");
    $("sTotal").textContent = fmt(sum) + "₫";
    $("sWas").textContent = was ? fmt(was) + "₫" : "";
    if (!n) $("sheet").hidden = true;
    saveCart();
  }

  function orderText() {
    const t = UI[lang];
    const lines = [...cart].map(([k, q]) => { const it = ITEMS.get(k); return `• ${it.name[lang]}${lang !== "ko" ? ` (${it.name.ko})` : ""} × ${q} = ${fmt(it.price * q)}₫`; });
    const sum = [...cart].reduce((a, [k, q]) => a + ITEMS.get(k).price * q, 0);
    return [t.order, ...lines, `${t.total}: ${fmt(sum)}₫`,
      $("fName").value && `${t.name}: ${$("fName").value}`, $("fPhone").value && `${t.phone}: ${$("fPhone").value}`, $("fAddr").value && `${t.addr}: ${$("fAddr").value}`]
      .filter(Boolean).join("\n");
  }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  document.addEventListener("click", async (e) => {
    const inc = e.target.closest("[data-inc]")?.dataset.inc, dec = e.target.closest("[data-dec]")?.dataset.dec;
    if (inc) { cart.set(inc, (cart.get(inc) || 0) + 1); updateCart(); return; }
    if (dec) { const q = cart.get(dec) - 1; q > 0 ? cart.set(dec, q) : cart.delete(dec); updateCart(); return; }
    const kk = e.target.closest("[data-kakao]")?.dataset.kakao;
    if (kk) { try { await navigator.clipboard.writeText(kk); } catch {} toast(`KakaoTalk ID: ${kk} ✓`); return; }
    const si = e.target.closest("#send button")?.dataset.i;
    if (si != null) {
      const p = R.contacts[si];
      try { await navigator.clipboard.writeText(orderText()); toast(UI[lang].copied); } catch { toast(orderText()); }
      storage((s) => { s.setItem("bb-name", $("fName").value); s.setItem("bb-phone", $("fPhone").value); s.setItem("bb-addr", $("fAddr").value); });
      setTimeout(() => { location.href = "https://zalo.me/" + p.zalo; }, 800);
    }
  });
  $("openCart").addEventListener("click", () => { $("sheet").hidden = false; });
  $("closeSheet").addEventListener("click", () => { $("sheet").hidden = true; });
  $("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("sheet").hidden = true; });
  $("clearCart").addEventListener("click", () => { cart.clear(); updateCart(); });
  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c; storage((s) => s.setItem("menu-lang", c)); render();
  });

  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const en of entries) if (en.isIntersecting)
        document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
    }, { rootMargin: "-70px 0px -60% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }

  lang = detectLang();
  for (const [id, key] of [["fName", "bb-name"], ["fPhone", "bb-phone"], ["fAddr", "bb-addr"]]) $(id).value = storage((s) => s.getItem(key)) || "";
  render();
</script>
<script src="dasan.js"></script>
</body>
</html>
