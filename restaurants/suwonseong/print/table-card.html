<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수원성 SUWONSUNG · QR 카드</title>
<style>
  @font-face { font-family: "Jalnan"; src: url("../../../public/fonts/Jalnan2.ttf"); }
  @font-face { font-family: "Gmarket"; src: url("../../../public/fonts/GmarketSansTTFBold.ttf"); }
  @page { size: 105mm 148mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --paper: #f6f1e8; --brick: #6e241c; --brick-2: #8a3226; --ink: #2a2421; --muted: #7a6e62; --gold: #e6c88a; }
  html, body { background: #fff; }
  body { font-family: "Gmarket", "Inter", "WenQuanYi Zen Hei", sans-serif; color: var(--ink); }
  .card { position: relative; width: 105mm; height: 148mm; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; align-items: center; }
  /* 위쪽 벽돌색 띠 + 성가퀴 */
  .top { position: absolute; left: 0; right: 0; top: 0; height: 37mm; background: linear-gradient(180deg, var(--brick-2), var(--brick)); }
  .top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.2mm; height: 5mm;
    background: linear-gradient(90deg, var(--paper) 0 50%, transparent 50% 100%) 0 0 / 8mm 100% repeat-x,
                linear-gradient(var(--paper), var(--paper)) 0 100% / 100% 2mm no-repeat; }
  .card > *:not(.top) { position: relative; z-index: 1; }
  .gate { width: 13mm; margin-top: 5mm; }
  .name { margin-top: 1mm; font-family: "Jalnan"; font-size: 10mm; letter-spacing: 1.6mm; line-height: 1; color: #fff; padding-left: 1.6mm; }
  .en { margin-top: 1.4mm; font-family: "Inter", sans-serif; font-weight: 800; font-size: 3mm; letter-spacing: 1.6mm; color: var(--gold); padding-left: 1.6mm; }
  .tag { margin-top: 7mm; font-family: "Inter", sans-serif; font-weight: 700; font-size: 2.8mm; color: var(--brick); }
  .photos { display: flex; gap: 2mm; margin-top: 3mm; }
  .photos img { width: 15mm; height: 15mm; border-radius: 50%; object-fit: cover; background: #fff; border: .5mm solid #fff; box-shadow: 0 .8mm 2mm rgba(42,36,33,.25); }
  .qr-box { position: relative; margin-top: 4.6mm; background: #fff; border-radius: 3mm; padding: 2mm; box-shadow: 0 0 0 .7mm var(--brick), 0 1.5mm 4mm rgba(42,36,33,.22); }
  .qr-box img { display: block; width: 40mm; height: 40mm; }
  .badge { font-family: "Inter", sans-serif; font-weight: 800; position: absolute; right: -6mm; top: -3mm; transform: rotate(8deg); background: #b8893d; color: #fff; font-size: 2.5mm; padding: .9mm 2mm .7mm; border-radius: 99mm; }
  h1 { margin-top: 4.4mm; font-family: "Inter", sans-serif; font-weight: 900; font-size: 5.2mm; letter-spacing: .2mm; text-align: center; line-height: 1.15; }
  h1 span { color: var(--brick); }
  .h1-en { margin-top: 1mm; font-family: "Inter", sans-serif; font-weight: 800; font-size: 3.4mm; letter-spacing: .45mm; color: inherit; text-align: center; }
  .h1-en span { color: var(--brick); }
  .langs { display: flex; flex-wrap: wrap; justify-content: center; gap: .5mm 3.5mm; margin-top: 2mm; font-family: "Inter", "WenQuanYi Zen Hei", sans-serif; font-weight: 600; font-size: 2.6mm; color: var(--muted); }
  .langs em { font-style: normal; display: inline-block; width: 4.6mm; font-size: 1.9mm; font-weight: 800; color: var(--brick); }
  .ko { font-family: "Gmarket"; font-weight: 400; }
  .ja { font-family: "IPAGothic", sans-serif; }
  .card > footer { position: absolute !important; left: 0; right: 0; bottom: 0; height: 14mm; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .9mm; background: var(--brick); color: #f6f1e8; }
  footer .tel { font-size: 3.6mm; letter-spacing: .2mm; }
  footer .addr { font-family: "Inter", sans-serif; font-weight: 600; font-size: 2.4mm; }
</style>
</head>
<body>
<div class="card">
  <div class="top"></div>
  <svg class="gate" viewBox="0 0 120 80" aria-hidden="true">
    <path d="M8 34 L60 12 L112 34 Z" fill="#e6c88a"/>
    <rect x="22" y="34" width="76" height="8" fill="#e6c88a" opacity=".8"/>
    <path d="M14 46 h92 v30 H14 z" fill="none" stroke="#e6c88a" stroke-width="3"/>
    <path d="M48 76 v-14 a12 12 0 0 1 24 0 v14" fill="#e6c88a"/>
    <path d="M14 46 v-4 h8 v4 M30 46 v-4 h8 v4 M46 46 v-4 h8 v4 M66 46 v-4 h8 v4 M82 46 v-4 h8 v4 M98 46 v-4 h8 v4" fill="#e6c88a"/>
  </svg>
  <div class="name">수원성</div>
  <div class="en">SUWONSUNG</div>
  <div class="tag">Nhà hàng Hàn Quốc · Ciputra</div>
  <div class="photos">
    <img src="img/c-beef.jpg" alt=""><img src="img/c-pork.jpg" alt=""><img src="img/c-eel.jpg" alt=""><img src="img/c-naeng.jpg" alt="">
  </div>
  <div class="qr-box">
    <img src="qr.svg" alt="QR https://suwonseong.qrmenuasia.com">
    <span class="badge">5 ngôn ngữ</span>
  </div>
  <h1>QUÉT MÃ <span>XEM THỰC ĐƠN</span></h1>
  <div class="h1-en">SCAN QR <span>FOR MENU</span></div>
  <div class="langs">
    <div><em>KO</em><span class="ko">QR 찍고 메뉴 보기</span></div>
    <div><em>ZH</em>扫码看菜单</div>
    <div><em>JA</em><span class="ja">メニューを見る</span></div>
  </div>
  <footer>
    <div class="tel">☎ 0346 023 560</div>
    <div class="addr">A21 Sunshine City, KĐT Ciputra, Phú Thượng, Hà Nội</div>
  </footer>
</div>
</body>
</html>
