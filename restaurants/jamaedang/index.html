<meta name="description" content="자매당 JAMAEDANG — 한식 코스 · 통갈치조림 · 홍어 세트 · 전 · 고기 · 탕 · 찜 · Ngõ 176 Đình Thôn, Từ Liêm, Hà Nội">
<style>
  :root {
    --dark: #1a1613;
    --dark-2: #2a231d;
    --paper: #f4ecdc;
    --paper-2: #ebe0c9;
    --card: #fbf6ea;
    --ink: #2b2118;
    --muted: #7a6a55;
    --line: #d9c9a6;
    --gold: #b08d3c;
    --gold-d: #8c6a22;
    --gold-l: #e6c36a;
    --red: #9b2d20;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단: 간판 사진 + 메뉴책 표지의 검정 바탕·금색 글씨 ── */
  header { position: relative; color: #fff; text-align: center; padding: 0 0 34px; background: var(--dark); }
  .hero { position: relative; height: 230px; background: #14110e url(img/hero.jpg) center / cover no-repeat; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,17,14,.55) 0%, rgba(20,17,14,0) 38%, rgba(20,17,14,.55) 80%, var(--dark) 100%); }
  .langs { position: absolute; top: 12px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #f3ece6; background: rgba(20,17,14,.6); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--dark); background: var(--gold-l); border-color: var(--gold-l); }
  .stripe { display: none; }
  .board { position: relative; z-index: 1; margin: -30px auto 0; max-width: 360px; padding: 14px 16px 16px; background: var(--dark); border: 1px solid var(--gold); box-shadow: 0 0 0 4px var(--dark), 0 0 0 5px rgba(176,141,60,.55); }
  .board .band { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 5px; color: var(--gold-l); padding-left: 5px; }
  .board h1 { margin: 6px 0 0; font-size: 44px; font-weight: 900; letter-spacing: 6px; padding-left: 6px; line-height: 1.1; color: var(--gold-l); }
  .en { margin: 14px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #d8c9a4; padding-left: 4px; }
  .branch { display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--dark); background: var(--gold-l); border-radius: 999px; padding: 3px 12px; }
  .tagline { margin: 12px 0 0; font-size: 14.5px; font-weight: 600; color: #f3ece6; }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chips span { font-size: 12.5px; font-weight: 700; color: #f3ece6; border: 1px solid rgba(230,195,106,.6); border-radius: 999px; padding: 4px 11px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: var(--dark); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 7px; padding-bottom: 7px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: #d8c9a4; text-decoration: none; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  nav a.active { color: var(--dark); background: var(--gold-l); }

  /* ── 메뉴 ── */
  section { padding: 30px 0 6px; }
  .head { text-align: center; }
  h2 { margin: 0; display: inline-block; font-size: 26px; font-weight: 900; letter-spacing: 1px; color: var(--ink); padding-bottom: 6px; border-bottom: 3px solid var(--gold); }
  h2 small { display: block; margin-top: 3px; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: var(--gold-d); text-transform: uppercase; }
  .note { margin: 14px 0 0; font-size: 13.5px; color: var(--ink); background: var(--paper-2); border-left: 3px solid var(--gold); border-radius: 0 10px 10px 0; padding: 8px 12px; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .thumb { flex: none; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; padding: 0; border: 2px solid var(--gold); background: var(--paper-2); box-shadow: 0 3px 10px rgba(60,40,10,.25); cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 3px; }
  .tags span { font-size: 10.5px; font-weight: 800; letter-spacing: .3px; color: #fff; background: var(--dark-2); border-radius: 3px; padding: 1px 6px; }
  .tags .best { background: var(--gold-d); }
  .tags .must { background: var(--gold); }
  .tags .new { background: var(--red); }
  .tags .hot { background: transparent; color: var(--red); border: 1px solid #d9a79d; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 17px; font-weight: 800; }
  .row .unit { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .row .leader { flex: 1; min-width: 10px; border-bottom: 2px dotted #c9b88f; transform: translateY(-4px); }
  .price { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--gold-d); }
  .price small { font-size: 11px; color: var(--muted); margin-left: 1px; }
  .price.ask { font-size: 13px; color: var(--muted); }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .sizes span { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold-d); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--dark-2); border-radius: 4px; padding: 0 5px; margin-right: 5px; }
  .desc { margin-top: 4px; font-size: 13px; color: #5a4a38; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .sub.it { font-style: italic; }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: var(--dark); color: #f3ece6; padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); }
  .quote { text-align: center; font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--card); border: 0; border-radius: 16px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--dark-2); }
  .pill i svg { width: 20px; height: 20px; color: var(--gold-l); }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--gold-d); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; opacity: .85; }

  .zoom { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(20,17,14,.92); cursor: zoom-out; }
  .zoom.show { display: grid; }
  .zoom figure { margin: 0; max-width: 520px; width: 100%; }
  .zoom img { width: 100%; border-radius: 18px; display: block; background: var(--paper); }
  .zoom figcaption { margin-top: 10px; text-align: center; font-size: 16px; font-weight: 800; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--dark-2); color: #fff; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<style id="partner-theme">
  /* 하단 파트너 배너(다산)·가게 찾기 링크 색을 이 메뉴판에 맞춘다 */
  :root { --pt-mode: light; --pt-bg: #fbf6ea; --pt-ink: #2b2118; --pt-muted: #7a6a55; --pt-line: #d9c9a6; --pt-accent: #b08d3c; --pt-btn: #1a1613; --pt-btn-ink: #e6c36a; --pt-shadow: 0 6px 16px rgba(60,40,10,.2); }
</style>

<script>
  const LANGS = [["ko", "한국어"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"], ["vi", "Tiếng Việt"]];
  const UI = {
    ko: { title: "메뉴", tagline: "한식 코스 · 통갈치조림 · 홍어 세트 · 전 · 고기", chips: ["영업 10:00~22:00", "일요일 휴무"],
      best: "BEST", new: "신메뉴", must: "추천", spicy: "🌶 매콤", ask: "가격 문의",
      quote: "자매당을 찾아 주셔서 감사합니다.<br>맛있게 드세요!", copy: "복사", copied: "OK",
      call: "전화", map: "주소 · 지도", vnd: "가격 단위: 베트남 동(VND) · VAT 별도 · 메뉴·가격은 가게와 손님이 구글 지도에 올린 메뉴판 기준이며 바뀔 수 있어요" },
    en: { title: "Menu", tagline: "Korean course · Braised whole cutlassfish · Skate set · Pancakes · Meat", chips: ["Open 10:00–22:00", "Closed on Sundays"],
      best: "BEST", new: "NEW", must: "Must try", spicy: "🌶 Spicy", ask: "Ask staff",
      quote: "Thank you for visiting Jamaedang.<br>Enjoy your meal!", copy: "Copy", copied: "OK",
      call: "Call", map: "Address · Map", vnd: "Prices in Vietnamese đồng (VND) · VAT not included · Based on menu photos the restaurant and customers posted on Google Maps; items and prices may change" },
    zh: { title: "菜单", tagline: "韩式套餐 · 红烧整条带鱼 · 发酵鳐鱼套餐 · 煎饼 · 肉类", chips: ["营业 10:00~22:00", "周日休息"],
      best: "BEST", new: "新品", must: "推荐", spicy: "🌶 辣", ask: "价格咨询",
      quote: "感谢您光临자매당。<br>祝您用餐愉快!", copy: "复制", copied: "OK",
      call: "电话", map: "地址 · 地图", vnd: "价格单位:越南盾(VND) · 不含VAT · 菜单和价格以店家和顾客上传到谷歌地图的菜单为准,可能会有变动" },
    ja: { title: "メニュー", tagline: "韓国料理コース · 太刀魚の丸ごと煮付け · ホンオセット · チヂミ · お肉", chips: ["営業 10:00~22:00", "日曜定休"],
      best: "BEST", new: "新メニュー", must: "おすすめ", spicy: "🌶 辛い", ask: "価格はお問い合わせ",
      quote: "자매당にお越しいただきありがとうございます。<br>どうぞ召し上がれ!", copy: "コピー", copied: "OK",
      call: "電話", map: "住所 · 地図", vnd: "価格単位:ベトナムドン(VND) · VAT別 · メニュー・価格は店舗とお客様がGoogleマップに投稿したメニューに基づいており、変更される場合があります" },
    vi: { title: "Thực đơn", tagline: "Set Hàn Quốc · Cá hố kho cay · Set cá đuối · Bánh · Thịt nướng", chips: ["Mở cửa 10:00–22:00", "Nghỉ Chủ nhật"],
      best: "BEST", new: "MỚI", must: "Nên thử", spicy: "🌶 Cay", ask: "Hỏi nhân viên",
      quote: "Cảm ơn quý khách đã đến Jamaedang.<br>Chúc quý khách ngon miệng!", copy: "Sao chép", copied: "OK",
      call: "Gọi điện", map: "Địa chỉ · Bản đồ", vnd: "Giá tính bằng VND · Chưa gồm VAT · Theo ảnh thực đơn nhà hàng và khách đăng trên Google Maps, món và giá có thể thay đổi" },
  };
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const storage = (fn) => { try { return fn(localStorage); } catch { return null; } };
  let observer;

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  const fmt = (n) => n.toLocaleString("en-US");
  const label = (s, lang) => (typeof s === "string" ? s : s[lang] || s.en);

  function render(lang) {
    const t = UI[lang], R = window.RESTAURANT;
    // 아랫줄: 한국어 화면 → 베트남어(직원과 소통용), 그 외 → 한국어
    const second = lang === "ko" ? "vi" : "ko";
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand.ko} · ${t.title}`;

    $("langs").innerHTML = LANGS.map(([c, l]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${l}</button>`).join("");
    $("branch").textContent = `${R.brand.branch.ko} · ${R.brand.branch.en}`;
    $("tagline").textContent = t.tagline;
    $("chips").innerHTML = t.chips.map((c) => `<span>${esc(c)}</span>`).join("");
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        <div class="head"><h2>${esc(cat.name[lang])}<small>${esc(cat.name[lang === "vi" ? "en" : "vi"])}</small></h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => {
          const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
          const single = it.sizes ? "" : `<span class="leader"></span><span class="price ${it.price == null ? "ask" : ""}">${it.price == null ? esc(t.ask) : `${fmt(it.price)}<small>₫</small>`}</span>`;
          const sizes = it.sizes ? `<div class="sizes">${it.sizes.map(([s, p]) => `<span><i>${esc(label(s, lang))}</i>${p == null ? esc(t.ask) : `${fmt(p)}<small>₫</small>`}</span>`).join("")}</div>` : "";
          return `
          <li>
            ${it.photo ? `<button class="thumb" type="button" data-photo="${it.photo}" data-cap="${esc(it.name[lang])}"><img src="${it.photo}" alt="${esc(it.name[lang])}" loading="lazy"></button>` : ""}
            <div class="info">
              ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
              <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(label(it.unit, lang))}</span>` : ""}${single}</div>
              ${sizes}
              ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
              ${it.name[second] !== it.name[lang] ? `<div class="sub ${second === "vi" ? "it" : ""}">${esc(it.name[second])}</div>` : (lang === "ko" && it.desc ? `<div class="sub it">${esc(it.desc.vi)}</div>` : "")}
            </div>
          </li>`; }).join("")}
        </ul>
      </section>`).join("");

    $("quote").innerHTML = t.quote;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = R.wifi.ssid ? `Wi-Fi · ${R.wifi.ssid}` : "Wi-Fi";
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    $("callLabel").textContent = t.call;
    $("callText").textContent = R.phone;
    $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.mapQuery + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (!b) return;
    $("zoomImg").src = b.dataset.photo;
    $("zoomCap").textContent = b.dataset.cap;
    $("zoom").classList.add("show");
  });
  $("zoom").addEventListener("click", () => $("zoom").classList.remove("show"));

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
