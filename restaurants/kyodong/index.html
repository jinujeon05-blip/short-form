,"alternateName":["닭똥집 튀김","Mề gà chiên","炸鸡胗","砂肝の唐揚げ"],"offers":{"@type":"Offer","price":270000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Rice Balls","alternateName":["주먹밥","Cơm nắm","饭团","おにぎり（チュモクパプ）"],"offers":{"@type":"Offer","price":76000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Tteokbokki","alternateName":["떡볶이","炒年糕","トッポッキ"],"offers":{"@type":"Offer","price":162000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Mixed Fried Foods","alternateName":["모듬 튀김","Các loại đồ rán","什锦炸物","揚げ物盛り合わせ"],"offers":{"@type":"Offer","price":270000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Cheese Rolled Omelet","alternateName":["치즈 계란말이","Trứng cuộn phô mai","芝士鸡蛋卷","チーズ入り卵焼き"],"offers":{"@type":"Offer","price":195000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Ramen (black bean / spicy hangover)","alternateName":["라면 (짜파게티 / 해장라면)","Mỳ tôm","拉面（炸酱面／醒酒拉面）","ラーメン（チャパゲティ／ヘジャン）"],"offers":{"@type":"Offer","price":108000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Seafood Pancake","alternateName":["해물전","Bánh hải sản","海鲜煎饼","海鮮チヂミ"],"offers":{"@type":"Offer","price":324000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Grilled Little Pollack","alternateName":["노가리","Cá khô nướng","烤小明太鱼","炙りノガリ（小スケトウダラ）"],"offers":{"@type":"Offer","price":324000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Grilled Dried Pollack","alternateName":["먹태","Cá Đông the","烤明太鱼干","炙りモクテ"],"offers":{"@type":"Offer","price":324000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Semi-dried Squid","alternateName":["반건조 오징어","Mực khô","半干鱿鱼","半干しイカ"],"offers":{"@type":"Offer","price":324000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Yellow Peaches","alternateName":["황도","Đào ngâm","黄桃"],"offers":{"@type":"Offer","price":270000,"priceCurrency":"VND"}}]},{"@type":"MenuSection","name":"Drinks","hasMenuItem":[{"@type":"MenuItem","name":"Chamisul (Soju)","alternateName":["참이슬","Soju Chamisul","真露 Chamisul（烧酒）","チャミスル（焼酎）"],"offers":{"@type":"Offer","price":154000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Jinro Is Back (Soju)","alternateName":["진로 이즈백","Soju Jinro Is Back","真露 Is Back（烧酒）","ジンロ イズバック（焼酎）"],"offers":{"@type":"Offer","price":154000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Saero (Soju)","alternateName":["새로","Soju Saero","Saero（烧酒）","セロ（焼酎）"],"offers":{"@type":"Offer","price":154000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Chum Churum (Soju)","alternateName":["처음처럼","Soju Chum Churum","初饮初乐（烧酒）","チョウムチョロム（焼酎）"],"offers":{"@type":"Offer","price":154000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Tiger (can)","alternateName":["타이거 캔","Bia Tiger lon","老虎啤酒（罐）","タイガー（缶）"],"offers":{"@type":"Offer","price":44000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Heineken (can)","alternateName":["하이네켄 캔","Bia lon Heineken","喜力（罐）","ハイネケン（缶）"],"offers":{"@type":"Offer","price":44000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Draft Beer (Sapporo · Carlsberg · Dark)","alternateName":["생맥주 (사포로 · 칼스버그 · 흑맥주)","Bia tươi (Sapporo, Carlsberg, bia đen)","生啤（札幌·嘉士伯·黑啤）","生ビール（サッポロ・カールスバーグ・黒）"],"offers":{"@type":"Offer","price":66000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Coca-Cola · Sprite","alternateName":["코카콜라 · 스프라이트","Cocacola, Sprite","可口可乐 · 雪碧","コカ・コーラ・スプライト"],"offers":{"@type":"Offer","price":22000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Suntory Highball","alternateName":["산토리 하이볼","Highball Suntory","三得利嗨棒","サントリーハイボール"],"offers":{"@type":"Offer","price":154000,"priceCurrency":"VND"}},{"@type":"MenuItem","name":"Jim Beam Highball","alternateName":["짐빔 하이볼","Highball Jim Beam","金宾嗨棒","ジムビームハイボール"],"offers":{"@type":"Offer","price":132000,"priceCurrency":"VND"}}]}]}}</script>

<body>
<header>
  <div class="wrap">
    <div class="langs" id="langs"></div>
    <img class="gate" src="img/logo.jpg" alt="Kyodong Chicken 교동치킨" width="110" height="116">
    <h1 class="script">Kyodong Chicken</h1>
    <p class="en">KOREAN CHICKEN</p>
    <span class="branch" id="branch"></span>
    <p class="tagline" id="tagline"></p>
  </div>
</header>

<nav><div class="wrap" id="nav"></div></nav>

<main class="wrap" id="menu"></main>

<footer>
  <div class="wrap">
    <p class="thanks" id="thanks"></p>
    <div class="pills">
      <button class="pill" id="wifi" type="button" hidden>
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></svg></i>
        <div><small id="wifiLabel"></small><strong id="wifiText"></strong></div>
        <em id="wifiCopy"></em>
      </button>
      <a class="pill" id="call">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></i>
        <div><small id="callLabel"></small><strong id="callText"></strong></div>
      </a>
      <a class="pill" id="map" target="_blank" rel="noopener">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></i>
        <div><small id="mapLabel"></small><strong id="mapText"></strong></div>
      </a>
    </div>
    <p class="vnd" id="foot"></p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="menu.js"></script>
<script>
  const LANGS = [["ko", "한국어"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"], ["vi", "Tiếng Việt"]];
  const UI = {
    ko: { title: "메뉴", tagline: "갈릭허니 · 레드 치킨 · 찜닭 · 안주", new: "신메뉴", best: "BEST", special: "추천", spicy: "🌶 매콤", ask: "가격 문의", after: "후식",
      thanks: "교동치킨을 찾아 주셔서 감사합니다.<br>맛있는 시간 보내세요!", copy: "복사", copied: "비밀번호를 복사했어요",
      call: "전화 · 예약", map: "주소 · 지도", vnd: "가격 단위: 베트남 동(VND) · 메뉴·가격은 가게가 구글 지도에 올린 메뉴판 기준이며 바뀔 수 있어요" },
    en: { title: "Menu", tagline: "Garlic honey & red chicken · Jjimdak · Bar snacks", new: "NEW", best: "BEST", special: "Recommended", spicy: "🌶 Spicy", ask: "Ask staff", after: "With BBQ",
      thanks: "Thank you for visiting Kyodong Chicken.<br>Enjoy your meal!", copy: "Copy", copied: "Password copied",
      call: "Call · Reservations", map: "Address · Map", vnd: "Prices in VND · Based on the menu the shop posted on Google Maps; items and prices may change" },
    zh: { title: "菜单", tagline: "蒜香蜂蜜 · 红辣炸鸡 · 炖鸡 · 下酒菜", new: "新品", best: "人气", special: "推荐", spicy: "🌶 辣", ask: "请询问店员", after: "配烤肉价",
      thanks: "感谢您光临教洞炸鸡。<br>祝您用餐愉快！", copy: "复制", copied: "密码已复制",
      call: "电话 · 预订", map: "地址 · 地图", vnd: "价格单位：越南盾（VND）· 以店家在谷歌地图上的菜单为准，可能有变动" },
    ja: { title: "メニュー", tagline: "ガーリックハニー・レッドチキン・チムタク・おつまみ", new: "NEW", best: "BEST", special: "おすすめ", spicy: "🌶 辛口", ask: "店員にお尋ねください", after: "焼肉と一緒に",
      thanks: "教洞チキンへようこそ。<br>ごゆっくりお楽しみください。", copy: "コピー", copied: "パスワードをコピーしました",
      call: "電話・ご予約", map: "住所・地図", vnd: "価格はベトナムドン（VND）・お店がGoogleマップに載せたメニュー基準のため変更の場合あり" },
    vi: { title: "Thực đơn", tagline: "Gà sốt mật ong tỏi · Gà sốt cay · Gà om · Đồ nhậu", new: "MỚI", best: "BEST", special: "Đề xuất", spicy: "🌶 Cay", ask: "Hỏi nhân viên", after: "Giá ăn kèm thịt nướng",
      thanks: "Cảm ơn quý khách đã đến Kyodong Chicken.<br>Chúc quý khách ngon miệng!", copy: "Sao chép", copied: "Đã sao chép mật khẩu",
      call: "Gọi điện · Đặt bàn", map: "Địa chỉ · Bản đồ", vnd: "Giá tính bằng VND · Theo thực đơn quán đăng trên Google Maps, món và giá có thể thay đổi" },
  };
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const storage = (fn) => { try { return fn(localStorage); } catch { return null; } };
  const fmt = (n) => n.toLocaleString("en-US");
  const won = (n) => `${fmt(n)}<small>₫</small>`;
  let observer;

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  function itemHtml(it, t, lang, second) {
    const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
    const single = it.sizes ? "" : `<span class="leader"></span><span class="price ${it.price == null ? "ask" : ""}">${it.price == null ? esc(t.ask) : won(it.price)}</span>`;
    const sizes = it.sizes ? it.sizes.map(([label, p]) => `<span><i>${esc(label[lang])}</i>${won(p)}</span>`)
      : it.dessert ? [`<span class="after"><i>${esc(t.after)}</i>${won(it.dessert)}</span>`] : [];
    return `
      <li>
        ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
        <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(it.unit)}</span>` : ""}${single}</div>
        ${sizes.length ? `<div class="sizes">${sizes.join("")}</div>` : ""}
        ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
        <div class="sub">${esc(it.name[second])}</div>
      </li>`;
  }

  function render(lang) {
    const t = UI[lang], R = window.RESTAURANT;
    // 아랫줄: 한국어 화면 → 베트남어(직원과 소통용), 그 외 → 한국어
    const second = lang === "ko" ? "vi" : "ko";
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand.en} ${R.brand.ko} · ${t.title}`;

    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    $("branch").textContent = `${R.brand.branch} · Hà Nội`;
    $("tagline").textContent = t.tagline;
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        ${cat.photo ? `<img class="banner" src="${cat.photo}" alt="${esc(cat.name[lang])}" loading="lazy">` : ""}
        <div class="head"><h2 class="serif">${esc(cat.name[lang])}<small>${esc(cat.name[lang === "vi" ? "ko" : "vi"])}</small></h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => itemHtml(it, t, lang, second)).join("")}</ul>
        ${cat.quote ? `<p class="quote">${esc(cat.quote[lang])}</p>` : ""}
      </section>`).join("");

    $("thanks").innerHTML = t.thanks;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = `Wi-Fi · ${R.wifi.ssid}`;
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    $("call").hidden = !R.phone;
    if (R.phone) {
      $("callLabel").textContent = t.call;
      $("callText").textContent = R.phone;
      $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    }
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.mapQuery + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
<script src="stores-link.js"></script>
<script src="lang-menu.js"></script>
<script src="dasan.js"></script>
</body>
</html>
