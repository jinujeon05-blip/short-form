<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>동구네 메뉴</title>
<meta name="description" content="동구네 DongGooNe — 숯불구이·꼼장어·장어 · Võ Cường, Bắc Ninh">
<style>
  :root {
    --y: #d4343c;
    --y-d: #a81f28;
    --black: #1f1b18;
    --black-2: #322d29;
    --paper: #faf6ee;
    --paper-2: #eadfca;
    --ink: #1f1b18;
    --muted: #776d58;
    --line: #e3d9c3;
    --red: #c8222c;
    --gold: #e6b04b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단: 간판 야간 사진 + 간판의 빨강·검정·크림 나무색 ── */
  header { position: relative; text-align: center; padding: 0 0 34px; background: #efe6d4; color: var(--black); }
  .hero { position: relative; height: 230px; background: #1f1b18 url(img/hero.jpg) center / cover no-repeat; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(31,27,24,.5) 0%, rgba(31,27,24,0) 35%, rgba(31,27,24,0) 85%, rgba(31,27,24,.35) 100%); }
  .langs { position: absolute; top: 12px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: rgba(31,27,24,.6); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--black); background: #fff; border-color: #fff; }
  .stripe { position: relative; z-index: 1; height: 8px; background: linear-gradient(90deg, var(--black) 0 60%, var(--red) 0); }
  .mark { position: relative; z-index: 1; display: block; width: min(86%, 400px); height: auto; margin: 20px auto 0; border-radius: 12px; border: 3px solid var(--black); box-shadow: 0 5px 14px rgba(31,27,24,.25); }
  h1 { margin: 14px 0 0; font-size: 28px; font-weight: 900; letter-spacing: 1px; line-height: 1.1; color: var(--black); }
  .en { margin: 8px 0 0; font-size: 12.5px; font-weight: 800; letter-spacing: 1px; color: var(--red); }
  .branch { display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 700; color: #f3e3c0; background: var(--black); border-radius: 999px; padding: 3px 12px; }
  .tagline { margin: 12px 0 0; font-size: 15px; font-weight: 700; color: var(--black); }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chips span { font-size: 12.5px; font-weight: 700; color: var(--black); border: 1.5px solid var(--black); border-radius: 999px; padding: 4px 11px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: var(--black); box-shadow: 0 4px 12px rgba(31,27,24,.3); }
  nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 7px; padding-bottom: 7px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: #eadfca; text-decoration: none; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  nav a.active { color: #fff; background: var(--y); }

  /* ── 메뉴 ── */
  section { padding: 30px 0 6px; }
  .head { text-align: center; }
  h2 { margin: 0; display: inline-block; font-size: 25px; font-weight: 900; letter-spacing: 1px; color: var(--black); padding-bottom: 6px; border-bottom: 4px solid var(--y); }
  h2 small { display: block; margin-top: 3px; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: var(--red); text-transform: uppercase; }
  .note { margin: 14px 0 0; font-size: 13.5px; background: var(--paper-2); border-left: 3px solid var(--y-d); border-radius: 0 10px 10px 0; padding: 8px 12px; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .thumb { flex: none; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; padding: 0; border: 3px solid var(--y); background: var(--paper-2); box-shadow: 0 3px 10px rgba(31,27,24,.25); cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 3px; }
  .tags span { font-size: 10.5px; font-weight: 800; letter-spacing: .3px; color: #fff; background: var(--black-2); border-radius: 3px; padding: 1px 6px; }
  .tags .best { background: var(--red); }
  .tags .new { background: var(--red); }
  .tags .must { background: var(--y-d); }
  .tags .hot { background: #fff; color: var(--red); border: 1px solid #e6b3a6; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 17px; font-weight: 800; }
  .row .unit { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .row .leader { flex: 1; min-width: 10px; border-bottom: 2px dotted #cdbf9f; transform: translateY(-4px); }
  .price { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--red); }
  .price small { font-size: 11px; color: var(--muted); margin-left: 1px; }
  .price.ask { font-size: 13px; color: var(--muted); }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .sizes span { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--black-2); border-radius: 4px; padding: 0 5px; margin-right: 5px; }
  .desc { margin-top: 4px; font-size: 13px; color: #5e5a4c; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .sub.it { font-style: italic; }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: var(--black); color: #f3ece6; padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); }
  .quote { text-align: center; font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: #f3efe4; text-decoration: none; background: var(--black-2); border: 0; border-radius: 16px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #4a433d; }
  .pill i svg { width: 20px; height: 20px; color: var(--gold); }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: #c9bfae; font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--gold); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; opacity: .85; }

  .zoom { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(15,12,10,.92); cursor: zoom-out; }
  .zoom.show { display: grid; }
  .zoom figure { margin: 0; max-width: 520px; width: 100%; }
  .zoom img { width: 100%; border-radius: 18px; display: block; background: var(--paper); }
  .zoom figcaption { margin-top: 10px; text-align: center; font-size: 16px; font-weight: 800; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--black-2); color: #fff; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

</style>

  <div class="wrap">

    <div class="pills">
      <button class="pill" id="wifi" type="button" hidden>
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></svg></i>
        <div><small id="wifiLabel"></small><strong id="wifiText"></strong></div>
        <em id="wifiCopy"></em>

        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></i>
        <div><small id="callLabel"></small><strong id="callText"></strong></div>
      </a>
      <a class="pill" id="map" target="_blank" rel="noopener">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></i>
        <div><small id="mapLabel"></small><strong id="mapText"></strong></div>

<script src="menu.js"></script>
<!-- override:start (tools/analytics.mjs 가 만듦, 직접 고치지 말 것) -->
<script src="https://qrmenuasia.com/api/override?shop=donggoone"></script>
<!-- override:end -->
<script>
  const LANGS = [["ko", "한국어"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"], ["vi", "Tiếng Việt"]];
  const UI = {
    ko: { title: "메뉴", tagline: "숯불구이 · 꼼장어 · 장어 한식당", chips: ["오후 10시까지 영업", "실내 · 야외 좌석"],
      best: "BEST", new: "신메뉴", must: "추천", spicy: "🌶 매콤", ask: "가격 문의",
      quote: "동구네를 찾아 주셔서 감사합니다.<br>맛있게 드세요!", copy: "복사", copied: "비밀번호를 복사했어요",
      call: "전화", map: "주소 · 지도", vnd: "가격 단위: 베트남 동(VND) · 메뉴·가격은 가게와 손님이 구글 지도에 올린 메뉴판 기준이며 바뀔 수 있어요" },
    en: { title: "Menu", tagline: "Charcoal BBQ · hagfish · eel", chips: ["Open until 10:00 PM", "Indoor & outdoor seating"],
      best: "BEST", new: "NEW", must: "Must try", spicy: "🌶 Spicy", ask: "Ask staff",
      quote: "Thank you for visiting DongGooNe.<br>Enjoy your meal!", copy: "Copy", copied: "Password copied",
      call: "Call", map: "Address · Map", vnd: "Prices in VND · Based on menus the shop and customers posted on Google Maps; items and prices may change" },
    zh: { title: "菜单", tagline: "炭火烤肉 · 烤盲鳗 · 鳗鱼韩餐厅", chips: ["营业至晚上 10:00", "室内 · 室外座位"],
      best: "人气", new: "新品", must: "必点", spicy: "🌶 辣", ask: "请询问店员",
      quote: "感谢您光临 DongGooNe（동구네）。<br>祝您用餐愉快！", copy: "复制", copied: "密码已复制",
      call: "电话", map: "地址 · 地图", vnd: "价格单位：越南盾（VND）· 以店家和顾客在谷歌地图上传的菜单为准，可能有变动" },
    ja: { title: "メニュー", tagline: "炭火焼肉・コムジャンオ・うなぎの韓国料理店", chips: ["22:00 まで営業", "屋内・屋外席"],
      best: "BEST", new: "NEW", must: "おすすめ", spicy: "🌶 辛口", ask: "店員にお尋ねください",
      quote: "トングネ（동구네）へようこそ。<br>ごゆっくりお召し上がりください！", copy: "コピー", copied: "パスワードをコピーしました",
      call: "電話", map: "住所・地図", vnd: "価格はベトナムドン（VND）・お店とお客様がGoogleマップに載せたメニュー基準のため変更の場合あり" },
    vi: { title: "Thực đơn", tagline: "Thịt nướng than hoa · Lươn · Món Hàn Quốc", chips: ["Mở cửa đến 22:00", "Chỗ ngồi trong nhà & ngoài trời"],
      best: "BEST", new: "MỚI", must: "Nên thử", spicy: "🌶 Cay", ask: "Hỏi nhân viên",
      quote: "Cảm ơn quý khách đã đến DongGooNe.<br>Chúc quý khách ngon miệng!", copy: "Sao chép", copied: "Đã sao chép mật khẩu",
      call: "Gọi điện", map: "Địa chỉ · Bản đồ", vnd: "Giá tính bằng VND · Theo thực đơn quán và khách đăng trên Google Maps, món và giá có thể thay đổi" },
  };
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const storage = (fn) => { try { return fn(localStorage); } catch { return null; } };
  let observer;

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  const fmt = (n) => n.toLocaleString("en-US");
  const label = (s, lang) => (typeof s === "string" ? s : s[lang] || s.en);

  function render(lang) {
    const t = UI[lang], R = window.RESTAURANT;
    // 아랫줄: 한국어 화면 → 베트남어(직원과 소통용), 그 외 → 한국어
    const second = lang === "ko" ? "vi" : "ko";
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand.ko} · ${t.title}`;

    $("langs").innerHTML = LANGS.map(([c, l]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${l}</button>`).join("");
    $("branch").textContent = `${R.brand.branch.ko} · ${R.brand.branch.en}`;
    $("tagline").textContent = t.tagline;
    $("chips").innerHTML = t.chips.map((c) => `<span>${esc(c)}</span>`).join("");
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        <div class="head"><h2>${esc(cat.name[lang])}<small>${esc(cat.name[lang === "vi" ? "en" : "vi"])}</small></h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => {
          const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
          const single = it.sizes ? "" : `<span class="leader"></span><span class="price ${it.price == null ? "ask" : ""}">${it.price == null ? esc(t.ask) : `${fmt(it.price)}<small>₫</small>`}</span>`;
          const sizes = it.sizes ? `<div class="sizes">${it.sizes.map(([s, p]) => `<span><i>${esc(label(s, lang))}</i>${p == null ? esc(t.ask) : `${fmt(p)}<small>₫</small>`}</span>`).join("")}</div>` : "";
          return `
          <li>
            ${it.photo ? `<button class="thumb" type="button" data-photo="${it.photo}" data-cap="${esc(it.name[lang])}"><img src="${it.photo}" alt="${esc(it.name[lang])}" loading="lazy"></button>` : ""}
            <div class="info">
              ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
              <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(label(it.unit, lang))}</span>` : ""}${single}</div>
              ${sizes}
              ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
              <div class="sub ${second === "vi" ? "it" : ""}">${esc(it.name[second])}</div>
            </div>
          </li>`; }).join("")}
        </ul>
      </section>`).join("");

    $("quote").innerHTML = t.quote;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = R.wifi.ssid ? `Wi-Fi · ${R.wifi.ssid}` : "Wi-Fi";
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    $("callLabel").textContent = t.call;
    $("callText").textContent = R.phone;
    $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.mapQuery + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (!b) return;
    $("zoomImg").src = b.dataset.photo;
    $("zoomCap").textContent = b.dataset.cap;
    $("zoom").classList.add("show");
  });
  $("zoom").addEventListener("click", () => $("zoom").classList.remove("show"));

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
