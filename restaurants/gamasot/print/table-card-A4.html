  .h { top: 148.5mm; left: 0; height: .1mm; width: 210mm; }
</style>
</head>
<body>
  <div class="grid">
    <iframe src="table-card.html"></iframe><iframe src="table-card.html"></iframe>
    <iframe src="table-card.html"></iframe><iframe src="table-card.html"></iframe>
  </div>
  <div class="cut v"></div><div class="cut h"></div>

</html>
