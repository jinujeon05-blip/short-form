<html lang="ko">
<head>
<meta charset="utf-8">

<title>삼원정 SAMWONJUNG 메뉴</title>
<meta name="description" content="삼원정 SAMWONJUNG · Nhà hàng BBQ Hàn Quốc — Trần Văn Lai, Mỹ Đình, Nam Từ Liêm, Hà Nội">
<style>
  :root {
    --paper: #fdfdfb;
    --paper-2: #eef3ee;
    --band: #00361e;
    --band-2: #0a4a2a;
    --ink: #1f2a24;
    --muted: #6b7a70;
    --line: #dfe6df;
    --rust: #0b6b3a;
    --gold: #b59a5b;
    --cream: #f1ead8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단 ── */
  header { position: relative; overflow: hidden; text-align: center; padding: 12px 0 30px; background: var(--band); color: var(--cream); }
  .corner { position: absolute; top: 14px; width: 22px; height: 22px; border: 1px solid rgba(241,234,216,.55); pointer-events: none; }
  .corner.l { left: 14px; }
  .corner.r { right: 14px; }
  .langs { position: relative; z-index: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: var(--cream); background: transparent; border: 1px solid rgba(241,234,216,.4); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: var(--band); background: var(--cream); border-color: var(--cream); }
  .logo { display: block; width: 220px; max-width: 70%; height: auto; margin: 22px auto 0; mix-blend-mode: lighten; }
  h1 { margin: 4px 0 0; font-size: 36px; font-weight: 800; letter-spacing: 8px; line-height: 1; color: #fff; }
  .en { margin: 8px 0 0; font-size: 15px; font-weight: 600; letter-spacing: 6px; color: var(--gold); }
  .tagline { margin: 12px 0 0; font-size: 14.5px; font-weight: 600; color: #cfdccf; }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; position: relative; z-index: 1; }
  .chips span { font-size: 12.5px; font-weight: 700; color: var(--cream); background: transparent; border: 1px solid rgba(181,154,91,.7); border-radius: 999px; padding: 4px 11px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: var(--band); border-bottom: 1px solid rgba(181,154,91,.5); box-shadow: 0 4px 12px rgba(0,30,15,.2); }
  nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 7px; padding-bottom: 7px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: #d5e0d5; text-decoration: none; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  nav a.active { color: var(--band); background: var(--cream); }

  /* ── 메뉴 ── */
  section { padding: 30px 0 6px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head::before, .head::after { content: ""; flex: 1; height: 1px; background: var(--rust); opacity: .45; }
  h2 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: 1px; text-align: center; color: var(--rust); }
  h2 small { display: block; margin-top: 3px; font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .note { margin: 12px 0 0; font-size: 13.5px; color: var(--band-2); background: var(--paper-2); border-left: 3px solid var(--rust); border-radius: 0 6px 6px 0; padding: 8px 12px; }
  .tip { margin: 14px 0 0; font-size: 13.5px; color: var(--ink); background: #fff; border: 1px solid #c9d8cb; border-radius: 4px; padding: 10px 12px; }
  .tip b { color: var(--rust); margin-right: 4px; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .thumb { flex: none; width: 96px; height: 72px; border-radius: 12px; overflow: hidden; padding: 0; border: 1px solid var(--line); background: var(--paper); cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .info { flex: 1; min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 3px; }
  .tags span { font-size: 10.5px; font-weight: 800; letter-spacing: .3px; color: #fff; background: var(--rust); border-radius: 3px; padding: 1px 6px; }
  .tags .best { background: var(--band-2); }
  .tags .special { background: var(--gold); }
  .tags .hot { background: #fff; color: #b3402a; border: 1px solid #e6b3a6; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 17px; font-weight: 800; }
  .row .unit { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .row .leader { flex: 1; min-width: 10px; border-bottom: 1px dotted #9db7a3; transform: translateY(-4px); }
  .price { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--band-2); }
  .price small { font-size: 11px; color: var(--muted); margin-left: 1px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .sizes span { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--band-2); background: #fff; border: 1px solid #c9d8cb; border-radius: 4px; padding: 2px 8px; }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--band); border-radius: 4px; padding: 0 4px; margin-right: 5px; }
  .desc { margin-top: 4px; font-size: 13px; color: #5d544b; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .sub.it { font-style: italic; }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: var(--band); color: var(--cream); padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); border-top: 3px double rgba(181,154,91,.7); }
  .quote { text-align: center; font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .quote small { display: block; margin-top: 4px; font-size: 12.5px; opacity: .8; }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--paper); border: 0; border-radius: 8px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--rust); }
  .pill i svg { width: 20px; height: 20px; color: #fff; }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--rust); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; opacity: .8; }

  .zoom { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(0,25,12,.9); cursor: zoom-out; }
  .zoom.show { display: grid; }
  .zoom figure { margin: 0; max-width: 560px; width: 100%; }
  .zoom img { width: 100%; border-radius: 16px; display: block; background: var(--paper); }
  .zoom figcaption { margin-top: 10px; text-align: center; font-size: 16px; font-weight: 800; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--band-2); color: #fff; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

      quote: "맛있는 한 끼,<br>즐거운 시간 보내세요.<small>– 삼원정 –</small>",
      copy: "복사", copied: "비밀번호를 복사했어요", hours: "영업시간", call: "전화 · 예약", map: "주소 · 지도", vnd: "가격 단위: 베트남 동(VND) · 메뉴·가격은 구글 지도에 올린 메뉴판 기준이며 바뀔 수 있어요" },
    en: { title: "Menu", tagline: "Premium Korean BBQ · Timeless Korean dining", chips: ["Lunch sets & set menus", "Corkage available"],
      must: "Must Try", best: "BEST", special: "Special", spicy: "🌶 Spicy", tip: "TIP", market: "Market price",
      quote: "Enjoy your meal<br>and a lovely time.<small>– Samwonjung –</small>",
      copy: "Copy", copied: "Password copied", hours: "Opening hours", call: "Call · Reservations", map: "Address · Map", vnd: "Prices in Vietnamese đồng (VND) · Menu and prices are based on the menu posted on Google Maps and may change" },
    zh: { title: "菜单", tagline: "高档韩式烤肉 · 经典韩餐", chips: ["午市套餐 · 套餐菜单", "可自带酒水（收开瓶费）"],
      must: "必吃", best: "人气", special: "特色", spicy: "🌶 辣", tip: "小贴士", market: "时价",
      quote: "祝您用餐愉快，<br>度过美好时光。<small>– SAMWONJUNG –</small>",
      copy: "复制", copied: "密码已复制", hours: "营业时间", call: "电话 · 预订", map: "地址 · 地图", vnd: "价格单位：越南盾（VND）· 菜单和价格以谷歌地图上发布的菜单为准，可能会有变动" },
    ja: { title: "メニュー", tagline: "プレミアム韓国焼肉・伝統の韓国料理", chips: ["ランチ定食・セットメニュー", "お酒の持ち込み可（コルケージ料）"],
      must: "Must Try", best: "BEST", special: "スペシャル", spicy: "🌶 辛口", tip: "TIP", market: "時価",
      quote: "ごゆっくり<br>お食事をお楽しみください。<small>– SAMWONJUNG –</small>",
      copy: "コピー", copied: "パスワードをコピーしました", hours: "営業時間", call: "電話・ご予約", map: "住所・地図", vnd: "価格はベトナムドン（VND）です・メニューと価格はGoogleマップに掲載されたメニュー表に基づいており、変更される場合があります" },
    vi: { title: "Thực đơn", tagline: "Nhà hàng BBQ Hàn Quốc cao cấp · Ẩm thực Hàn truyền thống", chips: ["Set trưa · Set menu", "Được mang rượu vào (có phí mở chai)"],
      must: "Must Try", best: "BEST", special: "Đặc biệt", spicy: "🌶 Cay", tip: "TIP", market: "Liên hệ",
      quote: "Chúc quý khách ngon miệng<br>và có những giây phút vui vẻ.<small>– SAMWONJUNG –</small>",
      copy: "Sao chép", copied: "Đã sao chép mật khẩu", hours: "Giờ mở cửa", call: "Gọi điện · Đặt bàn", map: "Địa chỉ · Bản đồ", vnd: "Giá tính bằng VND · Thực đơn và giá theo menu đăng trên Google Maps, có thể thay đổi" },
  };
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const storage = (fn) => { try { return fn(localStorage); } catch { return null; } };
  let observer;

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  const fmt = (n) => n.toLocaleString("en-US");

  function priceHtml(it, t) {
    if (it.sizes) return `<div class="sizes">${it.sizes.map(([s, p]) => `<span><i>${s}</i>${fmt(p)}<small>₫</small></span>`).join("")}</div>`;
    return "";
  }

  function render(lang) {
    const t = UI[lang], R = window.RESTAURANT;
    // 아랫줄: 한국어 화면 → 베트남어(직원용), 그 외 → 한국어
    const second = lang === "ko" ? "vi" : "ko";
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand.ko} ${R.brand.en} · ${t.title}`;

    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    $("tagline").textContent = t.tagline;
    $("chips").innerHTML = t.chips.map((c) => `<span>${esc(c)}</span>`).join("");
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        <div class="head"><h2>${esc(cat.name[lang])}${lang !== "vi" ? `<small>${esc(cat.name.vi)}</small>` : `<small>${esc(cat.name.ko)}</small>`}</h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => {
          const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
          const single = it.sizes ? "" : `<span class="leader"></span><span class="price">${it.price == null ? esc(t.market) : `${fmt(it.price)}<small>₫</small>`}</span>`;
          return `
          <li>
            ${it.photo ? `<button class="thumb" type="button" data-photo="${it.photo}" data-cap="${esc(it.name[lang])}"><img src="${it.photo}" alt="${esc(it.name[lang])}" loading="lazy"></button>` : ""}
            <div class="info">
              ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
              <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(it.unit)}</span>` : ""}${single}</div>
              ${priceHtml(it, t)}
              ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
              <div class="sub ${second === "vi" ? "it" : ""}">${esc(it.name[second])}</div>
            </div>
          </li>`; }).join("")}
        </ul>
        ${cat.tip ? `<p class="tip"><b>${esc(t.tip)}</b>${esc(cat.tip[lang])}</p>` : ""}
      </section>`).join("");

    $("quote").innerHTML = t.quote;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = `Wi-Fi · ${R.wifi.ssid}`;
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    if (R.hours) {
      $("hours").hidden = false;
      $("hoursLabel").textContent = t.hours;
      $("hoursText").textContent = typeof R.hours === "string" ? R.hours : R.hours[lang];
    }
    $("callLabel").textContent = t.call;
    $("callText").textContent = R.phone;
    $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.brand.en + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (!b) return;
    $("zoomImg").src = b.dataset.photo;
    $("zoomCap").textContent = b.dataset.cap;
    $("zoom").classList.add("show");
  });
  $("zoom").addEventListener("click", () => $("zoom").classList.remove("show"));

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
