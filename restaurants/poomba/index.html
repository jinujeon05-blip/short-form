<title>품바 POOMBA 메뉴</title>
<meta name="description" content="품바 POOMBA · 한국식 민속주점 · 모듬전 · 참숯 꼬치 · 막걸리 — Chung cư CT5, Tầng 01 - SH02, Mỹ Đình, Mễ Trì, Từ Liêm, Hà Nội">
<style>  :root {
    --paper: #2a1b12;
    --paper-2: #3a271b;
    --band: #1f130c;
    --band-2: #c8281f;
    --ink: #f6ecd9;
    --muted: #c4b095;
    --line: rgba(246,236,217,.16);
    --rust: #c8281f;
    --gold: #e8c04a;
    --price: #ffe23a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; background: #2a1b12; }
  body {
    margin: 0; color: var(--ink); background-color: var(--paper);
    /* 짙은 나무결 */
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 23px, rgba(0,0,0,.14) 23px 24px, rgba(255,214,160,.03) 24px 41px, rgba(0,0,0,.08) 41px 42px),
      linear-gradient(180deg, #33221a, #261910 60%, #2f2016);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단 ── */
  header { position: relative; overflow: hidden; text-align: center; padding: 12px 0 28px; border-bottom: 3px solid var(--band-2); }
  .corner { display: none; }
  .langs { position: relative; z-index: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: rgba(246,236,217,.08); border: 1px solid rgba(246,236,217,.3); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: #fff; background: var(--band-2); border-color: var(--band-2); }
  .logo { display: block; width: 132px; height: auto; margin: 26px auto 0; }
  .logo.sign { width: 100%; max-width: 440px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; margin-top: 18px; border: 3px solid #5a3b27; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  h1 { margin: 12px 0 0; font-size: 44px; font-weight: 800; letter-spacing: 10px; padding-left: 10px; line-height: 1; color: #f6ecd9; }
  .en { margin: 8px 0 0; font-size: 16px; font-weight: 700; letter-spacing: 7px; padding-left: 7px; color: var(--band-2); }
  .tagline { margin: 12px 0 0; font-size: 14.5px; font-weight: 600; color: var(--muted); }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; position: relative; z-index: 1; }
  .chips span { font-size: 12.5px; font-weight: 700; color: var(--ink); background: transparent; border: 1px solid rgba(246,236,217,.4); border-radius: 3px; padding: 4px 11px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: var(--band); border-bottom: 1px solid #4a3020; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 7px; padding-bottom: 7px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: #d9c7a8; text-decoration: none; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  nav a.active { color: #fff; background: var(--band-2); }

  /* ── 메뉴 ── */
  section { padding: 30px 0 6px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head::before, .head::after { content: ""; flex: 1; height: 1px; background: rgba(246,236,217,.3); }
  h2 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: 2px; text-align: center; color: #f6ecd9; }
  h2 small { display: block; margin-top: 3px; font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .note { margin: 12px 0 0; font-size: 13.5px; color: var(--ink); background: rgba(246,236,217,.08); border-left: 3px solid var(--band-2); border-radius: 0 4px 4px 0; padding: 8px 12px; }
  .tip { margin: 14px 0 0; font-size: 13.5px; color: var(--ink); background: rgba(0,0,0,.22); border: 1px dashed rgba(246,236,217,.35); border-radius: 4px; padding: 10px 12px; }
  .tip b { color: var(--gold); margin-right: 4px; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .thumb { flex: none; width: 96px; height: 72px; border-radius: 4px; overflow: hidden; padding: 0; border: 1px solid rgba(246,236,217,.25); background: var(--paper); cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .info { flex: 1; min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 3px; }
  .tags span { font-size: 10.5px; font-weight: 800; letter-spacing: .3px; color: #fff; background: var(--rust); border-radius: 999px; padding: 1px 8px; }
  .tags .best { background: var(--band-2); }
  .tags .special { background: var(--gold); color: #2a1b12; }
  .tags .hot { background: transparent; color: #ff8a70; border: 1px solid #ff8a70; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 17px; font-weight: 800; color: #f6ecd9; }
  .row .unit { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .row .leader { flex: 1; min-width: 10px; border-bottom: 2px dotted rgba(246,236,217,.3); transform: translateY(-4px); }
  .price { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--price); }
  .price small { font-size: 11px; color: var(--price); opacity: .8; margin-left: 1px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .sizes span { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--price); background: rgba(0,0,0,.25); border: 1px solid rgba(246,236,217,.22); border-radius: 4px; padding: 2px 8px; }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--band-2); border-radius: 999px; padding: 0 6px; margin-right: 5px; }
  .desc { margin-top: 4px; font-size: 13px; color: #dccdb3; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .sub.it { font-style: italic; }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: var(--band); border-top: 3px solid var(--band-2); color: #f3ecdf; padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); }
  .quote { text-align: center; font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .quote small { display: block; margin-top: 4px; font-size: 12.5px; opacity: .8; }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--paper-2); border: 1px solid rgba(246,236,217,.2); border-radius: 6px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--band-2); }
  .pill i svg { width: 20px; height: 20px; color: #fff; }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--gold); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; opacity: .8; }

  .zoom { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(20,12,7,.92); cursor: zoom-out; }
  .zoom.show { display: grid; }
  .zoom figure { margin: 0; max-width: 560px; width: 100%; }
  .zoom img { width: 100%; border-radius: 4px; display: block; background: var(--paper); }
  .zoom figcaption { margin-top: 10px; text-align: center; font-size: 16px; font-weight: 800; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--band-2); color: #fff; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

        <div><small id="callLabel"></small><strong id="callText"></strong></div>

<script src="https://qrmenuasia.com/api/override?shop=poomba"></script>
<!-- override:end -->
<script>
  const LANGS = [["ko", "한국어"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"], ["vi", "Tiếng Việt"]];
  const UI = {
    ko: { title: "메뉴", tagline: "바로 부친 전 · 참숯 꼬치 · 막걸리", chips: ["한국식 민속주점", "막걸리 20여 가지"],
      must: "Must Try", best: "BEST", special: "스페셜", spicy: "🌶 매콤", tip: "TIP", market: "시가",
      quote: "갓 부친 전에 막걸리 한 잔,<br>즐거운 시간 보내세요.<small>– 품바 –</small>",
      copy: "복사", copied: "비밀번호를 복사했어요", hours: "영업시간", call: "전화 · 예약", map: "주소 · 지도", vnd: "가격 단위: 베트남 동(VND) · 메뉴·가격은 손님이 구글 지도에 올린 메뉴판 기준이며 바뀔 수 있어요" },
    en: { title: "Menu", tagline: "Freshly fried jeon · Charcoal skewers · Makgeolli", chips: ["Korean traditional pub", "20+ kinds of makgeolli"],
      must: "Must Try", best: "BEST", special: "Special", spicy: "🌶 Spicy", tip: "TIP", market: "Market price",
      quote: "Freshly fried jeon with a glass of makgeolli —<br>have a great time.<small>– Poomba –</small>",
      copy: "Copy", copied: "Password copied", hours: "Opening hours", call: "Call · Reservations", map: "Address · Map", vnd: "Prices in Vietnamese đồng (VND) · Menu and prices are based on the menu photos customers posted on Google Maps and may change" },
    zh: { title: "菜单", tagline: "现煎煎饼 · 炭火烤串 · 马格利酒", chips: ["韩式传统酒馆", "20多种马格利酒"],
      must: "必吃", best: "人气", special: "特色", spicy: "🌶 辣", tip: "小贴士", market: "时价",
      quote: "刚煎好的煎饼配一杯马格利，<br>祝您用餐愉快。<small>– 品巴 POOMBA –</small>",
      copy: "复制", copied: "密码已复制", hours: "营业时间", call: "电话 · 预订", map: "地址 · 地图", vnd: "价格单位：越南盾（VND）· 菜单和价格以顾客上传到谷歌地图的菜单照片为准，可能会有变动" },
    ja: { title: "メニュー", tagline: "焼きたてジョン · 炭火串焼き · マッコリ", chips: ["韓国式の民俗酒場", "マッコリ20種類以上"],
      must: "Must Try", best: "BEST", special: "スペシャル", spicy: "🌶 辛口", tip: "TIP", market: "時価",
      quote: "焼きたてのジョンとマッコリで、<br>楽しいひとときをお過ごしください。<small>– プムバ POOMBA –</small>",
      copy: "コピー", copied: "パスワードをコピーしました", hours: "営業時間", call: "電話・ご予約", map: "住所・地図", vnd: "価格はベトナムドン（VND）です・メニューと価格はお客様がGoogleマップに投稿したメニュー写真に基づいており、変更される場合があります" },
    vi: { title: "Thực đơn", tagline: "Bánh chiên Hàn Quốc mới chiên · Xiên nướng than hoa · Makgeolli", chips: ["Quán nhậu truyền thống Hàn Quốc", "Hơn 20 loại makgeolli"],
      must: "Must Try", best: "BEST", special: "Đặc biệt", spicy: "🌶 Cay", tip: "TIP", market: "Liên hệ",
      quote: "Bánh chiên mới chiên cùng một ly makgeolli,<br>chúc quý khách có thời gian vui vẻ.<small>– POOMBA –</small>",
      copy: "Sao chép", copied: "Đã sao chép mật khẩu", hours: "Giờ mở cửa", call: "Gọi điện · Đặt bàn", map: "Địa chỉ · Bản đồ", vnd: "Giá tính bằng VND · Thực đơn và giá theo menu do khách đăng trên Google Maps, có thể thay đổi" },
  };
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const storage = (fn) => { try { return fn(localStorage); } catch { return null; } };
  let observer;

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  const fmt = (n) => n.toLocaleString("en-US");

  function priceHtml(it, t) {
    if (it.sizes) return `<div class="sizes">${it.sizes.map(([s, p]) => `<span><i>${s}</i>${fmt(p)}<small>₫</small></span>`).join("")}</div>`;
    return "";
  }

  function render(lang) {
    const t = UI[lang], R = window.RESTAURANT;
    // 아랫줄: 한국어 화면 → 베트남어(직원용), 그 외 → 한국어
    const second = lang === "ko" ? "vi" : "ko";
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand.ko} ${R.brand.en} · ${t.title}`;

    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    $("tagline").textContent = t.tagline;
    $("chips").innerHTML = t.chips.map((c) => `<span>${esc(c)}</span>`).join("");
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        <div class="head"><h2>${esc(cat.name[lang])}${lang !== "vi" ? `<small>${esc(cat.name.vi)}</small>` : `<small>${esc(cat.name.ko)}</small>`}</h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => {
          const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
          const single = it.sizes ? "" : `<span class="leader"></span><span class="price">${it.price == null ? esc(t.market) : `${fmt(it.price)}<small>₫</small>`}</span>`;
          return `
          <li>
            ${it.photo ? `<button class="thumb" type="button" data-photo="${it.photo}" data-cap="${esc(it.name[lang])}"><img src="${it.photo}" alt="${esc(it.name[lang])}" loading="lazy"></button>` : ""}
            <div class="info">
              ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
              <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(it.unit)}</span>` : ""}${single}</div>
              ${priceHtml(it, t)}
              ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
              <div class="sub ${second === "vi" ? "it" : ""}">${esc(it.name[second])}</div>
            </div>
          </li>`; }).join("")}
        </ul>
        ${cat.tip ? `<p class="tip"><b>${esc(t.tip)}</b>${esc(cat.tip[lang])}</p>` : ""}
      </section>`).join("");

    $("quote").innerHTML = t.quote;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = `Wi-Fi · ${R.wifi.ssid}`;
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    if (R.hours) {
      $("hours").hidden = false;
      $("hoursLabel").textContent = t.hours;
      $("hoursText").textContent = typeof R.hours === "string" ? R.hours : R.hours[lang];
    }
    $("callLabel").textContent = t.call;
    $("callText").textContent = R.phone;
    $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.brand.en + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (!b) return;
    $("zoomImg").src = b.dataset.photo;
    $("zoomCap").textContent = b.dataset.cap;
    $("zoom").classList.add("show");
  });
  $("zoom").addEventListener("click", () => $("zoom").classList.remove("show"));

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
