<title>정성 JUNGSUNG 메뉴</title>
<meta name="description" content="정성 JUNGSUNG · Nhà hàng Hàn Quốc — The Emerald CT8, Mỹ Đình, Từ Liêm, Hà Nội">
<style>
  :root {
    --paper: #0f0e0d;
    --paper-2: #1a1816;
    --band: #0a0909;
    --band-2: #c9a45c;
    --ink: #efe6d2;
    --muted: #a39881;
    --line: #2d2924;
    --rust: #c8332c;
    --gold: #c9a45c;
    --red: #ea4a40;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; background: var(--paper); }
  body {
    margin: 0; color: var(--ink);
    background: radial-gradient(ellipse at 50% 0, #1d1a17 0, transparent 60%) no-repeat, var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단: 검은 간판 + 금색 얇은 모서리선(검은 포스터 메뉴판) ── */
  header { position: relative; overflow: hidden; text-align: center; padding: 12px 0 44px; }
  .corner { position: absolute; bottom: 12px; width: 46px; height: 46px; border: 1px solid var(--gold); pointer-events: none; }
  .corner::before { content: ""; position: absolute; bottom: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .corner.l { left: 16px; border-right: 0; border-top: 0; }
  .corner.l::before { left: -4px; bottom: auto; top: -4px; }
  .corner.r { right: 16px; border-left: 0; border-top: 0; }
  .corner.r::before { left: -4px; }
  .langs { position: relative; z-index: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: var(--gold); background: transparent; border: 1px solid #5b4b2e; border-radius: 3px; padding: 5px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: #0a0909; background: var(--gold); border-color: var(--gold); }
  .logo { display: block; width: 132px; height: auto; margin: 26px auto 0; }
  .logo.sign { width: 100%; max-width: 440px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 3px; margin-top: 18px; border: 1px solid #5b4b2e; }
  h1 { margin: 14px 0 0; font-size: 42px; font-weight: 800; letter-spacing: 8px; line-height: 1; color: var(--gold); text-indent: 8px; }
  .en { margin: 8px 0 0; font-size: 15px; font-weight: 600; letter-spacing: 6px; color: var(--ink); }
  .tagline { margin: 12px 0 0; font-size: 14.5px; font-weight: 600; color: var(--muted); }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; position: relative; z-index: 1; }
  .chips span { font-size: 12.5px; font-weight: 700; color: var(--gold); background: transparent; border: 1px solid #5b4b2e; border-radius: 3px; padding: 4px 11px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: #0a0909; border-top: 1px solid #5b4b2e; border-bottom: 1px solid var(--gold); box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 7px; padding-bottom: 7px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: #d9cdb3; text-decoration: none; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 3px; white-space: nowrap; }
  nav a.active { color: #0a0909; background: var(--gold); }

  /* ── 메뉴 ── */
  section { padding: 30px 0 6px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head::before, .head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .head::after { background: linear-gradient(90deg, var(--gold), transparent); }
  h2 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: 2px; text-align: center; color: var(--gold); }
  h2 small { display: block; margin-top: 3px; font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .note { margin: 12px 0 0; font-size: 13.5px; color: var(--gold); background: var(--paper-2); border-left: 2px solid var(--gold); border-radius: 0; padding: 8px 12px; }
  .tip { margin: 14px 0 0; font-size: 13.5px; color: var(--ink); background: var(--paper-2); border: 1px solid #5b4b2e; border-radius: 3px; padding: 10px 12px; }
  .tip b { color: var(--gold); margin-right: 4px; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .thumb { flex: none; width: 96px; height: 72px; border-radius: 3px; overflow: hidden; padding: 0; border: 1px solid #5b4b2e; background: #000; cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .info { flex: 1; min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 3px; }
  .tags span { font-size: 10.5px; font-weight: 800; letter-spacing: .3px; color: #fff; background: var(--rust); border-radius: 2px; padding: 1px 6px; }
  .tags .best { background: var(--rust); }
  .tags .special { background: var(--gold); color: #0a0909; }
  .tags .hot { background: transparent; color: var(--red); border: 1px solid #7a2a25; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 17px; font-weight: 800; }
  .row .unit { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .row .leader { flex: 1; min-width: 10px; border-bottom: 1px dotted #6d5b38; transform: translateY(-4px); }
  .price { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--red); }
  .price small { font-size: 11px; color: var(--muted); margin-left: 1px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .sizes span { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red); background: var(--paper-2); border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; }
  .sizes span small { color: var(--muted); }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 800; color: #0a0909; background: var(--gold); border-radius: 2px; padding: 0 4px; margin-right: 5px; }
  .desc { margin-top: 4px; font-size: 13px; color: #c3b8a1; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .sub.it { font-style: italic; }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: #0a0909; border-top: 1px solid var(--gold); color: var(--ink); padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); }
  .quote { text-align: center; font-size: 15px; line-height: 1.7; margin: 0 0 18px; color: var(--gold); }
  .quote small { display: block; margin-top: 4px; font-size: 12.5px; opacity: .8; }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--paper-2); border: 1px solid #5b4b2e; border-radius: 3px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: transparent; border: 1px solid var(--gold); }
  .pill i svg { width: 20px; height: 20px; color: var(--gold); }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--red); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; color: var(--muted); }

  .zoom { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(0,0,0,.92); cursor: zoom-out; }
  .zoom.show { display: grid; }
  .zoom figure { margin: 0; max-width: 560px; width: 100%; }
  .zoom img { width: 100%; border-radius: 3px; display: block; background: var(--paper); }
  .zoom figcaption { margin-top: 10px; text-align: center; font-size: 16px; font-weight: 800; color: var(--gold); }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--gold); color: #0a0909; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 3px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></i>
        <div><small id="callLabel"></small><strong id="callText"></strong></div>
      </a>
      <a class="pill" id="map" target="_blank" rel="noopener">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></i>
        <div><small id="mapLabel"></small><strong id="mapText"></strong></div>

<!-- override:start (tools/analytics.mjs 가 만듦, 직접 고치지 말 것) -->

<!-- override:end -->
<script>
  const LANGS = [["ko", "한국어"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"], ["vi", "Tiếng Việt"]];
  const UI = {
    ko: { title: "메뉴", tagline: "Nhà hàng Hàn Quốc · 한우·숙성 고기구이와 보일링 시푸드", chips: ["한우 미나리 육회 · 큐브 꽃살 스테이크", "평일 점심 특선 11:00 – 14:00"],
      must: "Must Try", best: "BEST", special: "스페셜", spicy: "🌶 매콤", tip: "TIP", market: "시가",
      quote: "정성을 다한 고기 한 점,<br>맛있게 드세요.<small>– 정성 Master grill House –</small>",
      copy: "복사", copied: "비밀번호를 복사했어요", hours: "영업시간", call: "전화 · 예약", map: "주소 · 지도", vnd: "가격 단위: 베트남 동(VND) · 메뉴·가격은 구글 지도에 올린 메뉴판 기준이며 바뀔 수 있어요 · VAT 별도" },
    en: { title: "Menu", tagline: "Korean restaurant · Premium Hanwoo, aged pork grill and boiling seafood", chips: ["Hanwoo Minari Yukhoe · Cube Flower-Cut Steak", "Weekday lunch specials 11:00 – 14:00"],
      must: "Must Try", best: "BEST", special: "Special", spicy: "🌶 Spicy", tip: "TIP", market: "Market price",
      quote: "Every piece of meat, grilled with sincere care.<br>Enjoy your meal.<small>– 정성 Master grill House –</small>",
      copy: "Copy", copied: "Password copied", hours: "Opening hours", call: "Call · Reservations", map: "Address · Map", vnd: "Prices in Vietnamese đồng (VND) · Menu and prices are based on the menu posted on Google Maps and may change · VAT not included" },
    zh: { title: "菜单", tagline: "韩国料理 · 韩牛与熟成烤肉、水煮海鲜", chips: ["韩牛芹菜生拌牛肉 · 方块花腹肉牛排", "工作日午间特餐 11:00 – 14:00"],
      must: "必吃", best: "人气", special: "特色", spicy: "🌶 辣", tip: "小贴士", market: "时价",
      quote: "用心烤制的每一块肉，<br>祝您用餐愉快。<small>– 정성 Master grill House –</small>",
      copy: "复制", copied: "密码已复制", hours: "营业时间", call: "电话 · 预订", map: "地址 · 地图", vnd: "价格单位：越南盾（VND）· 菜单和价格以谷歌地图上发布的菜单为准，可能会有变动 · 价格不含增值税（VAT）" },
    ja: { title: "メニュー", tagline: "韓国料理・韓牛と熟成肉の焼肉、ボイリングシーフード", chips: ["韓牛セリのユッケ ・ キューブ花サルステーキ", "平日ランチ特選 11:00 – 14:00"],
      must: "Must Try", best: "BEST", special: "スペシャル", spicy: "🌶 辛口", tip: "TIP", market: "時価",
      quote: "心を込めて焼いた一切れのお肉、<br>どうぞ美味しくお召し上がりください。<small>– 정성 Master grill House –</small>",
      copy: "コピー", copied: "パスワードをコピーしました", hours: "営業時間", call: "電話・ご予約", map: "住所・地図", vnd: "価格はベトナムドン（VND）です・メニューと価格はGoogleマップに掲載されたメニュー表に基づいており、変更される場合があります・VAT別" },
    vi: { title: "Thực đơn", tagline: "Nhà hàng Hàn Quốc · Thịt bò Hanwoo, thịt heo ủ lạnh nướng và hải sản luộc cay", chips: ["Gỏi bò Hanwoo rau cần nước · Bít tết thịt hoa cắt vuông", "Set trưa đặc biệt ngày thường 11:00 – 14:00"],
      must: "Must Try", best: "BEST", special: "Đặc biệt", spicy: "🌶 Cay", tip: "TIP", market: "Liên hệ",
      quote: "Từng miếng thịt được nướng bằng cả tấm lòng,<br>mời quý khách thưởng thức ngon miệng.<small>– 정성 Master grill House –</small>",
      copy: "Sao chép", copied: "Đã sao chép mật khẩu", hours: "Giờ mở cửa", call: "Gọi điện · Đặt bàn", map: "Địa chỉ · Bản đồ", vnd: "Giá tính bằng VND · Thực đơn và giá theo menu đăng trên Google Maps, có thể thay đổi · Chưa bao gồm VAT" },
  };
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const storage = (fn) => { try { return fn(localStorage); } catch { return null; } };
  let observer;

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  const fmt = (n) => n.toLocaleString("en-US");

  function priceHtml(it, t) {
    if (it.sizes) return `<div class="sizes">${it.sizes.map(([s, p]) => `<span><i>${s}</i>${fmt(p)}<small>₫</small></span>`).join("")}</div>`;
    return "";
  }

  function render(lang) {
    const t = UI[lang], R = window.RESTAURANT;
    // 아랫줄: 한국어 화면 → 베트남어(직원용), 그 외 → 한국어
    const second = lang === "ko" ? "vi" : "ko";
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand.ko} ${R.brand.en} · ${t.title}`;

    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    $("tagline").textContent = t.tagline;
    $("chips").innerHTML = t.chips.map((c) => `<span>${esc(c)}</span>`).join("");
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        <div class="head"><h2>${esc(cat.name[lang])}${lang !== "vi" ? `<small>${esc(cat.name.vi)}</small>` : `<small>${esc(cat.name.ko)}</small>`}</h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => {
          const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
          const single = it.sizes ? "" : `<span class="leader"></span><span class="price">${it.price == null ? esc(t.market) : `${fmt(it.price)}<small>₫</small>`}</span>`;
          return `
          <li>
            ${it.photo ? `<button class="thumb" type="button" data-photo="${it.photo}" data-cap="${esc(it.name[lang])}"><img src="${it.photo}" alt="${esc(it.name[lang])}" loading="lazy"></button>` : ""}
            <div class="info">
              ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
              <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(it.unit)}</span>` : ""}${single}</div>
              ${priceHtml(it, t)}
              ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
              <div class="sub ${second === "vi" ? "it" : ""}">${esc(it.name[second])}</div>
            </div>
          </li>`; }).join("")}
        </ul>
        ${cat.tip ? `<p class="tip"><b>${esc(t.tip)}</b>${esc(cat.tip[lang])}</p>` : ""}
      </section>`).join("");

    $("quote").innerHTML = t.quote;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = `Wi-Fi · ${R.wifi.ssid}`;
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    if (R.hours) {
      $("hours").hidden = false;
      $("hoursLabel").textContent = t.hours;
      $("hoursText").textContent = typeof R.hours === "string" ? R.hours : R.hours[lang];
    }
    $("callLabel").textContent = t.call;
    $("callText").textContent = R.phone;
    $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.brand.en + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (!b) return;
    $("zoomImg").src = b.dataset.photo;
    $("zoomCap").textContent = b.dataset.cap;
    $("zoom").classList.add("show");
  });
  $("zoom").addEventListener("click", () => $("zoom").classList.remove("show"));

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
