<style>
  :root {
    --paper: #15110f;
    --paper-2: #231b18;
    --band: #d02a33;
    --band-2: #8f1a22;
    --ink: #f5ede1;
    --muted: #b9ab9a;
    --line: #382d28;
    --rust: #d02a33;
    --gold: #f5b81c;
    /* 조리법 메뉴판의 사선 줄무늬 띠 */
    --stripes: repeating-linear-gradient(135deg, rgba(255,255,255,.10) 0 7px, transparent 7px 18px);
    /* 검정 카본 질감 */
    --carbon: repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; }
  body {
    margin: 0; color: var(--ink); background: var(--carbon), var(--paper);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  :lang(ko) body { word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단 ── */
  header { position: relative; overflow: hidden; text-align: center; padding: 12px 0 30px; background: linear-gradient(180deg, #0c0908, #15110f); border-bottom: 3px solid var(--band); }
  header::before { content: ""; position: absolute; top: 0; right: 0; width: 56%; height: 150px; background: linear-gradient(135deg, transparent 0 38%, var(--gold) 38% 41%, transparent 41% 44%, var(--band) 44% 46%, transparent 46%), var(--stripes);
    -webkit-mask: linear-gradient(225deg, #000 30%, transparent 75%); mask: linear-gradient(225deg, #000 30%, transparent 75%); pointer-events: none; }
  .langs { position: relative; z-index: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: rgba(0,0,0,.55); border: 1px solid #4a3a33; border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { color: #fff; background: var(--band); border-color: var(--gold); }
  .logo { display: block; width: 132px; height: auto; margin: 26px auto 0; }
  .logo.sign { width: 100%; max-width: 440px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; margin-top: 18px; border: 2px solid var(--gold); }
  h1 { margin: 12px 0 0; font-size: 32px; font-weight: 900; letter-spacing: 2px; line-height: 1.1; color: var(--gold); text-shadow: 0 2px 0 #6b4a00; }
  h1 span { color: #fff; }
  .en { margin: 8px 0 0; font-size: 16px; font-weight: 800; letter-spacing: 5px; color: #ff4a52; }
  .tagline { margin: 12px 0 0; font-size: 14.5px; font-weight: 600; color: #e9dcc6; }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 14px; position: relative; z-index: 1; }
  .chips span { font-size: 12.5px; font-weight: 700; color: var(--gold); background: rgba(0,0,0,.5); border: 1px solid #6b4a00; border-radius: 3px; padding: 4px 11px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: linear-gradient(90deg, var(--band) 0%, #7d161d 70%, #1a0c0c 100%); border-bottom: 2px solid var(--gold); box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 7px; padding-bottom: 7px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: #fbeed8; text-decoration: none; font-size: 14px; font-weight: 800; padding: 8px 12px; border-radius: 3px; white-space: nowrap; }
  nav a.active { color: #1a0f00; background: var(--gold); }

  /* ── 메뉴 ── */
  section { padding: 30px 0 6px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head::before, .head::after { content: none; }
  h2 { flex: 1; margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 1px; text-align: left; color: var(--gold); padding: 8px 14px; background: linear-gradient(90deg, var(--band) 0%, #6e1219 55%, transparent 100%), var(--stripes); border-left: 5px solid var(--gold); }
  h2 small { display: block; margin-top: 3px; font-size: 13px; font-weight: 500; letter-spacing: 0; color: #f3dcc8; }
  .note { margin: 12px 0 0; font-size: 13.5px; color: #e9dcc6; background: var(--paper-2); border-left: 3px solid var(--gold); border-radius: 0; padding: 8px 12px; }
  .tip { margin: 14px 0 0; font-size: 13.5px; color: var(--ink); background: var(--paper-2); border: 1px dashed #7a5a1a; border-radius: 4px; padding: 10px 12px; }
  .tip b { color: var(--gold); margin-right: 4px; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }

  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .info { flex: 1; min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 3px; }
  .tags span { font-size: 10.5px; font-weight: 800; letter-spacing: .3px; color: #fff; background: var(--rust); border-radius: 3px; padding: 1px 6px; }
  .tags .best { background: var(--band-2); border: 1px solid var(--gold); }
  .tags .special { background: var(--gold); color: #1a0f00; }
  .tags .hot { background: transparent; color: #ff6a55; border: 1px solid #8f3a2e; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 17px; font-weight: 800; color: #fff; min-width: 0; overflow-wrap: anywhere; }
  .row .unit { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .row .leader { flex: 1; min-width: 4px; border-bottom: 2px dotted #6b5a45; transform: translateY(-4px); }
  .price { font-size: 16px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price small { font-size: 11px; color: var(--muted); margin-left: 1px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .sizes span { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); background: var(--paper-2); border: 1px solid #6b4a00; border-radius: 3px; padding: 2px 8px; }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--band); border-radius: 2px; padding: 0 4px; margin-right: 5px; }
  .desc { margin-top: 4px; font-size: 13px; color: #d4c6b3; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .sub.it { font-style: italic; }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: var(--stripes), #0c0908; border-top: 4px solid var(--band); color: #f3ecdf; padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); }
  .quote { text-align: center; color: var(--gold); font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .quote small { display: block; margin-top: 4px; font-size: 12.5px; opacity: .8; }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--paper-2); border: 1px solid #6b4a00; border-radius: 4px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 3px; display: grid; place-items: center; background: var(--band); }
  .pill i svg { width: 20px; height: 20px; color: #fff; }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--gold); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; opacity: .8; }

  .zoom { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px; background: rgba(0,0,0,.92); cursor: zoom-out; }
  .zoom.show { display: grid; }
  .zoom figure { margin: 0; max-width: 560px; width: 100%; }
  .zoom img { width: 100%; border-radius: 4px; display: block; background: var(--paper); border: 2px solid var(--gold); }
  .zoom figcaption { margin-top: 10px; text-align: center; font-size: 16px; font-weight: 800; color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--band); color: #fff; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 4px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

    $("chips").innerHTML = t.chips.map((c) => `<span>${esc(c)}</span>`).join("");
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        <div class="head"><h2>${esc(cat.name[lang])}${lang !== "vi" ? `<small>${esc(cat.name.vi)}</small>` : `<small>${esc(cat.name.ko)}</small>`}</h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => {
          const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
          const single = it.sizes ? "" : `<span class="leader"></span><span class="price">${it.price == null ? esc(t.market) : `${fmt(it.price)}<small>₫</small>`}</span>`;
          return `
          <li>
            ${it.photo ? `<button class="thumb" type="button" data-photo="${it.photo}" data-cap="${esc(it.name[lang])}"><img src="${it.photo}" alt="${esc(it.name[lang])}" loading="lazy"></button>` : ""}
            <div class="info">
              ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
              <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(typeof it.unit === "string" ? it.unit : (it.unit[lang] || it.unit.en))}</span>` : ""}${single}</div>
              ${priceHtml(it, t)}
              ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
              <div class="sub ${second === "vi" ? "it" : ""}">${esc(it.name[second])}</div>
            </div>
          </li>`; }).join("")}
        </ul>
        ${cat.tip ? `<p class="tip"><b>${esc(t.tip)}</b>${esc(cat.tip[lang])}</p>` : ""}
      </section>`).join("");

    $("quote").innerHTML = t.quote;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = `Wi-Fi · ${R.wifi.ssid}`;
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    if (R.hours) {
      $("hours").hidden = false;
      $("hoursLabel").textContent = t.hours;
      $("hoursText").textContent = typeof R.hours === "string" ? R.hours : R.hours[lang];
    }
    $("callLabel").textContent = t.call;
    $("callText").textContent = R.phone;
    $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.brand.en + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest(".thumb");
    if (!b) return;
    $("zoomImg").src = b.dataset.photo;
    $("zoomCap").textContent = b.dataset.cap;
    $("zoom").classList.add("show");
  });
  $("zoom").addEventListener("click", () => $("zoom").classList.remove("show"));

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
