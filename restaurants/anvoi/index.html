<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f3">
<title>Ăn Vội · Mì Trộn Siu Dính</title>
<meta name="description" content="Ăn Vội — Mì Trộn Siu Dính · 157/45 Hùng Vương, Quảng Ngãi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6f3;
    --card: #ffffff;
    --wine: #7c2a2a;
    --rose: #a95c58;
    --blush: #f6e1dc;
    --blush-2: #fbeeea;
    --line: #efd9d3;
    --text: #4a2a28;
    --muted: #9a7b77;
    --orange: #e8742c;
    --sun: #f6c445;
    --round: "Baloo 2", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; }
  body {
    margin: 0; color: var(--text); background: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Noto Sans SC", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.4;
    background-image: radial-gradient(var(--blush) 1.2px, transparent 1.3px);
    background-size: 18px 18px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .round { font-family: var(--round); }
  :lang(ko) body { word-break: keep-all; }

  /* ── 헤더 ── */
  header { position: relative; text-align: center; padding: 14px 0 26px; overflow: hidden; }
  header::before { /* 왼쪽 위 와인색 물결 (원래 메뉴판 모티프) */
    content: ""; position: absolute; left: -60px; top: -90px; width: 260px; height: 200px; border-radius: 0 0 60% 40%;
    background: var(--rose); opacity: .9; z-index: 0;
  }
  header > * { position: relative; z-index: 1; }
  .langs { display: flex; justify-content: flex-end; gap: 5px; flex-wrap: wrap; }
  .langs button {
    font: inherit; font-size: 12.5px; font-weight: 700; color: var(--rose);
    background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { color: #fff; background: var(--wine); border-color: var(--wine); }
  .logo { display: block; width: min(46vw, 190px); margin: 10px auto 0; mix-blend-mode: multiply; }
  .pill {
    display: inline-block; margin-top: 8px; padding: 6px 22px 4px; border-radius: 999px;
    background: var(--rose); color: #fff; font-family: var(--round); font-weight: 800; font-size: 22px; letter-spacing: .3px;
    box-shadow: 0 6px 0 rgba(124, 42, 42, .18);
  }
  .tags { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .tags span { font-size: 12px; font-weight: 700; color: var(--wine); background: #fff; border: 1.5px dashed var(--rose); border-radius: 999px; padding: 3px 10px; }

  /* ── 카테고리 탭 ── */
  nav { position: sticky; top: 0; z-index: 10; background: rgba(253, 246, 243, .94); backdrop-filter: blur(8px); border-bottom: 1.5px solid var(--line); }
  nav .wrap { position: relative; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-top: 9px; padding-bottom: 9px; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a { flex: none; color: var(--rose); text-decoration: none; font-weight: 800; font-size: 14px; padding: 7px 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); white-space: nowrap; }
  nav a.active { color: #fff; background: var(--wine); border-color: var(--wine); }

  /* ── 섹션 ── */
  main { padding: 18px 0 6px; display: grid; gap: 22px; }
  section {
    background: var(--card); border: 2px dashed var(--line); border-radius: 22px; padding: 16px 16px 8px;
    box-shadow: 0 10px 24px rgba(169, 92, 88, .08);
  }
  .banner { margin: -4px -4px 14px; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h2 { margin: 0; font-family: var(--round); font-size: 30px; font-weight: 800; color: var(--wine); line-height: 1.05; }
  h2 small { display: block; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
  .notes { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .notes li { font-size: 13px; font-weight: 600; color: var(--wine); background: var(--blush-2); border-radius: 10px; padding: 6px 10px 6px 30px; position: relative; }
  .notes li::before { content: "✦"; position: absolute; left: 11px; top: 6px; color: var(--orange); }

  .colhead { display: flex; justify-content: flex-end; gap: 6px; margin: 14px 0 0; }
  .colhead span { width: 78px; text-align: center; font-size: 12px; font-weight: 800; padding: 3px 0; border-radius: 6px; }
  .colhead span:nth-child(1) { background: #f4c9cc; color: var(--wine); }
  .colhead span:nth-child(2) { background: #f3dcae; color: #8a5a10; }

  ul.items { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.items > li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1.5px dotted var(--line); }
  ul.items > li:last-child { border-bottom: 0; }
  .thumb { flex: none; width: 58px; height: 58px; border-radius: 14px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .info { flex: 1; min-width: 0; }
  .info b { font-size: 16.5px; font-weight: 800; color: var(--text); }
  .info .hot { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; color: #fff; background: var(--orange); border-radius: 999px; padding: 1px 7px; vertical-align: 2px; }
  .info .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .info .desc { display: block; font-size: 13px; color: var(--rose); margin-top: 3px; }
  .info ol { margin: 6px 0 0; padding: 0 0 0 18px; font-size: 13.5px; color: var(--text); }
  .info ol li { margin: 2px 0; }
  .info ol li::marker { color: var(--orange); font-weight: 800; }
  .price { flex: none; font-family: var(--round); font-weight: 800; font-size: 18px; color: var(--wine); white-space: nowrap; }
  .prices { flex: none; display: flex; gap: 6px; }
  .prices span { width: 78px; text-align: center; font-family: var(--round); font-weight: 800; font-size: 16.5px; color: var(--wine); }
  .prices small, .price small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .pricecol { display: block; font-family: system-ui, sans-serif; font-size: 10px; font-weight: 800; color: var(--muted); }

  /* 콤보 카드 */
  #combo ul.items > li { align-items: flex-start; background: var(--blush-2); border: 0; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  #combo .price { font-size: 22px; }

  /* ── 하단 ── */
  footer.wrap { padding-top: 28px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
  .store { border-radius: 22px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 10px 24px rgba(169, 92, 88, .15); }
  .store img { display: block; width: 100%; aspect-ratio: 6 / 5; object-fit: cover; }
  .perks { display: grid; gap: 6px; margin: 16px 0; }
  .perks div { font-size: 13.5px; font-weight: 700; color: var(--wine); text-align: center; }
  .cards { display: grid; gap: 10px; }
  .card {
    display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; color: var(--text); text-decoration: none; text-align: left;
    background: #fff; border: 2px solid var(--rose); border-radius: 999px; padding: 6px 18px 6px 6px; cursor: pointer;
  }
  .card i { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--rose); display: grid; place-items: center; }
  .card svg { width: 20px; height: 20px; color: #fff; }
  .card div { flex: 1; min-width: 0; }
  .card small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
  .card strong { display: block; font-size: 16px; color: var(--wine); word-break: break-word; }
  .card em { flex: none; font-style: normal; font-size: 12px; font-weight: 800; color: var(--rose); }
  .vnd { text-align: center; font-size: 12px; color: var(--muted); margin: 16px 0 0; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 20;
    background: var(--wine); color: #fff; font-size: 14px; font-weight: 700;
    padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header class="wrap">
  <div class="langs" id="langs"></div>
  <img class="logo" src="img/logo.jpg" alt="Ăn Vội" width="413" height="410">
  <div class="pill">Mì Trộn Siu Dính</div>
  <div class="tags" id="tags"></div>
</header>

<nav><div class="wrap" id="nav"></div></nav>

<main class="wrap" id="menu"></main>

<footer class="wrap">
  <div class="store"><img src="img/store.jpg" alt="Ăn Vội — 157/45 Hùng Vương" loading="lazy"></div>
  <div class="perks" id="perks"></div>
  <div class="cards" id="cards"></div>
  <p class="vnd" id="foot"></p>
</footer>
<div class="toast" id="toast"></div>

<script src="menu.js"></script>
<script>
  const LANGS = [["vi", "Tiếng Việt"], ["ko", "한국어"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"]];
  const UI = {
    vi: { title: "Thực đơn", copy: "Sao chép", copied: "Đã sao chép mật khẩu", call: "Gọi điện · Đặt món", map: "Địa chỉ · Bản đồ", vnd: "Giá tính bằng VND (đ)", tags: ["Sốt nhà làm", "Ship từ 50k", "Tặng nước ngọt"] },
    ko: { title: "메뉴", copy: "복사", copied: "비밀번호를 복사했어요", call: "전화 · 주문", map: "주소 · 지도", vnd: "가격 단위: 베트남 동(đ)", tags: ["직접 만든 소스", "50k 이상 배달", "음료 무료"] },
    en: { title: "Menu", copy: "Copy", copied: "Password copied", call: "Call · Order", map: "Address · Map", vnd: "Prices in Vietnamese đồng (đ)", tags: ["Homemade sauce", "Delivery from 50k", "Free drink"] },
    zh: { title: "菜单", copy: "复制", copied: "密码已复制", call: "电话 · 点餐", map: "地址 · 地图", vnd: "价格单位：越南盾（đ）", tags: ["自家特制酱", "满50k外送", "赠送汽水"] },
    ja: { title: "メニュー", copy: "コピー", copied: "パスワードをコピーしました", call: "電話・ご注文", map: "住所・地図", vnd: "価格はベトナムドン（đ）です", tags: ["自家製ソース", "50kから配達", "ドリンク無料"] },
  };

  let observer;
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function storage(fn) { try { return fn(localStorage); } catch { return null; } }

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 베트남어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  const fmt = (n) => n.toLocaleString("vi-VN");

  function priceHTML(it, cat) {
    if (it.prices) {
      const cols = it.cols || cat.cols;
      const showLabels = !cat.cols || it.cols; // 섹션 위에 열 제목이 없을 때만 칸마다 라벨
      return `<div class="prices">${it.prices.map((p, i) =>
        `<span>${showLabels ? `<small class="pricecol">${esc(cols[i])}</small>` : ""}${fmt(p)}</span>`).join("")}</div>`;
    }
    if (it.priceText) return `<div class="price">${esc(it.priceText)}<small>đ</small></div>`;
    return `<div class="price">${fmt(it.price)}<small>đ</small></div>`;
  }

  function render(lang) {
    const t = UI[lang];
    const R = window.RESTAURANT;
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand} · ${t.title}`;

    $("langs").innerHTML = LANGS.map(([c, label]) =>
      `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    $("tags").innerHTML = t.tags.map((s) => `<span>${esc(s)}</span>`).join("");
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        ${cat.photo ? `<div class="banner"><img src="${cat.photo}" alt="" loading="lazy"></div>` : ""}
        <h2>${esc(cat.name[lang])}${lang !== "vi" ? `<small>${esc(cat.name.vi)}</small>` : ""}</h2>
        ${cat.notes ? `<ul class="notes">${cat.notes.map((n) => `<li>${esc(n[lang])}</li>`).join("")}</ul>` : ""}
        ${cat.cols ? `<div class="colhead">${cat.cols.map((c) => `<span>${esc(c)}</span>`).join("")}</div>` : ""}
        <ul class="items">${cat.items.map((it) => `
          <li>
            ${it.photo ? `<img class="thumb" src="${it.photo}" alt="" loading="lazy">` : ""}
            <div class="info">
              <b>${esc(it.name[lang])}</b>${it.hot ? `<span class="hot">★</span>` : ""}
              ${lang !== "vi" ? `<span class="sub">${esc(it.name.vi)}</span>` : ""}
              ${it.desc ? `<span class="desc">${esc(it.desc[lang])}</span>` : ""}
              ${it.list ? `<ol>${it.list.map((l) => `<li>${esc(l[lang])}</li>`).join("")}</ol>` : ""}
            </div>
            ${priceHTML(it, cat)}
          </li>`).join("")}
        </ul>
      </section>`).join("");

    $("perks").innerHTML = Object.values(EXTRA).map((e) => `<div>✦ ${esc(e[lang])}</div>`).join("");
    renderCards(t, R);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  const ICONS = {
    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></svg>',
    call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',
    map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  };

  function renderCards(t, R) {
    const cards = [];
    if (R.wifi) cards.push(`<button class="card" id="wifi" type="button"><i>${ICONS.wifi}</i><div><small>Wi-Fi · ${esc(R.wifi.ssid)}</small><strong>${esc(R.wifi.password)}</strong></div><em>${esc(t.copy)}</em></button>`);
    for (const p of R.phones || []) cards.push(`<a class="card" href="tel:${esc(p.replace(/\s/g, ""))}"><i>${ICONS.call}</i><div><small>${esc(t.call)}</small><strong>${esc(p)}</strong></div></a>`);
    const href = R.mapUrl || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("Ăn Vội " + R.address);
    cards.push(`<a class="card" target="_blank" rel="noopener" href="${esc(href)}"><i>${ICONS.map}</i><div><small>${esc(t.map)}</small><strong>${esc(R.address)}</strong></div></a>`);
    $("cards").innerHTML = cards.join("");
    $("wifi")?.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(R.wifi.password); toast(UI[lang].copied); }
      catch { toast(R.wifi.password); }
    });
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
</body>
</html>
