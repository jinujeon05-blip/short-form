<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ăn Vội · Thẻ QR</title>
<style>
  @font-face { font-family: "Gmarket"; src: url("../../../public/fonts/GmarketSansTTFBold.ttf"); }
  @page { size: 105mm 148mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --cream: #fdf6f3; --wine: #7c2a2a; --rose: #a95c58; --blush: #f6e1dc; --orange: #e8742c; }
  html, body { background: #fff; }
  body { font-family: "Inter", "Gmarket", "IPAGothic", "WenQuanYi Zen Hei", sans-serif; color: var(--wine); }
  .card {
    position: relative; width: 105mm; height: 148mm; overflow: hidden; background: var(--cream);
    background-image: radial-gradient(var(--blush) .35mm, transparent .4mm); background-size: 4.6mm 4.6mm;
    display: flex; flex-direction: column; align-items: center;
  }
  .card::before { /* 왼쪽 위 로즈 물결 (메뉴판 모티프) */
    content: ""; position: absolute; left: -16mm; top: -24mm; width: 62mm; height: 46mm; border-radius: 0 0 60% 40%; background: var(--rose);
  }
  .logo { position: relative; width: 30mm; height: auto; margin-top: 3.5mm; mix-blend-mode: multiply; }
  .pill {
    position: relative; margin-top: 1.2mm; padding: 1.4mm 5mm 1.1mm; border-radius: 99mm; background: var(--rose); color: #fff;
    font-weight: 900; font-size: 4.6mm; letter-spacing: .2mm; box-shadow: 0 1.2mm 0 rgba(124, 42, 42, .18);
  }
  .qr-box {
    position: relative; margin-top: 3.6mm; background: #fff; border: .6mm dashed var(--rose); border-radius: 5mm; padding: 1.6mm;
  }
  .qr-box img { display: block; width: 44mm; height: 44mm; }
  .qr-box .badge {
    position: absolute; right: -4mm; top: -3.5mm; transform: rotate(8deg);
    background: #0068ff; color: #fff; font-weight: 900; font-size: 2.7mm; padding: 1mm 2.2mm; border-radius: 99mm;
  }
  .cta { position: relative; margin-top: 2.6mm; text-align: center; }
  .cta h1 { font-weight: 900; font-size: 5.2mm; line-height: 1.1; letter-spacing: .1mm; color: var(--wine); }
  .cta h1 span { color: var(--orange); }
  .h1-en { margin-top: 1mm; font-family: "Inter", sans-serif; font-weight: 800; font-size: 3.4mm; letter-spacing: .45mm; color: inherit; text-align: center; }
  .h1-en span { color: var(--orange); }
  .langs { display: flex; flex-wrap: wrap; justify-content: center; gap: .7mm 3.5mm; justify-content: center; margin-top: 2.2mm; text-align: left; }
  .langs div { font-size: 2.6mm; color: var(--rose); white-space: nowrap; }
  .langs em { font-style: normal; display: inline-block; width: 4.6mm; font-size: 1.9mm; font-weight: 800; color: var(--orange); }
  .ko { font-family: "Gmarket", sans-serif; }
  .zh { font-family: "WenQuanYi Zen Hei", sans-serif; }
  .ja { font-family: "IPAGothic", sans-serif; }
  .chips { position: relative; display: flex; gap: 1.4mm; justify-content: center; margin-top: 2mm; }
  .chips span { font-size: 2.3mm; font-weight: 800; color: var(--wine); background: #fff; border: .3mm dashed var(--rose); border-radius: 99mm; padding: .6mm 2mm; }
  footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 17mm; background: var(--rose); color: #fff;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .9mm;
  }
  footer .tel { font-weight: 900; font-size: 3.4mm; letter-spacing: .15mm; }
  footer .tel b { font-size: 2.2mm; background: #fff; color: #0068ff; border-radius: 1mm; padding: .2mm 1mm; margin-right: 1mm; vertical-align: .3mm; }
  footer .addr { font-size: 2.6mm; font-weight: 600; opacity: .95; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="../img/logo.jpg" alt="Ăn Vội">
  <div class="pill">Mì Trộn Siu Dính</div>
  <div class="qr-box">
    <img src="qr.svg" alt="QR https://anvoi-menu.vercel.app">
    <span class="badge">Đặt qua Zalo</span>
  </div>
  <div class="cta">
    <h1>QUÉT MÃ <span>XEM MENU</span><br>&amp; ĐẶT MÓN</h1>
    <div class="h1-en">SCAN QR · <span>MENU &amp; ORDER</span></div>
    <div class="langs">
      <div><em>KO</em><span class="ko">메뉴 보기 · 주문</span></div>
      <div><em>ZH</em><span class="zh">扫码看菜单 · 点餐</span></div>
      <div><em>JA</em><span class="ja">メニュー・注文</span></div>
    </div>
  </div>
  <div class="chips"><span>Sốt nhà làm</span><span>Gom đơn trường học &amp; lân cận – miễn phí ship</span></div>
  <footer>
    <div class="tel"><b>Zalo</b>0969 092 694 · ☎ 0944 837 894</div>
    <div class="addr">157/45 Hùng Vương – Quảng Ngãi</div>
  </footer>
</div>
</body>
</html>
