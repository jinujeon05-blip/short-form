<style>
  :root {

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 60px; }
  body {

  header { position: relative; color: #fff; text-align: center; padding: 12px 0 46px;
    background:

      linear-gradient(180deg, var(--brick-2), var(--brick)); }
  header::after { /* 아래쪽 성가퀴 */
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 22px;

  }
  .langs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 600; color: #e6efe5; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 5px 11px; cursor: pointer; }

  .gate { display: block; width: 190px; height: auto; margin: 24px auto 0; }

  .quote::before { content: "“ "; color: var(--gold); }
  .quote::after { content: " ”"; color: var(--gold); }

  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li { padding: 13px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }

  .row .unit { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }

  .price { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--brick); }
  .price small { font-size: 11px; color: var(--muted); margin-left: 1px; }
  .price.ask { font-size: 13px; color: var(--muted); }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .sizes span { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
  .sizes span i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--brick); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
  .sizes span.after i { background: var(--gold); }
  .desc { margin-top: 4px; font-size: 13px; color: #5d544b; }
  .sub { margin-top: 3px; font-size: 13px; color: var(--muted); }

  /* ── 가게 정보 ── */
  footer { margin-top: 40px; background: var(--brick); color: #e6efe5; padding: 30px 0 calc(28px + env(safe-area-inset-bottom)); }
  .thanks { text-align: center; font-size: 15px; line-height: 1.7; margin: 0 0 18px; }
  .pills { display: grid; gap: 10px; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; text-align: left; color: var(--ink); text-decoration: none; background: var(--paper); border: 0; border-radius: 16px; padding: 10px 14px 10px 10px; cursor: pointer; }
  .pill i { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brick); }
  .pill i svg { width: 20px; height: 20px; color: #fff; }
  .pill div { flex: 1; min-width: 0; }
  .pill small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill strong { display: block; font-size: 16px; font-weight: 800; word-break: break-word; }
  .pill em { flex: none; font-style: normal; font-size: 12px; font-weight: 700; color: var(--brick); }
  .vnd { text-align: center; margin: 16px 0 0; font-size: 12px; opacity: .85; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 40; background: var(--brick); color: #fff; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

<script>
  const LANGS = [["ko", "한국어"], ["en", "English"], ["zh", "中文"], ["ja", "日本語"], ["vi", "Tiếng Việt"]];
  const UI = {
    ko: { title: "메뉴", tagline: "김밥 · 떡볶이 · 쫄면 · 라면 · 모듬튀김", free: "무료", new: "신메뉴", best: "BEST", special: "추천", spicy: "🌶 매콤", ask: "가격 문의", after: "후식",
      thanks: "굿데이 김밥을 찾아 주셔서 감사합니다.<br>오늘도 좋은 하루 되세요!", copy: "복사", copied: "비밀번호를 복사했어요",
      call: "전화", map: "주소 · 지도", vnd: "가격 단위: 베트남 동(VND) · 가게가 구글 지도에 올린 메뉴판 기준이라 지금과 다를 수 있어요" },
    en: { title: "Menu", tagline: "Kimbap · Tteokbokki · Jjolmyeon · Ramen · Fried platter", free: "Free", new: "NEW", best: "BEST", special: "Recommended", spicy: "🌶 Spicy", ask: "Ask staff", after: "Dessert",
      thanks: "Thank you for visiting Good Day Kimbap.<br>Have a good day!", copy: "Copy", copied: "Password copied",
      call: "Call", map: "Address · Map", vnd: "Prices in VND · Based on the menu posted on Google Maps; prices may have changed" },
    zh: { title: "菜单", tagline: "紫菜包饭 · 炒年糕 · 拌面 · 拉面 · 炸物", free: "免费", new: "新品", best: "人气", special: "推荐", spicy: "🌶 辣", ask: "请询问店员", after: "甜点",
      thanks: "感谢您光临 Good Day 紫菜包饭。<br>祝您今天愉快！", copy: "复制", copied: "密码已复制",
      call: "电话", map: "地址 · 地图", vnd: "价格单位：越南盾（VND）· 根据店家在谷歌地图上传的菜单，价格可能已变动" },
    ja: { title: "メニュー", tagline: "キンパ・トッポッキ・チョルミョン・ラーメン・揚げ物", free: "無料", new: "NEW", best: "BEST", special: "おすすめ", spicy: "🌶 辛口", ask: "店員にお尋ねください", after: "デザート",
      thanks: "グッデイキンパへようこそ。<br>良い一日をお過ごしください！", copy: "コピー", copied: "パスワードをコピーしました",
      call: "電話", map: "住所・地図", vnd: "価格はベトナムドン（VND）・Googleマップに投稿されたメニュー基準のため変更の場合あり" },
    vi: { title: "Thực đơn", tagline: "Kimbap · Tokbokki · Mì trộn cay · Mì ramen · Đồ chiên", free: "Miễn phí", new: "MỚI", best: "BEST", special: "Đề xuất", spicy: "🌶 Cay", ask: "Hỏi nhân viên", after: "Tráng miệng",
      thanks: "Cảm ơn quý khách đã đến Good Day Kimbap.<br>Chúc quý khách một ngày tốt lành!", copy: "Sao chép", copied: "Đã sao chép mật khẩu",
      call: "Gọi điện", map: "Địa chỉ · Bản đồ", vnd: "Giá tính bằng VND · Theo thực đơn quán đăng trên Google Maps, giá có thể đã thay đổi" },
  };
  const SUPPORTED = LANGS.map(([c]) => c);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const storage = (fn) => { try { return fn(localStorage); } catch { return null; } };
  const fmt = (n) => n.toLocaleString("en-US");
  const won = (n) => `${fmt(n)}<small>₫</small>`;
  let observer;

  // 우선순위: ?lang= → 손님이 직접 고른 언어 → 휴대폰 언어 → 영어
  function detectLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.includes(q)) return q;
    const saved = storage((s) => s.getItem("menu-lang"));
    if (SUPPORTED.includes(saved)) return saved;
    for (const l of navigator.languages || [navigator.language]) {
      const code = (l || "").toLowerCase().split("-")[0];
      if (SUPPORTED.includes(code)) return code;
    }
    return "en";
  }

  function itemHtml(it, t, lang, second) {
    const tags = [it.tag ? `<span class="${it.tag}">${esc(t[it.tag])}</span>` : "", it.spicy ? `<span class="hot">${esc(t.spicy)}</span>` : ""].join("");
    const single = it.sizes ? "" : `<span class="leader"></span><span class="price ${it.price == null ? "ask" : ""}">${it.price == null ? esc(t.ask) : it.price === 0 ? esc(t.free) : won(it.price)}</span>`;
    const sizes = it.sizes ? it.sizes.map(([label, p]) => `<span><i>${esc(label[lang])}</i>${won(p)}</span>`)
      : it.dessert ? [`<span class="after"><i>${esc(t.after)}</i>${won(it.dessert)}</span>`] : [];
    return `
      <li>
        ${tags.trim() ? `<div class="tags">${tags}</div>` : ""}
        <div class="row"><b>${esc(it.name[lang])}</b>${it.unit ? `<span class="unit">${esc(it.unit)}</span>` : ""}${single}</div>
        ${sizes.length ? `<div class="sizes">${sizes.join("")}</div>` : ""}
        ${it.desc ? `<div class="desc">${esc(it.desc[lang])}</div>` : ""}
        <div class="sub">${esc(it.name[second])}</div>
      </li>`;
  }

  function render(lang) {
    const t = UI[lang], R = window.RESTAURANT;
    // 아랫줄: 한국어 화면 → 베트남어(직원과 소통용), 그 외 → 한국어
    const second = lang === "ko" ? "vi" : "ko";
    document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
    document.title = `${R.brand.en} ${R.brand.ko} · ${t.title}`;

    $("langs").innerHTML = LANGS.map(([c, label]) => `<button type="button" data-lang="${c}" aria-pressed="${c === lang}">${label}</button>`).join("");
    $("branch").textContent = `${R.brand.branch} · Ciputra · Hà Nội`;
    $("tagline").textContent = t.tagline;
    $("nav").innerHTML = MENU.map((cat) => `<a href="#${cat.id}">${esc(cat.name[lang])}</a>`).join("");

    $("menu").innerHTML = MENU.map((cat) => `
      <section id="${cat.id}">
        ${cat.photo ? `<img class="banner" src="${cat.photo}" alt="${esc(cat.name[lang])}" loading="lazy">` : ""}
        <div class="head"><h2 class="serif">${esc(cat.name[lang])}<small>${esc(cat.name[lang === "vi" ? "ko" : "vi"])}</small></h2></div>
        ${cat.note ? `<p class="note">${esc(cat.note[lang])}</p>` : ""}
        <ul>${cat.items.map((it) => itemHtml(it, t, lang, second)).join("")}</ul>
        ${cat.quote ? `<p class="quote">${esc(cat.quote[lang])}</p>` : ""}
      </section>`).join("");

    $("thanks").innerHTML = t.thanks;
    if (R.wifi) {
      $("wifi").hidden = false;
      $("wifiLabel").textContent = R.wifi.ssid ? `Wi-Fi · ${R.wifi.ssid}` : "Wi-Fi";
      $("wifiText").textContent = R.wifi.password;
      $("wifiCopy").textContent = t.copy;
    }
    $("call").hidden = !R.phone;
    if (R.phone) {
      $("callLabel").textContent = t.call;
      $("callText").textContent = R.phone;
      $("call").href = "tel:" + R.phone.replace(/[^\d+]/g, "");
    }
    $("mapLabel").textContent = t.map;
    $("mapText").textContent = R.address;
    $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(R.mapQuery + " " + R.address);
    $("foot").textContent = t.vnd;
    observeSections();
  }

  let lang = detectLang();
  render(lang);

  $("langs").addEventListener("click", (e) => {
    const c = e.target.closest("button")?.dataset.lang;
    if (!c || c === lang) return;
    lang = c;
    storage((s) => s.setItem("menu-lang", c));
    render(lang);
  });

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }
  $("wifi").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(RESTAURANT.wifi.password); toast(UI[lang].copied); }
    catch { toast(RESTAURANT.wifi.password); }
  });

  // 스크롤 위치에 맞춰 상단 카테고리 강조
  function observeSections() {
    observer?.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        document.querySelectorAll("nav a").forEach((a) => {
          const on = a.getAttribute("href") === "#" + e.target.id;
          a.classList.toggle("active", on);
          if (on) a.parentElement.scrollTo({ left: a.offsetLeft - a.parentElement.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
        });
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => observer.observe(s));
  }
</script>
